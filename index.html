<style>
/* 色 = LEENAI 共通テーマ (4 モード: ダーク · ライト · LEENAI · FOCUS) の変数 + この TOOL の状態 5 色 (モードごと) — v0.2 형님 D4 「모드 4개」
   背景 --bg · 面 --surface · 文字 --text/--text2/--text3 · 線 --border · ボタン --accent-btn · リンク --accent (共通ファイル)。
   この TOOL の色は下の 2 つの表 (明るい 3 モード · ダーク) だけ — 直すときは表だけ (tests/theme.js が 4 モードの読みやすさを計算)
   v0.6 (형님 D1): 待ち = 赤い太字 (背景はごく薄く) — 目立つ順 相違 (赤い背景) > 待ち (赤い字) > 確認 (黄) */
html{--dt-on-accent:#FFFFFF;
  --st-done-bg:#E6F2EA;--st-done-fg:#1F4A36;--st-todo-bg:#FBEFD9;--st-todo-fg:#6B4508;--st-diff-bg:#FBE3DE;--st-diff-fg:#7A2416;
  --st-wait-bg:#FFF7F5;--st-wait-fg:#B3261E;--st-unk-bg:#E4E5E2;--st-unk-fg:#454D48;--st-na-fg:#4F5751;--dt-dot-wait:#C62828;--dt-dot-unk:#6F7871;--td-late-bg:#7A2416;--td-late-fg:#FFFFFF;--td-chase-bg:#E6EEF8;--td-chase-fg:#24405E;--dt-hl:#FFF6E0;--dt-now:#E3F0E8;
  --rs-ok:#1E6B3A;--rs-note:#6E5A00;--rs-ng:#A3200F;--rs-read:#9A4300;--rs-na:#5F6763;--rs-note-bar:#C9A800;--rs-read-bar:#E07A1F;--dv-hl:rgba(255,214,0,.30);--dv-hl-line:#E0A800;
  --mk-ok-bg:#E3F3E8;--mk-ok-fg:#15803D;--mk-now-bg:#FCEBD0;--mk-now-fg:#9A4A06;--mk-ng-bg:#FBE0E0;--mk-ng-fg:#B42318;--mk-wait-bg:#E1ECFA;--mk-wait-fg:#1D5FB8;--mk-todo-bg:#ECEEF1;--mk-todo-fg:#5B6472;--mk-na-fg:#8A939E;--mk-unk-bg:#ECEEF1;--mk-unk-fg:#5B6472;
  --bd-late:#ef4444;--bd-today:#f59e0b;--bd-soon:#3b82f6;--du-late-bg:#FBE0E0;--du-late-fg:#9B1C1C;--du-today-bg:#FCEBD0;--du-today-fg:#7A4300;--du-soon-bg:#E1ECFA;--du-soon-fg:#1E3A5F;
  --v8-ts-on:#DCF2E3;--v8-alt:rgba(0,0,0,.025);--v8-sel:#E6EEFC;--v8-line:#2f6fe4;--v8-req-bg:#FBE0E0;--v8-req-fg:#9B1C1C;--v8-req-bd:#F1B5B5;--v8-band:#EEF3FA;--v8-band-bd:#D5E0EE;--v8-link:#1D5FB8;--v8-sub:#5F6873;--v8-today-bg:#fde047;--v8-today-fg:#1a1a1a}   /* v0.22 (V5): 一致 緑 · 表記差 黄 · 相違 赤 (太字) · 読めず 橙 · 対象外 灰 */
html:not([data-theme]),html[data-theme="dark"]{--dt-on-accent:#FFFFFF;
  --st-done-bg:#143A27;--st-done-fg:#8EE8AE;--st-todo-bg:#3D2C0C;--st-todo-fg:#F7CF6B;--st-diff-bg:#441A1A;--st-diff-fg:#FDA4A4;
  --st-wait-bg:#1E1A24;--st-wait-fg:#FF8A80;--st-unk-bg:#2C3148;--st-unk-fg:#C2CAD8;--st-na-fg:#9AA3B5;--dt-dot-wait:#FF6F61;--dt-dot-unk:#8F98AB;--td-late-bg:#C8402F;--td-late-fg:#FFFFFF;--td-chase-bg:#1E2A3B;--td-chase-fg:#A9C7EE;--dt-hl:#2B2512;--dt-now:#1D3328;
  --rs-ok:#8EE8AE;--rs-note:#F5DC5A;--rs-ng:#FF9C8F;--rs-read:#FFB26B;--rs-na:#A3ACBD;--rs-note-bar:#E8C930;--rs-read-bar:#FF9A3D;--dv-hl:rgba(255,214,0,.28);--dv-hl-line:#FFD600;
  --mk-ok-bg:#12301f;--mk-ok-fg:#22c55e;--mk-now-bg:#3a2a10;--mk-now-fg:#f5a524;--mk-ng-bg:#3a1616;--mk-ng-fg:#ff6b6b;--mk-wait-bg:#142a44;--mk-wait-fg:#60a5fa;--mk-todo-bg:#1c222d;--mk-todo-fg:#8b93a1;--mk-na-fg:#4b5563;--mk-unk-bg:#2C3148;--mk-unk-fg:#C2CAD8;
  --du-late-bg:#5a1d1d;--du-late-fg:#ffb4b4;--du-today-bg:#4a3410;--du-today-fg:#ffd38a;--du-soon-bg:#24303f;--du-soon-fg:#c3d4ea;
  --v8-ts-on:#14391f;--v8-alt:rgba(255,255,255,.025);--v8-sel:#1b2a44;--v8-line:#2f6fe4;--v8-req-bg:#3a1d1d;--v8-req-fg:#ff9b9b;--v8-req-bd:#6b2a2a;--v8-band:#15212f;--v8-band-bd:#22344a;--v8-link:#7fb0ff;--v8-sub:#8b93a1}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',system-ui,'Segoe UI',sans-serif}
.ln-hdr-right button[title="マスター設定"]{display:none!important}
.dt-main{max-width:1240px;margin:0 auto;padding:20px 24px 48px;display:flex;flex-direction:column;gap:16px}
.dt-card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.dt-main input,.dt-main textarea,.dt-modal input,.dt-modal textarea{background:var(--surface);color:var(--text)}
.dt-search{padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.dt-search label{font-size:13px;color:var(--text2);white-space:nowrap}
.dt-search input{flex:1 1 320px;min-width:0;height:44px;padding:0 14px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit}
.dt-btn{height:44px;padding:0 22px;border:none;border-radius:8px;background:var(--accent-btn);color:var(--dt-on-accent);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.dt-btn:disabled{opacity:.45;cursor:not-allowed}
.dt-btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);font-weight:400;padding:0 18px}
.dt-btn.sm{height:34px;padding:0 14px;font-size:13px}
.dt-note{font-size:12px;color:var(--text3)}
.v34-plus{margin-left:6px;font-size:11px;font-weight:700;color:var(--text2);white-space:nowrap}.v34-auto{font-size:12px;white-space:nowrap}.v34-man{color:var(--text3)}.v34-fix{margin-left:4px;padding:0 6px;height:20px;font-size:10px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text3);cursor:pointer}   /* v0.34 (N58) */
.v33-fac{display:flex;flex-direction:column;gap:6px;margin-top:8px}   /* v0.33 (D1): 工場の候補ボタン */
.v33-fac .dt-btn{height:auto;min-height:30px;padding:5px 10px;white-space:normal;text-align:left;line-height:1.35;font-size:12px;color:var(--text)}
.v30-plan{margin-left:4px;font-size:10px;color:var(--text3);font-weight:400;white-space:nowrap}   /* v0.30 (E3): ETD の下に 選ばなかった方の日付 (参考 · 灰色) */
.dt-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dt-between{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dt-chip{height:34px;padding:0 14px;border-radius:999px;font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.dt-chip.on{border-color:var(--text);background:var(--text);color:var(--surface)}
.dt-seg{display:flex;gap:4px;border:1px solid var(--border);border-radius:10px;padding:3px;background:var(--surface);width:max-content}
.dt-seg button{height:34px;padding:0 14px;border:none;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer;background:transparent;color:var(--text2)}
.dt-seg button.on{background:var(--accent-btn);color:var(--dt-on-accent)}
.dt-pillbtn{height:36px;padding:0 14px;border-radius:999px;font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.dt-pillbtn.on{border-color:var(--accent-btn);background:var(--accent-btn);color:var(--dt-on-accent)}
.dt-check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text2);cursor:pointer;white-space:nowrap}
.dt-check input{width:16px;height:16px;margin:0;accent-color:var(--accent-btn)}
.dt-range{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text2)}
.dt-range input{height:34px;border:1px solid var(--border);border-radius:8px;padding:0 8px;font-family:inherit;font-size:13px;color-scheme:light dark}
.dt-tablewrap{overflow-x:auto}
/* v0.16.1 Invoice 別 (PORTAL と同じ表) — 窓の幅いっぱい · 1 行 · 横スクロールなし · 列名の行は固定 */
.dt-main.pt-full{max-width:none;padding-left:16px;padding-right:16px}
.dt-tablewrap.pt-wide{overflow:visible}
.dt-t.pt-t{font-size:12px}

.pt-t .dt-in{width:auto;height:24px;padding:0 4px;font-size:12px;border-radius:4px}

.pt-t .pt-prop{border:1px dashed var(--border);background:transparent;color:var(--text3);font-family:inherit;font-size:11px;padding:0 4px;margin-left:4px;cursor:pointer;border-radius:4px}
.pt-t .pt-mk{color:var(--st-todo-fg);margin-left:2px;cursor:help}

.pt-wide.f-eta .c-eta,.pt-wide.f-cntr .c-cntr,.pt-wide.f-bkg .c-bkg{display:none}
.dt-t{width:100%;border-collapse:collapse;font-size:14px}
.dt-t thead tr{background:var(--surface2);color:var(--text2);font-size:12px;text-align:left}
.dt-t th{padding:10px 14px;font-weight:500;white-space:nowrap}
.dt-t th.c{padding:10px 8px;text-align:center}
.dt-t td{padding:10px 14px;color:var(--text2);white-space:nowrap}
.dt-t td.c{padding:8px;text-align:center}
.dt-t td.e{font-weight:500;color:var(--text)}
.dt-t tbody tr{border-top:1px solid var(--surface3)}
.dt-t tr.hl{background:var(--dt-hl)}
.dt-t tr.g2{background:var(--surface2)}.dt-t tr.cont td{border-top:0}.dt-t td.n{text-align:right;font-variant-numeric:tabular-nums}
.dt-link{border:none;background:transparent;padding:6px 4px;font-family:inherit;font-size:14px;color:var(--accent);text-decoration:underline;cursor:pointer}
.dt-tag{margin-left:6px;font-size:11px;padding:1px 6px;border-radius:999px;background:var(--st-diff-bg);color:var(--st-diff-fg)}
.st{display:inline-block;min-width:40px;padding:2px 8px;border-radius:999px;font-size:12px;cursor:default;border:1px solid transparent}
button.st{font-family:inherit;cursor:pointer;line-height:inherit}
button.st:hover{border-color:currentColor}
.st-done{background:var(--st-done-bg);color:var(--st-done-fg)}.st-todo{background:var(--st-todo-bg);color:var(--st-todo-fg)}.st-diff{background:var(--st-diff-bg);color:var(--st-diff-fg)}
.st-wait{background:var(--st-wait-bg);color:var(--st-wait-fg);font-weight:700}.st-na{background:transparent;color:var(--st-na-fg)}.st-unk{background:var(--st-unk-bg);color:var(--st-unk-fg);border-color:var(--st-unk-fg)}.st-load{background:transparent;color:var(--st-na-fg)}
.dt-c-diff{color:var(--st-diff-fg)}.dt-c-todo{color:var(--st-todo-fg)}.dt-c-done{color:var(--st-done-fg)}.dt-c-na{color:var(--st-na-fg)}
.dt-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2)}

.dt-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.dt-tabs button{height:44px;padding:0 16px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:14px;margin-bottom:-1px;color:var(--text3);border-bottom:2px solid transparent;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:6px}
.dt-tabs button.on{color:var(--text);font-weight:500;border-bottom:2px solid var(--accent-btn)}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid transparent}
.dot.st-done{background:var(--st-done-fg)}.dot.st-todo{background:var(--st-todo-fg)}.dot.st-diff{background:var(--st-diff-fg)}.dot.st-wait{background:var(--dt-dot-wait)}.dot.st-unk{background:transparent;border-color:var(--dt-dot-unk)}.dot.st-load,.dot.st-na{display:none}
/* v0.17 (F1): 未 = まだ時期でない自分の段階 (灰) · 待ち = 相手の番だけ */
.st-not{background:transparent;color:var(--st-na-fg);border-color:var(--st-na-fg)}.dot.st-not{background:transparent;border-color:var(--st-na-fg)}
/* v0.17 (H2): 保存の印 (欄の横 · 1.5 秒) */
.pt-t .pt-ok{color:var(--st-done-fg);font-size:11px;font-weight:700;margin-left:4px;white-space:nowrap}.pt-t .pt-ng{color:var(--st-diff-fg);font-size:11px;font-weight:700;margin-left:4px;white-space:nowrap}

.dt-panel{padding:24px;display:flex;flex-direction:column;gap:10px}

.v8-t{width:100%;border-collapse:collapse;font-size:13px;min-width:1300px}
.v8-t thead th{position:sticky;top:0;z-index:2;background:var(--surface2,var(--surface));color:var(--text2);font-size:11px;font-weight:500;text-align:left;padding:7px 6px;white-space:nowrap}
.v8-t thead th sup{color:var(--v8-link);font-size:9px;margin-left:2px}
.v8-t td{padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.v8-t tbody tr:nth-child(even){background:var(--v8-alt)}
.v8-t tbody tr.v8-r{cursor:pointer}.v8-t tbody tr.v8-r:hover{background:var(--v8-sel)}
.v8-t td.v8-bd,.v8-t th.v8-bd{width:6px;min-width:6px;padding:0}.v8-bd.b-late{background:var(--bd-late)}.v8-bd.b-today{background:var(--bd-today)}.v8-bd.b-soon{background:var(--bd-soon)}
.v8-t .m{font-family:var(--mono,'IBM Plex Mono',monospace);font-size:12px}.v8-t .m2{color:var(--v8-sub)}
.v8-iv{line-height:1.25}.v8-iv .dt-link{display:block;font-weight:700;padding:0;font-size:13px;color:var(--v8-link);white-space:nowrap;text-align:left}.v8-ct{display:block;color:var(--v8-sub);font-size:11px;white-space:nowrap}
.v8-sub{color:var(--v8-sub);font-size:11px}
.v8-t th.v8-s,.v8-t td.v8-s{text-align:center;padding:4px 3px}.v8-t th.v8-s0,.v8-t td.v8-s0{border-left:1px solid var(--border)}.v8-t th.v8-s6,.v8-t td.v8-s6{border-right:1px solid var(--border)}
.mk{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:6px;font-weight:700;font-size:13px;border:0;padding:0;font-family:inherit;line-height:1;vertical-align:middle}
button.mk{cursor:pointer}button.mk:hover{outline:2px solid var(--v8-line)}
.mk.sm{width:18px;height:18px;font-size:11px;border-radius:4px}
.mk-ok{background:var(--mk-ok-bg);color:var(--mk-ok-fg)}.mk-now{background:var(--mk-now-bg);color:var(--mk-now-fg)}.mk-ng{background:var(--mk-ng-bg);color:var(--mk-ng-fg)}.mk-wait{background:var(--mk-wait-bg);color:var(--mk-wait-fg)}
.mk-todo{background:var(--mk-todo-bg);color:var(--mk-todo-fg)}.mk-na{background:transparent;color:var(--mk-na-fg)}.mk-unk{background:var(--mk-unk-bg);color:var(--mk-unk-fg)}.mk-load{background:transparent;color:var(--text3)}
.v8-s .pt-ts{width:14px;height:14px;margin:0 0 0 3px;vertical-align:middle}.v8-s .pt-c01{font-size:10px;margin-left:2px}.v8-s .dt-in{height:22px;font-size:11px;padding:0 2px;margin-left:3px;width:auto}.v8-s .pt-hint{font-size:10px}
.v8-next{white-space:nowrap}.v8-what{display:inline-block;max-width:230px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.v8-t td[data-c=ship],.v8-t td[data-c=pol]{max-width:170px;overflow:hidden;text-overflow:ellipsis}.v8-t td[data-c=pol]{max-width:100px}
.v8-t .pt-note{width:110px!important}.v8-t input[type=date].dt-in{width:112px!important}.v8-s select.dt-in{width:48px}
.v8-du{display:inline-block;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700;margin-right:6px}
.v8-du.d-late{background:var(--du-late-bg);color:var(--du-late-fg)}.v8-du.d-today{background:var(--du-today-bg);color:var(--du-today-fg)}.v8-du.d-soon,.v8-du.d-later,.v8-du.d-chase{background:var(--du-soon-bg);color:var(--du-soon-fg)}.v8-du.d-none,.v8-du.d-wait,.v8-du.d-pend{color:var(--text3);font-weight:400}
.v8-what{font-weight:500}.v8-wait .v8-what{color:var(--text2);font-weight:400}
.v8-more{font-size:11px;color:var(--text3);margin-left:6px}
.v8-ab{height:22px;padding:0 7px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text2);font:inherit;font-size:11px;cursor:pointer;margin-left:6px;vertical-align:middle}
.v8-t .dt-in{height:24px;padding:0 4px;font-size:12px;border-radius:4px;width:auto}.v8-t .pt-note{width:150px}.v8-t input[type=date].dt-in{width:118px}
.v8-t .pt-prop{font-size:11px}
.v8-empty{padding:18px;color:var(--text3);font-size:13px}
.v8-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text3);padding:2px 2px}
/* 列を隠す (☰ 列 · この PC に記憶) */
.v8-h-cut [data-c=cut],.v8-h-etd [data-c=etd],.v8-h-eta [data-c=eta],.v8-h-pol [data-c=pol],.v8-h-bkg [data-c=bkg],.v8-h-ship [data-c=ship],.v8-h-staff [data-c=staff],.v8-h-pay [data-c=pay],.v8-h-fd [data-c=fd],.v8-h-memo [data-c=memo],
.v8-h-date [data-c=date],.v8-h-country [data-c=country],.v8-h-item [data-c=item],.v8-h-latest [data-c=latest],.v8-h-other [data-c=other]{display:none}
/* U5 右のパネル — 左 = 狭い一覧 · 右 = 詳細 (⤢ = 全体) */
.v8-pane{display:block}
.dt-main.v8-split .v8-pane{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:0}
.dt-main.v8-split.v8-full .v8-pane{grid-template-columns:minmax(0,1fr)}.dt-main.v8-split.v8-full #dtSide{display:none}
.v8-side{border-right:1px solid var(--border);padding:8px 10px 8px 0;max-height:calc(100vh - 110px);overflow:auto;position:sticky;top:0;align-self:start}
.v8-side[hidden]{display:none}
.v8-side-h{font-size:12px;color:var(--text2);margin:0 0 6px}
.v8-sr{display:grid;grid-template-columns:5px 42px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:6px 8px;border-radius:6px;margin-bottom:2px;border:1px solid transparent;background:transparent;color:var(--text);font:inherit;font-size:13px;text-align:left;cursor:pointer}
.v8-sr:hover{background:var(--v8-alt)}.v8-sr.on{background:var(--v8-sel);border-color:var(--v8-line)}
.v8-sr .bd{height:26px;border-radius:3px}.v8-sr .bd.b-late{background:var(--bd-late)}.v8-sr .bd.b-today{background:var(--bd-today)}.v8-sr .bd.b-soon{background:var(--bd-soon)}
.v8-sr .c{font-family:var(--mono,'IBM Plex Mono',monospace);font-size:12px;color:var(--text2)}.v8-sr .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.v8-sr .mks{display:flex;gap:3px}
.dt-main.v8-split #dtIv,.dt-main.v8-split #dtCt{padding:8px 0 0 14px;gap:8px;min-width:0}
.v8-ph{display:none}
.dt-main.v8-split .v8-ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px;border:1px solid var(--border);background:var(--surface2,var(--surface));border-radius:8px}
.v8-ph b{font-size:15px}.v8-ph .v8-sub{font-size:13px}
.dt-main.v8-split .v8-back{display:none}
.dt-main.v8-split .dt-sum{padding:8px 12px;font-size:12px;gap:6px 12px}
.dt-main.v8-split .dt-tabs button{height:36px;font-size:13px;padding:0 12px}
.dt-tabs .mk{margin-right:2px}.dt-main:not(.v8-old) .dt-tabs .dot{display:none}
@media (max-width:900px){.dt-main.v8-split .v8-pane{grid-template-columns:minmax(0,1fr)}.dt-main.v8-split #dtSide{display:none}.v8-q{width:100%}}
/* 形さん追加 (11/26): 今日の日付 — 黄色 (--v8-today-bg) · 黒の太字 · 小さい丸い角 (ダーク · ライト 同じ = どちらでも読める 15:1) */
.v8-today{background:var(--v8-today-bg)!important;color:var(--v8-today-fg)!important;border-radius:4px;padding:1px 5px;font-weight:700}
input.dt-in.v8-today{padding:0 4px;color-scheme:light}
.v8-tbadge{background:var(--v8-today-bg);color:var(--v8-today-fg);border-radius:6px;padding:2px 10px;font-weight:700;font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<div id="app" style="display:none">
<main class="dt-main" id="dtMain" style="display:none">

  <div id="dtInbox"></div>
  <div id="dtDrop" class="sv-drop" hidden><div class="sv-drop-in">ここに置くと保存の入口へ</div></div>

  <!-- v0.28 (U1 ~ U9): 一覧 = 表 1 つ (今日やること + Invoice 別) · 操作の行 = B-06 と同じ形 -->
  <section id="dtList" class="v8-list" style="display:flex;flex-direction:column;gap:6px">
    <div class="v8-bar" id="dtBar">
      <div class="dt-seg v8-seg"><button id="dtBIv" class="on">Invoice</button><button id="dtBCt">契約</button><button id="dtBTodo" hidden>今日やること</button></div>
      <span class="v8-lbl">担当</span><span id="dtWho" class="v8-who"></span>
      <span id="dtCtCtl" class="v8-range" style="display:none"><span>契約日</span><span id="dtCtPeriod" class="v8-who"></span></span>
      <button id="dtTodo" class="v8-req">要対応のみ</button><button id="dtAll" class="v8-all on">すべて</button>
      <label class="v8-lbl" for="dtSort">並び</label><select id="dtSort" class="v8-sel"></select>
      <span class="v8-sp"></span>
      <input id="dtQ" class="v8-q" placeholder="Invoice · 契約 · BKG · L/C · 本船" autocomplete="off" aria-label="検索 (Enter で開く)">
      <button id="dtGo" class="v8-btn v8-go" title="開く（Invoice · 契約番号 · L/C 番号）">開く</button>
      <button id="dtColsBtn" class="v8-btn" aria-haspopup="true" aria-expanded="false">☰ 列</button>
      <button id="dtHelp" class="v8-btn" title="説明 · 読み込みの詳しい内容" aria-label="説明">？</button>
      <span id="dtQSt" class="dt-note"></span>
    </div>
    <div id="dtColsMenu" class="v8-menu" hidden></div>
    <div id="dtMeNote" class="v8-warn" hidden></div>
    <div id="dtProg" class="dt-prog"></div>
    <div id="dtLegacy" class="v8-legacy">
      <div class="dt-between">
        <div id="dtBoardNote" class="dt-note" style="font-size:13px"></div>
        <div class="dt-row">
          <span id="dtIvCtl" class="dt-row"><span class="dt-row" style="gap:4px"><button id="dtIvPortal" class="dt-chip on" title="PORTAL 「船積書類」 と同じ行 (FD送付日 が空の船積)">PORTAL と同じ</button><button id="dtIvEtd" class="dt-chip" title="v0.15 の表 (ETD の範囲 · FD済みは表示しない)">ETD 範囲で見る</button></span><span class="dt-range" id="dtEtdBox">ETD <input type="date" id="dtFrom"> 〜 <input type="date" id="dtTo"> <button id="dtReload" class="dt-btn ghost sm">読み込む</button></span>
          <label class="dt-check" id="dtHideFdBox" title="FD（FINAL DOCUMENT）は最後に保存するので、FD がある船積は終わったものとして隠します。外すと全部見えます。"><input type="checkbox" id="dtHideFd" checked> FD済みは表示しない</label></span>
          <span id="dtTodoAll" class="dt-note" style="display:none"></span>
        </div>
      </div>
    </div>
    <div id="dtTodoBox" style="display:none;flex-direction:column;gap:16px"></div>
    <div id="dtTop"></div>
    <div class="dt-card dt-tablewrap" id="dtTable"></div>
    <div id="dtAfter"></div>
    <div class="dt-legend" id="dtLegend">
      <span><span class="st st-done">済</span> 終わった</span>
      <span><span class="st st-todo">確認</span> 今やること</span>
      <span><span class="st st-diff">相違</span> 直してもらう</span>
      <span><span class="st st-wait">待ち</span> 相手の返事待ち</span>
      <span><span class="st st-not">未</span> まだ</span>
      <span><span class="st st-unk">?</span> 判断の根拠が見つからない（マウスを乗せると理由）</span>
      <span style="color:var(--text3)">— 対象外（DEPO はベトナム向けのみ · RR は韓国向けのみ · 保険は CIF のみ · L/C は L/C 取引のみ）</span>
    </div>
  </section>

  <div id="dtPane" class="v8-pane">
  <aside id="dtSide" class="v8-side" hidden></aside>
  <section id="dtIv" style="display:none;flex-direction:column;gap:16px">
    <div class="v8-back"><button class="dt-back" data-back="iv">← 一覧へ</button></div><div id="dtIvHead" class="v8-ph"></div>
    <section class="dt-card dt-sum" id="dtIvSum"></section>
    <nav class="dt-tabs" id="dtIvTabs" aria-label="船積の流れ"></nav>
    <div id="dtIvBody"></div>
  </section>

  <section id="dtCt" style="display:none;flex-direction:column;gap:16px">
    <div class="v8-back"><button class="dt-back" data-back="ct">← 一覧へ</button></div><div id="dtCtHead" class="v8-ph"></div>
    <section class="dt-card dt-sum" id="dtCtSum"></section>
    <nav class="dt-tabs" id="dtCtTabs" aria-label="契約の流れ"></nav>
    <div id="dtCtBody"></div>
    <div class="dt-card" style="padding:14px 18px;display:flex;flex-direction:column;gap:6px"><div style="font-size:13px;font-weight:500;color:var(--text2)">この契約の船積</div><div id="dtCtShips"></div></div>
  </section>
  </div>

</main>
<div class="ln-footer">✦ Powered by LEENAI Automation System</div>
</div>
<div id="dtModal" class="dt-modal" hidden><div class="box" id="dtModalBox"></div></div>

<script id="doc-core">
/* ============================================================
   書類ツール — 純粋ロジック (DOM · 通信なし · node 試験対象)
   指示書: (2026-11-20)THOR_指示書_D00_書類ツール_v0.1_시험판_v1_1 (P1 · P2 · P3)
   状態 = 済 · 確認 · 相違 · 待ち · —(対象外) · ?(根拠なし)。推測で 済 を作らない。
   規則は下の表 (NAME · NA · REQ_SI · FD_TENT · CT_REAL · CT_PERIODS) にまとめる — 直すときは表だけ。
   v0.3: ACL の名前の規則は acl_bench エンジン (v0.5) の aclScan / aclPick を使う (この TOOL には持たない — useAclEngine で受け取る)
   v0.4 (2026-11-21 指示書 ACL 最終分析): エンジン v0.6 (最終確認 = S/I の内容が ACL のどこかに全部あるか + コンテナのセット) · ACL 欄の状態に 最終確認 を入れる (表 ACL_RULE · aclJudge)
   v0.27 (2026-11-26 指示書 THOR_25 · 修正まとめ v0.17): N30 下書き = C-01 と同じ形 (本文 HTML · 改行 · 署名 · 末尾 · あいさつ 「{相手の会社名}／{担当者} 様」 · 返信は元のメールの引用のまま · 実際の To / CC · 作ったら読み直して確かめる) · N31 同じ仕事に ボタン 1 つ (ACL の古いコピーの窓を やめる · 参考の ACL は 訂正依頼のボタンなし) · N28 · N29 エンジン acl v0.22 (S/I 「**」 の続き = その欄の中 · 主要な欄を比べられない = 読取確認 · D-03 の既定値 = 一致) · N27 S/I 確認 = 契約 1 行 (契約番号 · Invoice は小さく · 期限 = まだ出ていない船積の一番早い CY_CUT · 無ければ 灰色の —)
   v0.29 (2026-11-26 指示書 THOR_27 · 修正まとめ v0.24 + 追加 2 つ): U10 ETD を一番左 · ETD の近い順 (契約の表 · 右のパネルの一覧も) · U11 要対応 = やること + 催促 · U12 国内転売を表から外す (規則 1 か所) · U13 通関 = チェック 1 つ · U14 見える範囲 (過ぎた ETD = FD送付日 があれば終わり · これから = +14 日 · その先は畳む · FD 済 · 畳んだ行は フォルダを読まない) · CY CUT の範囲の欄をやめる · N35 OBL → 入金 → SWB (doc_staff obl_then_swb · 着金日 = COMPASS crcf9_payment_date · BL TYPE 変更依頼の下書き) · 送金 ③ 振込 確認済 (手入力) · 判定のほかは v0.28 と同じ
   v0.28 (2026-11-26 指示書 THOR_26 · 修正まとめ v0.21): 画面を大きく変える (B-06 の形 · 目録どおり · 判定は変えない) — U1 窓の幅いっぱい · U2 一覧 = 表 1 つ (今日やること + Invoice 別 · 1 行 = 1 Invoice · Invoice / 契約 = 2 行) · U3 段階 = 色の印 (✓ ● ◆ ◐ ○ ―) · U4 要対応のみ = 今日やること の やること の行 (期限順 · 左の色の帯) · U5 行を押すと右のパネル (← → ⤢ ✕ · #iv=…&tab=…) · U6 操作の行 (担当の色の点 · CY CUT · 検索 1 つ · ☰ 列 · 同期の一行) · U7 列の出所 C P M A · U8 契約の表 · U9 保存の入口 = 畳む帯 · 今日の日付 = 黄色 (形さん追加) · N33 依頼者名 = name_en_full · N34 LG 件名 = すべての船社で同じ形
   v0.26 (2026-11-26 指示書 THOR_24 · 修正まとめ v0.12): N17 Invoice 別 に 「通関依頼済」 の補助のチェック (C-01 を通らない例外 · PORTAL v4.11 と同じ欄 tsukan_irai · tsukan_irai_at · tsukan_irai_off_at · 欄単位 · eTag · C-01 が書いた行は 「C-01」) · N18 後の段階で直った ACL 相違 = 「参考（B/L で訂正済み）」 (B/L Draft の最新の版で S/I と同じ) · B/L 発行 · FD 済 = 参考 · 本登録 「—（後の段階で確認済み）」 · N19 ACL · B/L Draft の違い = 語の単位 (# · 改行 · 空白を無視 · 抜けた · 違う語だけ赤) · N21 LG の署名 = ログインした人の署名の画像 (master_staff sign_img · 管理者が確認した人だけ · 様式の画像を入れ替え · 大きさ · 位置そのまま) · 管理者の 「署名の画像の確認」 · N23 ONE 依頼者名 = name_en · N24 CNC 様式の宛名 (SharePoint の様式) · N26 LG 下書きの件名 = 船社の形 + B/L 番号 + 本船 · 航海 + Invoice · 本文 = 訂正の一覧なし

  function sortCt34(rows, by){ const L=(rows||[]).slice(), k=by||'date', ct=(a,b)=>String(b.ct||'').localeCompare(String(a.ct||''));
    if(k==='latest') return L.sort((a,b)=>((a.latest?0:1)-(b.latest?0:1))||String(a.latest||'').localeCompare(String(b.latest||''))||ct(a,b));
    if(k==='buyer') return L.sort((a,b)=>String(a.buyer||a.buyerName||'').localeCompare(String(b.buyer||b.buyerName||''))||String(b.date||'').localeCompare(String(a.date||''))||ct(a,b));

  function licFactories(prev, sn){ const F=[];
    (prev||[]).forEach(p=>{ const h=head1(p,sn); if(!h) return; let tax=''; const nums=[];
      SI_HEAD_COLS.filter(c=>V32.KEEP_COLS.indexOf(c)<0).forEach(c=>{ const L=licLines(h[c]); if(!L.length) return; L.forEach(l=>{ const m=l.match(/(\d+)\s*\/\s*GP/i); if(m) nums.push(m[1]); }); if(!tax){ const t=sv(h[c]).match(V33.TAX_RE); if(t) tax=t[1]; } });

  function licFacName(h){ for(const c of ['crcf9_consignee','crcf9_notify_party']){ const seg=sv(h&&h[c]).split(/#|\n/).map(q=>q.replace(/\*+/g,'').replace(/\s+/g,' ').trim()).find(q=>/[A-Z]{3,}.*[A-Z]{2,}/i.test(q)&&!/DEPOSIT|TO ORDER|GPMT|\d{5,}/i.test(q)); if(seg) return seg.slice(0,40).trim(); } return ''; }

  function licPick(F, pods){ const P=(pods||[]).map(v=>up(v).replace(/[^A-Z]/g,'')).filter(v=>v.length>=4); if((F||[]).length<2||!P.length) return null;

  /* PDF の文字の鍵 (改行 · 空白 · 大小を見ない) — 「同じ内容」 */
  function textKeyOf(pages){ return (pages||[]).map(p=>(p.items||[]).map(i=>i.s).join(' ')).join('\n').normalize('NFKC').toUpperCase().replace(/\s+/g,''); }
  /* どの Invoice — ships = [{iv, bkg, bl, cntrs:[…]}] · pdf = {booking, cntrs:[…], text} · hint = {name, subject, prefer}

  function saveCands(ships, pdf, hint){
    const A=s=>alnum(s), out=[], why=[], push=(iv,w)=>{ iv=up(iv); if(iv&&out.indexOf(iv)<0){ out.push(iv); why.push(w); } };
    /* v0.17 (B9): 書類 (FD · TO BANK · IV · PL) — Invoice 番号は 名前 · 件名 → PDF の文字 の順 (人が番号を打たない) */
    if(hint&&hint.doc){ const ivsOf=t=>(up(t).match(/[A-Z]{2,4}\d{4}-\d{2}/g)||[]).filter(iv=>ships.some(s=>up(s.iv)===iv));

      if(!out.length){ const k=A(t); ships.filter(s=>[s.bkg,s.bl].map(A).some(x=>x.length>=6&&k.indexOf(x)>=0)).forEach(s=>push(s.iv,'名前 · 件名のブッキング / B/L 番号')); } }

  /* 重複 · 版 — existing = その Invoice フォルダの ACL 家族 [{name, hash, tkey}] · names = フォルダの全ファイル名 */

  /* ══════════ v0.11 チェックポイント (master_checkpoint) · 見落とし報告 — 指示書 (2026-11-23) D00 체크포인트 마스터 v1 Step 3 ══════════

  /* 新しいチェックの帯 — 追加 · 有効 · 承認日から 7 日以内 · その範囲の担当 (doc_staff: IV コード → 担当) に自分がいる · dismissed = 「確認した」 の ID */

  /* ══════════ v0.15 (指示書 MAC-THOR_5 D00 書類ツール v0.15 · 修正まとめ v0.2) — 規則 · 表 · 語はこの 1 か所 ══════════

/* v0.14 (Step 4-2): Graph $batch — 中は GET だけ (読むだけ · 20 件ずつ) · 429 / 5xx はその分だけ待ってもう一度 · 失敗は呼んだ側が 1 件ずつに戻す */
async function graphBatch(reqs){
  const out={};
  for(let i=0;i<reqs.length;i+=20){ let todo=reqs.slice(i,i+20), tries=0;
    while(todo.length){
      const body=JSON.stringify({requests:todo.map(x=>({id:x.id, method:'GET', url:x.url}))});
      const r=await graphFetch(GRAPH+'$batch',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body});
      if(!r.ok) throw new Error('Graph batch '+r.status);
      const j=await r.json(), again=[]; let wait=1;
      (j.responses||[]).forEach(x=>{ const q=todo.find(t=>t.id===String(x.id)); if(!q) return; if((x.status===429||x.status>=500)&&tries<3){ again.push(q); wait=Math.max(wait,+((x.headers||{})['Retry-After']||1)||1); } else out[q.id]=x; });
      todo=again; if(todo.length){ tries++; await sleep(Math.min(wait*1000,10000)); } } }
  return out;
}
async function loadFoldersBatch(list, seq, onProg){

  const go=[]; list.forEach(iv=>{ const loc=S.wip[iv]||S.old[iv]; if(!loc) S.folders[iv]='missing'; else go.push({iv, loc}); });
  let k=0; const parts=[]; for(let i=0;i<go.length;i+=20) parts.push(go.slice(i,i+20));
  /* 20 件の束を 4 つずつ並べて (1 件ずつ 4 本 と同じ同時数) */
  await mapLimit(parts,4,async part=>{ if(seq!==S.loadSeq) return; const one=[], pend={}, subs=[];
    let res=null; try{ res=await graphBatch(part.map((x,j)=>({id:'f'+j, url:url(x.loc.path)}))); }catch(e){ res=null; }
    part.forEach((x,j)=>{ const r=res&&res['f'+j];
      if(r&&r.status===404){ S.folders[x.iv]='missing'; return; }
      if(!r||r.status!==200||!r.body||r.body['@odata.nextLink']){ one.push(x); return; }   // 今までどおり 1 件ずつ
      const F=folderFromChildren(x.iv, x.loc, r.body.value||[]); pend[x.iv]=F.st; F.want.forEach(sn=>subs.push({x, sn})); });
    if(subs.length){ let r2=null; try{ r2=await graphBatch(subs.map((q,j)=>({id:'s'+j, url:url(q.x.loc.path+'/'+q.sn)}))); }catch(e){ r2=null; }
      subs.forEach((q,j)=>{ const r=r2&&r2['s'+j]; if(!pend[q.x.iv]) return;
        if(r&&r.status===200&&r.body&&!r.body['@odata.nextLink']) (r.body.value||[]).filter(y=>y.file).forEach(y=>pend[q.x.iv].files.push({name:y.name, sub:q.sn, lastModified:y.lastModifiedDateTime, webUrl:y.webUrl, id:y.id}));
        else if(!(r&&r.status===404)){ delete pend[q.x.iv]; if(one.indexOf(q.x)<0) one.push(q.x); } }); }
    Object.keys(pend).forEach(iv=>{ S.folders[iv]=pend[iv]; });

  return hit;

function folderCacheSave(list){

}

/* 保存 — 直前に読み直し → その Invoice のその欄だけ → eTag 条件 PUT (412 → 読み直して 1 回だけやり直し · それでも → 「他の人が更新しました」) */
const PTSAVE = {busy:{}, n:0, keep:{}};
async function ptSave(ivRaw, field, value){
  const P=DOC.PT, test=saveTest(), path=test?P.TEST_PATH:P.PATH, key=ivRaw+'|'+field;
  if(PTSAVE.busy[key]) return {ok:false, msg:'保存中です'}; PTSAVE.busy[key]=1;
  try{
    for(let n=0;n<2;n++){
      const meta=await graphJson(drv()+'/root:/'+spEnc(path)+'?$select=id,eTag');
      if(!meta||!meta.eTag) return {ok:false, msg:(test?'試験用の写し':'PORTAL のファイル')+' がありません: '+path};
      const t=await spText(path); if(t==null) return {ok:false, msg:'ファイルを読めません: '+path};
      const M=DOC.ptMerge(t, ivRaw, field, value, (LEENAI.user&&(LEENAI.user.name||LEENAI.user.email))||'', new Date().toISOString());
      if(!M.changed){ ptApply(M, ivRaw, test); return {ok:true, same:true}; }
      try{ await spPut(path, M.text, 'application/json', {portal:true, ifMatch:meta.eTag}); PTSAVE.n++; ptApply(M, ivRaw, test); return {ok:true, retry:n}; }
      catch(e){ if(!/SP PUT 412/.test(e.message)) throw e; if(n===1) return {ok:false, conflict:true, msg:P.CONFLICT}; }
    }
    return {ok:false, conflict:true, msg:P.CONFLICT};
  }finally{ delete PTSAVE.busy[key]; }
}

/* v0.5 (指示書 Step A): 詳細は 先に 「読み込み中…」 を出し、画面に 1 回ゆずってから 読み込み · 描画 (重い処理があっても押した直後に画面が変わる) ·

const LOADING_HTML = '<section class="dt-card dt-panel"><div class="dt-note" style="font-size:14px">読み込み中…</div></section>';
const nextFrame = () => new Promise(res=>{ let d=false; const go=()=>{ if(!d){ d=true; setTimeout(res,0); } }; try{ requestAnimationFrame(go); }catch(e){} setTimeout(go,50); });   // 裏のタブ (requestAnimationFrame が止まる) でも 50ms で進む
const perfNow = () => (typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
/* v0.14 (Step 4): 読み込みの時間 · 画面が止まった時間 (longtask) — 完了の一行に出す (実際の PC で確かめる) */
const PERF = {t0:null, marks:{}, lt:[], renderMax:0,
  start(){ this.t0=perfNow(); this.marks={}; this.lt=[]; this.renderMax=0; },
  mark(k){ if(this.t0!=null&&this.marks[k]==null) this.marks[k]=Math.round(perfNow()-this.t0); },
  render(ms){ if(ms>this.renderMax) this.renderMax=Math.round(ms); },
  stall(){ return this.lt.filter(x=>this.t0==null||x[0]>=this.t0).reduce((a,x)=>Math.max(a,x[1]),0); },
  note(){ const m=this.marks, s=v=>v==null?'—':(v/1000).toFixed(1)+' 秒'; return '初回表示 '+s(m.first)+' · フォルダ '+s(m.folders)+' · メール '+s(m.mail)+' · 保存の入口 '+s(m.save)+(m.fdsearch!=null?' · FD 検索 '+s(m.fdsearch):'')+(m.hon!=null?' · 本登録メール '+s(m.hon):'')+' · 画面が止まった最長 '+s(this.stall()); }};

async function runSearch(){
  const q=DOC.queryKind($('dtQ').value), st=$('dtQSt'); st.textContent='';
  if(!q.type){ st.textContent='契約番号 · Invoice · LC 番号を入れてください'; return; }
  try{
    if(q.type==='iv') return await openIv(q.q);
    if(q.type==='ct'){ let id=Object.keys(S.ct).find(k=>DOC.up(S.ct[k].cr49f_sale_contract_no)===q.q);
      if(!id){ const r=await dvAll(`cr49f_sale_contracts?$filter=cr49f_sale_contract_no eq '${q.q.replace(/'/g,"''")}'&$select=${CT_SEL}`); if(!r.length){ st.textContent='COMPASS に契約 '+q.q+' がありません'; return; } id=r[0].cr49f_sale_contractid; }
      return await openCt(id); }
    /* LC 番号 — S/I の LC 番号 → 契約 (v0.5: S/I の欄を丸ごと貼った 「… DATED ON …」 は DATED から後ろを見ない) */
    const qq=q.q.replace(/DATED.*$/,'').replace(/'/g,"''"); const r=await dvAll(`cr49f_s_is?$filter=contains(cr49f_lc_no,'${qq}')&$select=cr49f_s_iid,_cr49f_sale_contract_id_value,cr49f_lc_no&$top=20`);
    const ids=[...new Set(r.map(x=>x._cr49f_sale_contract_id_value).filter(Boolean))];
    if(!ids.length){ st.textContent='見つかりません: '+q.q; return; }
    if(ids.length>1) st.textContent='LC 番号が '+ids.length+' 件の契約に一致 — 最初の 1 件を開きました';
    return await openCt(ids[0]);
  }catch(e){ st.textContent='検索できません: '+e.message; }
}

async function loadAclEngine0(){
  const r=await fetch(ACL_ENGINE.url); if(!r.ok) throw engineErr('エンジンを読めません ('+r.status+')');
  const buf=await r.arrayBuffer(), h=await sha256hex(buf);

}

async function readPdf(file){

/* v0.17 (G10): スキャン ACL の AI 判読 (acl_bench v0.14 が保存 · 読むだけ) → {m (readNaccs と同じ形 + ai)} | {why, ai} */
const SCAN_AI_DIR = DOC.SRC.acl+'/_scan_ai';
async function scanAiFor(E, raw, fmt){
  /* v0.18 (T-1): スキャン = {sha256}.json (NACCS) → NACCS でなければ {sha256}.other.json (乙仲様式) · 文字のある 乙仲様式 (OTHER) = {sha256}.other.json だけ — どれも acl_bench が保存 · この TOOL は AI を呼ばない */
  if(!raw) return {why:'AI 判読なし'};
  const sha=await sha256hex(raw), rd=async ext=>{ const t=await spText(SCAN_AI_DIR+'/'+sha+ext); const j=t?JSON.parse(t):null; return j&&j.schema==='acl_scan_ai/1'&&(j.reads||[]).length===2?j:null; };
  /* v0.22 (V3): 「読めず」 欄の 3 回目 (acl_bench v0.19 が保存 · 読むだけ) — あれば scanMerge に渡す · 3 回目の枠を その欄に (書類の表示で 枠) */
  const rd3=async ext=>{ try{ const t=await spText(SCAN_AI_DIR+'/'+sha+ext); const j=t?JSON.parse(t):null; return j&&j.schema==='acl_scan_r3/1'?j:null; }catch(e){ return null; } };
  const mg=async(j,o)=>{ const r3=E.scanApplyR3?await rd3(o?'.other.r3.json':'.r3.json'):null, m=E.scanMerge(j.reads[0], j.reads[1], Object.assign({model:j.model, sha256:sha, cost_usd:j.cost_usd, at:j.at}, o?{other:true}:{}, r3?{r3}:{}));
    if(r3) Object.keys(r3.fields||{}).forEach(k=>{ if(m.fields[k]&&r3.fields[k]&&r3.fields[k].box) m.fields[k].box=r3.fields[k].box; }); return m; };
  let ai=null;
  try{ if(fmt!=='OTHER'){ const j=await rd('.json'); if(j){ const m0=E.scanMerge(j.reads[0], j.reads[1], {model:j.model, sha256:sha}); if(E.scanLayoutOk(m0)) return {m:await mg(j,false)}; ai=m0.ai; } }
    const o=await rd('.other.json'); if(o) return {m:await mg(o,true)}; }catch(e){ return {why:'AI 判読を読めない'}; }
  return ai?{why:E.SCAN_NOT_NACCS, ai}:{why:'AI 判読なし（acl_bench で読むと照合できます）'};
}

async function cpVersions(name){   // → [{by, items}] 新しい順 — 読めなければ null
  try{ const p=LEENAI_MASTER_DIR+'/master_'+name+'.json', meta=await graphJson(drv()+'/root:/'+spEnc(p)+'?$select=id');
    const vs=((await graphJson(drv()+'/items/'+meta.id+'/versions?$select=id,lastModifiedBy,lastModifiedDateTime&$top='+CP_VER_MAX))||{}).value||[];
    /* 一番新しい版 (= 今のファイル) は versions/{id}/content で読めない (SharePoint は 400) → 今のファイルの中身 */
    const out=[]; await mapLimit(vs.slice(0,CP_VER_MAX),4,async(v,i)=>{ const r=await graphFetch(i===0?drv()+'/items/'+meta.id+'/content':drv()+'/items/'+meta.id+'/versions/'+encodeURIComponent(v.id)+'/content'); if(!r.ok) throw new Error('版 '+r.status);
      const j=await r.json(); const u=(v.lastModifiedBy&&v.lastModifiedBy.user)||{}; out[i]={id:v.id, by:String(u.email||u.displayName||'').toLowerCase(), items:Array.isArray(j.items)?j.items:[]}; });
    return out.filter(Boolean); }catch(e){ return null; } }

async function cpLoad(force){
  if(CPS.state==='ok'&&!force&&Date.now()-CPS.at<10*60e3) return CPS.prep;
  if(CPS.p&&!force) return CPS.p;
  CPS.p=(async()=>{ try{ const E=await loadAclEngine(); let items=null;
      try{ items=await LEENAI.master.get('checkpoint',force?{fresh:true}:undefined); if(!Array.isArray(items)) throw new Error('items が配列でない'); }catch(e){ throw new Error('チェックポイントマスターを読めない ('+(e.message||e)+')'); }
      let alias=[]; try{ alias=await LEENAI.master.get('port_alias',force?{fresh:true}:undefined)||[]; }catch(e){ alias=[]; }
      const [v1,v2]=await Promise.all([cpVersions('checkpoint'),cpVersions('port_alias')]);
      const lastBy=Object.assign({}, v1?E.cpLastChangers(v1):{}, v2?E.cpLastChangers(v2):{});   // 読めない → その行は 承認待ち (安全側)
      CPS.prep=E.cpPrepare(items, alias, {admins:E.cpAdmins(S.staff), lastBy}); CPS.verOk=!!(v1&&v2); CPS.verIds={checkpoint:v1&&v1[0]?v1[0].id:'', port_alias:v2&&v2[0]?v2[0].id:''}; CPS.state=S.staff.length?'ok':''; CPS.err=''; CPS.at=Date.now(); }   // 職員マスターの前に読んだら 次にもう一度
    catch(e){ CPS.prep=null; CPS.state='error'; CPS.err=e.message||String(e); }
    finally{ CPS.p=null; } return CPS.prep; })();
  return CPS.p;
}

  const kv=(k,v)=>v?'<tr><th>'+esc(k)+'</th><td>'+v+'</td></tr>':'';
  modal('<div class="dt-h"><span class="cp-id">'+esc(r.id)+'</span> '+esc(r.title)+'</div>'+
    '<table class="cp-kv">'+kv('なぜ必要か',esc(row.why_ja||''))+kv('実例',(()=>{ const x=DOC.cpExample(row.example); return x.text||x.ivs.length?(x.ivs.length?'<b>根拠 Invoice</b> '+esc(x.ivs.join(' · '))+'<br>':'')+esc(x.text):'<span class="dt-note">—（まだありません）</span>'; })())+kv('比べ方',esc(how))+kv('結果',esc(r.result+(r.kind==='追加'?' (違ったとき)':'')))+
      kv('段階',esc((r.stages||[]).map(s=>DOC.CP_STAGE_JA[s]||s).join(' · ')))+kv('範囲',esc((r.pay==='ALL'?'全取引':r.pay==='LC'?'L/C 取引':r.pay)+(r.scope_type!=='all'?' · '+(DOC.CP_SCOPE_JA[r.scope_type]||r.scope_type)+' '+r.scope:'')))+
      kv('状態',esc(r.state+(r.why&&S.me.admin?' — '+r.why:'')))+kv('承認',esc([row.approved_by?staffName(row.approved_by):'',row.approved_at||''].filter(Boolean).join(' · ')))+
      (S.me.admin?kv('試験結果',esc(row.trial||''))+kv('報告者',esc(row.reported_by||''))+kv('エンジン項目',esc(r.engine_key||''))+kv('メモ',esc(row.note||'')):'')+'</table>'+
    '<div class="dt-actions">'+(fromList?'<button class="dt-btn ghost" id="dtCpBack">一覧へ</button>':'<button class="dt-btn ghost" id="dtCpAll">チェックポイント一覧</button>')+'<button class="dt-btn ghost" data-close>閉じる</button></div>');
  bindClose(); const b=$('dtCpBack')||$('dtCpAll'); if(b) b.onclick=()=>cpListModal();
}
function bindClose(){ $('dtModalBox').querySelectorAll('[data-close]').forEach(b=>{ b.onclick=closeModal; }); }
/* ── 見落とし報告 (入力 → SharePoint D-00/checkpoint_reports/ に新規 1 つ) ── */
function cpReportModal(iv){
  const cur=iv||(S.cur&&S.cur.iv)||'';
  modal('<div class="dt-h">見落とし報告</div><div class="dt-note">チェックで見つけられなかった違いを教えてください。管理者がチェックポイント（確認項目）を 1 行足すかを決めます。</div>'+
    '<label class="dt-note">Invoice</label><input class="dt-in" id="cpRIv" style="height:36px" value="'+esc(cur)+'" placeholder="例 NXX2611-01">'+
    '<label class="dt-note">段階</label><select class="dt-in" id="cpRStage" style="height:36px"><option value="">（選ぶ）</option>'+DOC.CP_REPORT_STAGES.map(s=>'<option>'+esc(s)+'</option>').join('')+'</select>'+
    '<label class="dt-note">何が違っていたか（必須）</label><textarea class="dt-in" id="cpRWhat" rows="4" style="padding:8px 10px" placeholder="例 ACL の Consignee の銀行名が L/C と違っていた (CO., LTD. → COMPANY LIMITED)"></textarea>'+
    '<label class="dt-note">どこで気づいたか</label><input class="dt-in" id="cpRWhere" style="height:36px" placeholder="例：銀行からの Discrepancy 通知 · B/L Draft を見て">'+
    '<div id="cpRSt" class="dt-note"></div><div class="dt-actions"><button class="dt-btn" id="cpRSend">送る（保存）</button><button class="dt-btn ghost" data-close>やめる</button></div>');
  bindClose();
  $('cpRSend').onclick=async()=>{ const st=$('cpRSt'), btn=$('cpRSend'); let body;
    try{ const d=new Date(); body=DOC.cpReportBody({invoice:$('cpRIv').value, stage:$('cpRStage').value, what:$('cpRWhat').value, where:$('cpRWhere').value},
      {code:S.me.code, name:S.me.name, email:(LEENAI.user&&LEENAI.user.email)||'', at:d.toISOString(), tool:'書類ツール v'+CFG.version});
      btn.disabled=true; st.textContent='保存中…'; await spPut(DOC.cpReportPath(d, S.me.code||'UNKNOWN'), JSON.stringify(body,null,1));
      closeModal(); toast('見落とし報告を保存しました — ありがとうございます','ok'); CPS.reports=null; cpReportsLoad(); }
    catch(e){ btn.disabled=false; st.innerHTML='<span class="dt-c-diff">'+esc(e.message||e)+'</span>'; } };
}
/* ── 管理者: 見落とし報告 n 件 (未確認) ── */
async function cpReportsLoad(){
  if(!S.me.admin) return;
  try{ const k=await spChildren(DOC.CP_REPORT_DIR.replace(/\/$/,'')); CPS.names=(k||[]).filter(x=>x.file).map(x=>x.name); CPS.reports=DOC.cpReportsState(CPS.names); CPS.repErr=''; }
  catch(e){ CPS.reports=DOC.cpReportsState([]); CPS.repErr=e.message; }
  renderCpBadge();
}
function renderCpBadge(){
  const r=document.getElementById('ln-hdr-right'); if(!r) return; let b=$('dtCpRep');
  if(!b){ b=document.createElement('button'); b.id='dtCpRep'; b.className='dt-badge cp-rep'; b.onclick=()=>cpReportsModal(); const t=$('dtTrial'); if(t) t.appendChild(b); else r.insertBefore(b, r.firstChild); }
  const n=S.me.admin&&CPS.reports?CPS.reports.unread:0; b.hidden=!n; b.textContent='見落とし報告 '+n+' 件 (未確認)';
}
async function cpReportsModal(){
  modal('<div class="dt-h">見落とし報告</div><div class="dt-note">読み込み中…</div>');
  await cpReportsLoad(); const R=CPS.reports||{reports:[]};
  const list=await Promise.all(R.reports.slice(0,60).map(async x=>{ let j=null; try{ const t=await spText(DOC.CP_REPORT_DIR+x.name); j=t?JSON.parse(t):null; }catch(e){} return Object.assign({},x,{j}); }));
  modal('<div class="dt-h">見落とし報告 <span class="dt-note">'+R.reports.length+' 件 · 未確認 '+R.unread+'</span></div>'+(CPS.repErr?'<div class="dt-c-diff">'+esc(CPS.repErr)+'</div>':'')+
    '<div class="cp-list">'+(list.map(x=>{ const j=x.j||{}; return '<div class="cp-rep-row"><div><b>'+esc(j.invoice||'—')+'</b> <span class="dt-note">'+esc([j.stage,staffName(j.by||x.code),jstHM(j.at)].filter(Boolean).join(' · '))+'</span></div>'+
      '<div>'+esc(j.what||'(読めない)')+'</div>'+(j.where?'<div class="dt-note">気づいた所: '+esc(j.where)+'</div>':'')+
      '<div>'+(x.acked?'<span class="cp-st cp-st-on">確認済み</span>':'<button class="dt-btn ghost sm" data-ack="'+esc(x.name)+'">確認済みにする</button>')+'</div></div>'; }).join('')||'<div class="dt-note">報告はありません</div>')+'</div>'+
    '<div class="dt-note">チェックポイントに足すときはリナイが 1 行を作り、過去の書類で試してから社長が承認します（DOC-D-00 §2-13）。メール · Teams の自動送信はしていません。</div>'+
    '<div class="dt-actions"><button class="dt-btn ghost" data-close>閉じる</button></div>');
  bindClose();
  $('dtModalBox').querySelectorAll('[data-ack]').forEach(b=>{ b.onclick=async()=>{ b.disabled=true; try{ await spPut(DOC.cpAckPath(b.dataset.ack), JSON.stringify({schema:'checkpoint_report_ack/1', report:b.dataset.ack, by:S.me.code, at:new Date().toISOString()})); toast('確認済みにしました','ok'); cpReportsModal(); }catch(e){ b.disabled=false; toast('保存できません: '+e.message,'warn'); } }; });
}
/* ── 今日やること の帯 — 新しいチェック (有効になって 7 日 · 自分の担当の範囲) ── */
function cpSeen(){ try{ return JSON.parse(lsGet(LS_CP_SEEN,'[]'))||[]; }catch(e){ return []; } }
function cpBannerHtml(){
  if(!CPS.prep) return ''; const buyerIv={}; Object.keys(S.ct||{}).forEach(id=>{ const c=S.ct[id]||{}, b=S.buyers[c._cr49f_buyer_id_value]||{}, code=DOC.ctCode(c.cr49f_sale_contract_no||''); if(b.cr49f_buyer&&code) buyerIv[String(b.cr49f_buyer).toUpperCase()]=code; });   // バイヤー名 → IV コード (契約番号から)
  const rows=DOC.cpNewFor(CPS.prep.rows, S.me, S.docStaff, buyerIv, S.today, cpSeen()); if(!rows.length) return '';
  return rows.map(r=>'<div class="dt-card cp-new"><span class="cp-id">新しいチェック</span><span>'+esc(r.title)+'</span><button class="dt-a" data-cpd="'+esc(r.id)+'">詳しく</button><button class="dt-btn ghost sm" data-cpseen="'+esc(r.id)+'">確認しました</button></div>').join('');
}
function cpBannerBind(box){
  box.querySelectorAll('[data-cpd]').forEach(b=>{ b.onclick=()=>cpDetailModal(b.dataset.cpd); });
  box.querySelectorAll('[data-cpseen]').forEach(b=>{ b.onclick=()=>{ const s=cpSeen(); if(s.indexOf(b.dataset.cpseen)<0) s.push(b.dataset.cpseen); lsSet(LS_CP_SEEN, JSON.stringify(s)); renderTodo(); }; });
}

const CFG = {
  sys:'D-00', name:'書類ツール', version:'0.35', date:'2026-11-27',
  desc:'書類担当の今日の仕事と、ACL・B/L Draft・S/I の確認をまとめたツールです（試験運用中）',   // v0.17 (D1)
  graphScopes:['Sites.ReadWrite.All'],   // 書き込みは D-00/doc_tool/ の下 (履歴 · S/I 控え) · v0.11 D-00/checkpoint_reports/ (見落とし報告 · 確認済み — 新規だけ) — DOC.guardOut
  redirectUri:'https://mhlee205.github.io/DOC_TOOL/',
  onReady:startPage
};
LEENAI.init(CFG);
