<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEENAI D-00 書類ツール v0.4</title>
<link id="leenaiFavicon" rel="icon">
<link rel="stylesheet" href="https://mhlee205.github.io/LEENAI_COMMON/v1/leenai-common.css">
<script src="https://mhlee205.github.io/LEENAI_COMMON/v1/leenai-common.js"></script>
<script>if(!window.LEENAI){document.addEventListener('DOMContentLoaded',function(){document.body.innerHTML='<div style="padding:40px;font-family:sans-serif">共通ファイルの読み込みに失敗しました。ページを再読み込みしてください。</div>';});}</script>
<style>
/* 色 = LEENAI 共通テーマ (4 モード: ダーク · ライト · LEENAI · FOCUS) の変数 + この TOOL の状態 5 色 (モードごと) — v0.2 형님 D4 「모드 4개」
   背景 --bg · 面 --surface · 文字 --text/--text2/--text3 · 線 --border · ボタン --accent-btn · リンク --accent (共通ファイル)。
   この TOOL の色は下の 2 つの表 (明るい 3 モード · ダーク) だけ — 直すときは表だけ (tests/theme.js が 4 モードの読みやすさを計算) */
html{--dt-on-accent:#FFFFFF;
  --st-done-bg:#E6F2EA;--st-done-fg:#1F4A36;--st-todo-bg:#FBEFD9;--st-todo-fg:#6B4508;--st-diff-bg:#FBE3DE;--st-diff-fg:#7A2416;
  --st-wait-bg:#ECEDEA;--st-wait-fg:#454D48;--st-unk-bg:#E4E5E2;--st-unk-fg:#454D48;--st-na-fg:#4F5751;--dt-dot-wait:#6F7871;--dt-hl:#FFF6E0;--dt-now:#E3F0E8}
html:not([data-theme]),html[data-theme="dark"]{--dt-on-accent:#FFFFFF;
  --st-done-bg:#143A27;--st-done-fg:#8EE8AE;--st-todo-bg:#3D2C0C;--st-todo-fg:#F7CF6B;--st-diff-bg:#441A1A;--st-diff-fg:#FDA4A4;
  --st-wait-bg:#272C3B;--st-wait-fg:#C2CAD8;--st-unk-bg:#2C3148;--st-unk-fg:#C2CAD8;--st-na-fg:#9AA3B5;--dt-dot-wait:#8F98AB;--dt-hl:#2B2512;--dt-now:#1D3328}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',system-ui,'Segoe UI',sans-serif}
.ln-hdr-right button[title="マスター設定"]{display:none!important}
.dt-main{max-width:1240px;margin:0 auto;padding:20px 24px 48px;display:flex;flex-direction:column;gap:16px}
.dt-card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.dt-main input,.dt-main textarea,.dt-modal input,.dt-modal textarea{background:var(--surface);color:var(--text)}
.dt-search{padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.dt-search label{font-size:13px;color:var(--text2);white-space:nowrap}
.dt-search input{flex:1 1 320px;min-width:0;height:44px;padding:0 14px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit}
.dt-btn{height:44px;padding:0 22px;border:none;border-radius:8px;background:var(--accent-btn);color:var(--dt-on-accent);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.dt-btn:disabled{opacity:.45;cursor:not-allowed}
.dt-btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);font-weight:400;padding:0 18px}
.dt-btn.sm{height:34px;padding:0 14px;font-size:13px}
.dt-note{font-size:12px;color:var(--text3)}
.dt-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dt-between{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dt-chip{height:34px;padding:0 14px;border-radius:999px;font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.dt-chip.on{border-color:var(--text);background:var(--text);color:var(--surface)}
.dt-seg{display:flex;gap:4px;border:1px solid var(--border);border-radius:10px;padding:3px;background:var(--surface);width:max-content}
.dt-seg button{height:34px;padding:0 14px;border:none;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer;background:transparent;color:var(--text2)}
.dt-seg button.on{background:var(--accent-btn);color:var(--dt-on-accent)}
.dt-pillbtn{height:36px;padding:0 14px;border-radius:999px;font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.dt-pillbtn.on{border-color:var(--accent-btn);background:var(--accent-btn);color:var(--dt-on-accent)}
.dt-check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text2);cursor:pointer;white-space:nowrap}
.dt-check input{width:16px;height:16px;margin:0;accent-color:var(--accent-btn)}
.dt-range{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text2)}
.dt-range input{height:34px;border:1px solid var(--border);border-radius:8px;padding:0 8px;font-family:inherit;font-size:13px;color-scheme:light dark}
.dt-tablewrap{overflow-x:auto}
.dt-t{width:100%;border-collapse:collapse;font-size:14px}
.dt-t thead tr{background:var(--surface2);color:var(--text2);font-size:12px;text-align:left}
.dt-t th{padding:10px 14px;font-weight:500;white-space:nowrap}
.dt-t th.c{padding:10px 8px;text-align:center}
.dt-t td{padding:10px 14px;color:var(--text2);white-space:nowrap}
.dt-t td.c{padding:8px;text-align:center}
.dt-t td.e{font-weight:500;color:var(--text)}
.dt-t tbody tr{border-top:1px solid var(--surface3)}
.dt-t tr.hl{background:var(--dt-hl)}
.dt-link{border:none;background:transparent;padding:6px 4px;font-family:inherit;font-size:14px;color:var(--accent);text-decoration:underline;cursor:pointer}
.dt-tag{margin-left:6px;font-size:11px;padding:1px 6px;border-radius:999px;background:var(--st-diff-bg);color:var(--st-diff-fg)}
.st{display:inline-block;min-width:40px;padding:2px 8px;border-radius:999px;font-size:12px;cursor:default;border:1px solid transparent}
button.st{font-family:inherit;cursor:pointer;line-height:inherit}
button.st:hover{border-color:currentColor}
.st-done{background:var(--st-done-bg);color:var(--st-done-fg)}.st-todo{background:var(--st-todo-bg);color:var(--st-todo-fg)}.st-diff{background:var(--st-diff-bg);color:var(--st-diff-fg)}
.st-wait{background:var(--st-wait-bg);color:var(--st-wait-fg)}.st-na{background:transparent;color:var(--st-na-fg)}.st-unk{background:var(--st-unk-bg);color:var(--st-unk-fg);border-color:var(--st-unk-fg)}.st-load{background:transparent;color:var(--st-na-fg)}
.dt-c-diff{color:var(--st-diff-fg)}.dt-c-todo{color:var(--st-todo-fg)}.dt-c-done{color:var(--st-done-fg)}.dt-c-na{color:var(--st-na-fg)}
.dt-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2)}
.dt-back{border:none;background:transparent;padding:6px 0;font-family:inherit;font-size:14px;color:var(--accent);cursor:pointer}
.dt-sum{padding:14px 18px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 16px}
.dt-sum .k{font-size:12px;color:var(--text3)}.dt-sum .v{font-weight:500;word-break:break-word}
.dt-sum a,.dt-a{font-size:13px;color:var(--accent);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-family:inherit}
.dt-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.dt-tabs button{height:44px;padding:0 16px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:14px;margin-bottom:-1px;color:var(--text3);border-bottom:2px solid transparent;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:6px}
.dt-tabs button.on{color:var(--text);font-weight:500;border-bottom:2px solid var(--accent-btn)}
.dt-tabs button.now{background:var(--dt-now);color:var(--text)}
.dt-tabs .now-tag{font-size:10px;font-weight:500;color:var(--st-done-fg);letter-spacing:.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid transparent}
.dot.st-done{background:var(--st-done-fg)}.dot.st-todo{background:var(--st-todo-fg)}.dot.st-diff{background:var(--st-diff-fg)}.dot.st-wait{background:var(--dt-dot-wait)}.dot.st-unk{background:transparent;border-color:var(--dt-dot-wait)}.dot.st-load,.dot.st-na{display:none}
.dt-panel{padding:24px;display:flex;flex-direction:column;gap:10px}
.dt-h{font-size:18px;font-weight:500}
.dt-p{font-size:14px;color:var(--text2)}
.dt-pills{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;align-items:center}
.dt-pills span.p{padding:4px 12px;border-radius:999px}
.dt-files{font-size:13px;color:var(--text2);font-family:'Consolas','Menlo',monospace;word-break:break-all}
.dt-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-size:14px}
.dt-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dt-prog{font-size:13px;color:var(--text3);min-height:18px}
.dt-empty{padding:24px;text-align:center;color:var(--text3);font-size:13px}
.dt-badge{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--st-todo-bg);color:var(--st-todo-fg);font-weight:500}
.dt-me{font-size:13px;color:var(--text2)}
.dt-hr{border:0;border-top:1px solid var(--surface3);margin:4px 0}
.dt-in{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;font-family:inherit;padding:0 10px}
.dt-in.warn{border-color:var(--st-todo-fg)}.dt-in.dash{border-style:dashed}
.dt-empty-v{color:var(--st-na-fg)}
.dt-xx{background:var(--st-todo-bg);color:var(--st-todo-fg);padding:0 4px;border-radius:4px}
.dt-modal{position:fixed;inset:0;background:rgba(15,17,23,.45);display:flex;align-items:center;justify-content:center;z-index:400;padding:16px}
.dt-modal[hidden]{display:none}
.dt-modal .box{background:var(--surface);color:var(--text);border-radius:12px;border:1px solid var(--border);max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.dt-modal input[type=password],.dt-modal input[type=number]{height:36px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font-family:inherit;font-size:14px}
.dt-kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;font-size:13px}
.dt-kv div:nth-child(odd){color:var(--text3)}
.dt-kv div:nth-child(even){white-space:pre-wrap;word-break:break-word}
.av{display:flex;flex-direction:column;gap:10px}
.av-concl{font-size:16px;font-weight:500;padding:10px 14px;border-radius:10px;background:var(--surface2)}
.av-ok{color:var(--st-done-fg)}.av-ng{color:var(--st-diff-fg)}.av-read,.av-note{color:var(--st-todo-fg)}.av-na{color:var(--st-na-fg)}
.av-hon{font-size:13px;font-weight:400;color:var(--text2);margin-left:8px}
.av-h{font-size:14px;font-weight:500;margin-top:4px}
.av-sub{font-size:12px;color:var(--text3);font-weight:400}
.av-list{border-collapse:collapse;font-size:13px;width:100%}
.av-list td{padding:5px 10px;border-top:1px solid var(--surface3);color:var(--text2)}
.av-list tr.av-g td{background:var(--surface2);font-weight:500;font-size:12px;color:var(--text2)}
.av-m{width:22px;text-align:center;font-weight:700}
.av-diff{border:1px solid var(--border);border-radius:10px;padding:10px 14px;background:var(--surface)}
.av-dn{font-weight:500;font-size:13px;margin-bottom:6px}
.av-cols{border-collapse:collapse;width:100%;font-family:'Consolas','Menlo',monospace;font-size:12.5px}
.av-cols th{text-align:left;font-family:inherit;font-size:12px;color:var(--text3);font-weight:400;padding:2px 8px;width:50%}
.av-cols td{padding:3px 8px;border-top:1px solid var(--surface3);vertical-align:top;white-space:pre-wrap;word-break:break-all;color:var(--text)}
.av-hl{background:var(--st-diff-bg);color:var(--st-diff-fg);border-radius:2px}
.av-more summary{cursor:pointer;font-size:13px;color:var(--text3)}
.av-final{display:flex;flex-direction:column;gap:6px;padding:12px 16px;border:2px solid var(--border);border-radius:12px;background:var(--surface)}
.av-fh{font-size:12px;font-weight:500;color:var(--text3)}
.av-fl{font-size:18px;font-weight:700}
.av-fl.av-hon{font-size:13px;font-weight:400;margin-left:0}
.av-fu{margin:0 0 4px 20px;padding:0;font-size:13px;color:var(--text2)}
.ln-footer{text-align:center;font-size:12px;color:var(--text3);padding:0 0 24px}
@media (max-width:720px){.dt-sum{grid-template-columns:repeat(2,minmax(0,1fr))}.dt-grid3{grid-template-columns:1fr}.dt-main{padding:16px}}
</style>
</head>
<body>
<div id="app" style="display:none">
<main class="dt-main" id="dtMain" style="display:none">

  <section class="dt-card dt-search">
    <label for="dtQ">検索</label>
    <input id="dtQ" placeholder="契約番号 / Invoice / LC番号" autocomplete="off">
    <button id="dtGo" class="dt-btn">検索</button>
    <span id="dtQSt" class="dt-note"></span>
  </section>

  <section id="dtList" style="display:flex;flex-direction:column;gap:12px">
    <div class="dt-row"><span style="font-size:13px;color:var(--text2)">担当</span><span id="dtWho" class="dt-row"></span>
      <span class="dt-note">担当はマスター「書類担当」（Invoice の記号 → 担当者）から。選んだものは記憶します。</span></div>
    <div class="dt-between">
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="dt-seg"><button id="dtBCt">契約別（LC · S/I）</button><button id="dtBIv" class="on">Invoice 別（船積）</button></div>
        <div id="dtBoardNote" class="dt-note" style="font-size:13px"></div>
      </div>
      <div class="dt-row">
        <span id="dtIvCtl" class="dt-row"><span class="dt-range">ETD <input type="date" id="dtFrom"> 〜 <input type="date" id="dtTo"> <button id="dtReload" class="dt-btn ghost sm">読み込む</button></span>
        <label class="dt-check" title="FD（FINAL DOCUMENT）は最後に保存するので、FD がある船積は終わったものとして隠します。外すと全部見えます。"><input type="checkbox" id="dtHideFd" checked> FD済みは表示しない</label></span>
        <span id="dtCtCtl" class="dt-row" style="display:none"><span style="font-size:13px;color:var(--text2)">契約日</span><span id="dtCtPeriod" class="dt-row"></span></span>
        <button id="dtTodo" class="dt-pillbtn">要対応のみ</button><button id="dtAll" class="dt-pillbtn on">すべて</button>
      </div>
    </div>
    <div id="dtProg" class="dt-prog"></div>
    <div class="dt-card dt-tablewrap" id="dtTable"></div>
    <div class="dt-legend">
      <span><span class="st st-done">済</span> 終わった</span>
      <span><span class="st st-todo">確認</span> 今やること</span>
      <span><span class="st st-diff">相違</span> 直してもらう</span>
      <span><span class="st st-wait">待ち</span> まだ届いていない</span>
      <span><span class="st st-unk">?</span> 判断の根拠が見つからない（マウスを乗せると理由）</span>
      <span style="color:var(--text3)">— 対象外（DEPO はベトナム向けのみ · RR は韓国向けのみ · 保険は CIF のみ · LC は LC 取引のみ）</span>
    </div>
  </section>

  <section id="dtIv" style="display:none;flex-direction:column;gap:16px">
    <div><button class="dt-back" data-back="iv">← 一覧へ</button></div>
    <section class="dt-card dt-sum" id="dtIvSum"></section>
    <nav class="dt-tabs" id="dtIvTabs" aria-label="船積の流れ"></nav>
    <div id="dtIvBody"></div>
  </section>

  <section id="dtCt" style="display:none;flex-direction:column;gap:16px">
    <div><button class="dt-back" data-back="ct">← 一覧へ</button></div>
    <section class="dt-card dt-sum" id="dtCtSum"></section>
    <nav class="dt-tabs" id="dtCtTabs" aria-label="契約の流れ"></nav>
    <div id="dtCtBody"></div>
    <div class="dt-card" style="padding:14px 18px;display:flex;flex-direction:column;gap:6px"><div style="font-size:13px;font-weight:500;color:var(--text2)">この契約の船積</div><div id="dtCtShips"></div></div>
  </section>

</main>
<div class="ln-footer">✦ Powered by LEENAI Automation System</div>
</div>
<div id="dtModal" class="dt-modal" hidden><div class="box" id="dtModalBox"></div></div>

<script id="doc-core">
/* ============================================================
   書類ツール — 純粋ロジック (DOM · 通信なし · node 試験対象)
   指示書: (2026-11-20)THOR_指示書_D00_書類ツール_v0.1_시험판_v1_1 (P1 · P2 · P3)
   状態 = 済 · 確認 · 相違 · 待ち · —(対象外) · ?(根拠なし)。推測で 済 を作らない。
   規則は下の表 (NAME · NA · REQ_SI · FD_TENT · CT_REAL · CT_PERIODS) にまとめる — 直すときは表だけ。
   v0.3: ACL の名前の規則は acl_bench エンジン (v0.5) の aclScan / aclPick を使う (この TOOL には持たない — useAclEngine で受け取る)
   v0.4 (2026-11-21 指示書 ACL 最終分析): エンジン v0.6 (最終確認 = S/I の内容が ACL のどこかに全部あるか + コンテナのセット) · ACL 欄の状態に 最終確認 を入れる (表 ACL_RULE · aclJudge)
============================================================ */
const DOC = (()=>{
  const ST = {done:'済', todo:'確認', diff:'相違', wait:'待ち', na:'—', unk:'?', load:'…'};
  /* 船積の流れ (형님 D4 · D5): 通関 → ACL → DEPO → B/L draft → 保険 → RR → FD */
  const STEPS = [['customs','通関'],['acl','ACL'],['depo','DEPO'],['bl','B/L Draft'],['ins','保険'],['rr','RR'],['fd','FD']];
  const CT_STEPS = [['lc','LC'],['si','S/I']];
  const OUT_ROOT = '古紙/-. AI 活用/D-00/doc_tool/';   // この TOOL が SharePoint に書く場所はここだけ
  const SRC = {wip:'古紙/-. 古紙書類/▲ 書類作成中', old:'古紙/_OLD_DOC', lc:'古紙/-. AI 活用/D-01-LC_FD_CHECKER', acl:'古紙/-. AI 活用/D-00/ACL_bench'};

  /* ── ファイル名の規則 (実際の Invoice フォルダ 166 件の名前から · 2026-11-20) ── */
  const NAME = {
    ED:       /_ED(?:[ _\-]*(?:REV\s*\d*|修正版))?\.pdf$/i,                       // 輸出許可 (Export Declaration) — {IV}_ED.pdf · _ED REV2 · _ED修正版
    ED_NOT:   /再輸入|取止/,
    CUSTOMS:  /_(?:IV_PL_SI|IV_PL|IV,PL|SI|IV|PL)(?:\s*REV\s*\d*)?\.pdf$/i,         // 乙仲へ送る通関書類 ({IV}_IV_PL_SI.pdf など)
    CUSTOMS_DIR: /^(?:通関|つうかん)$/,
    BL_FINAL: /_(?:SWB|OBL|SURRENDER|BL)(?:[ _\-]*REV\s*\d*)?\.pdf$/i,             // 発行済み B/L (Sea Waybill · 原本 · Surrender)
    LG:       /(?:^|_)LG\s*\(.*\.xlsx?$/i,                                          // LG (B/L 訂正の保証状) — LG({B/L番号}).xlsx · {船社}_LG(…).xls
    RR:       /_RR(?:[ _\-]*REV)?\s*\d*\.pdf$/i,                                    // 放射線測定報告書
    RR_DIR:   /^_?RR/i,
    VCHG:     /船名変更|本船変更/,
    IV:       /[A-Z]{2,4}\d{4}-\d{2}/gi
  };
  /* 対象外 (—) — 戻り値が文字ならその理由で 対象外 */
  const NA = {
    depo: x=>x.country==='VIETNAM'?null:'ベトナム向けのみ',
    rr:   x=>x.country==='KOREA'?null:'韓国向けのみ',
    ins:  x=>x.term==='CIF'?null:'CIF のみ (この船積は '+(x.term||'条件不明')+')',
    lc:   x=>x.pay==='LC'?null:'LC 取引のみ (決済 '+(x.pay||'不明')+')'
  };
  /* S/I が揃っているか (sino 1) — 船積で決まる XX (重量 · Deposit) は未完成にしない */
  const REQ_SI = [['crcf9_consignee','Consignee'],['crcf9_notify_party','Notify'],['crcf9_po_vo','PO/VO'],['crcf9_place_of_delivery_1','仕向地 (IV/PL)']];
  const XX_NUM = [['crcf9_po_vo','PO/VO'],['crcf9_vo_no','VO No'],['cr49f_lc_no','LC No']];

  const up = s => String(s==null?'':s).trim().toUpperCase();
  const isoDay = s => String(s||'').slice(0,10);
  /* ETD = B/L ETD 優先、なければ計画 ETD (DOC-Z-06 §4 書類・保険の読み方) */

    (P.sis||[]).filter(h=>+h.crcf9_sino>=1&&+h.crcf9_sino<=4).sort((a,b)=>a.crcf9_sino-b.crcf9_sino).forEach(h=>{
      const sn=+h.crcf9_sino; sinos[sn]={}; basis[sn]={};
      SI_HEAD_COLS.forEach(c=>{ sinos[sn][c]=sv(h[c]); basis[sn][c]={source:src}; });
      /* PO · VO — 同じバイヤーの最近の S/I 3 件 (同じ sino) */
      TT_PO.forEach(c=>{ const vals=recent.map(p=>head1(p,sn)).filter(Boolean).map(r=>nv(r[c])), b=basis[sn][c];
        const rs=recent.filter(p=>head1(p,sn)), own=me&&rs.length>1&&rs.every((p,i)=>vals[i]&&up(vals[i]).indexOf(up(p.no))>=0);   // PO = その契約の番号 (実データ T/T 15 バイヤー中 5 — 2026-11-20)
        let kind; if(vals.length<=1) kind='one'; else if(vals.every(v=>v==='')) kind='blank'; else if(vals.every(v=>v===vals[0])) kind='same'; else kind=own?'ctno':'changes';
        if(kind==='ctno'){ sinos[sn][c]=sv(head1(P,sn)[c]).replace(new RegExp(up(P.no).replace(/[-]/g,'\-'),'gi'),me); b.flag='要確認 · PO = 契約番号 (前回 '+short(vals[0],20)+' → 今回の番号)'; }
        else if(kind==='changes'){ sinos[sn][c]=''; b.flag='要確認 · 毎回変わる (前回: '+(short(vals[0])||'空欄')+')'; }
        else if(kind==='one') b.flag='要確認 · 前回 1 件のみ';
        else b.ok='一致';
        b.basis=b.flag||'最近 '+vals.length+' 件 '+(kind==='blank'?'いつも空欄':'いつも同じ');
        if(sn===1) po[c]={kind, n:vals.length, head:vals.map(v=>short(v,4))}; });
      /* L/C の欄 — T/T なので空欄 */
      TT_LC.forEach(c=>{ const was=nv(h[c]); sinos[sn][c]=''; const b=basis[sn][c]={source:'T/T (L/C なし)'}; if(was){ b.flag='要確認 · T/T なので空欄 (前回: '+short(was)+')'; b.basis=b.flag; } else b.ok='一致'; });
      /* 今回と違う欄 — Trade Term (契約) · 仕向地 · 揚地 (今回のブッキング POD は参考) */
      const tt=sinos[sn].cr49f_payment_terms; if(term&&nv(tt)&&up(tt).indexOf(term)<0){ basis[sn].cr49f_payment_terms.flag='要確認 · 今回の契約は '+term; basis[sn].cr49f_payment_terms.basis=basis[sn].cr49f_payment_terms.flag; }
      if(pod) ['crcf9_place_of_delivery_1','crcf9_port_of_discharge'].forEach(c=>{ const v=nv(sinos[sn][c]); if(v&&up(v).indexOf(pod)<0&&pod.indexOf(up(v))<0){ basis[sn][c].flag='要確認 · 今回のブッキング POD: '+pod+' (参考)'; basis[sn][c].basis=basis[sn][c].flag; } });
    });
    /* 明細 — 今回の販売明細 (品目 · 数量 · 単価)。品名 · HS は前回 S/I の同じ品目から、無ければ品目名 */
    const pd=P.details||[];
    const details=(x.sale||[]).map(sd=>{ const d=pd.find(q=>q._crcf9_item_id_value&&q._crcf9_item_id_value===sd._cr49f_item_id_value), o={};
      if(d){ o.crcf9_productname=sv(d.crcf9_productname); o.crcf9_hs_code=sv(d.crcf9_hs_code); o.crcf9_productname__source=o.crcf9_hs_code__source='前回 S/I 明細 ('+P.no+')'; }
      else { o.crcf9_productname=sv(sd.item); o.crcf9_hs_code=''; o.crcf9_productname__source='販売明細の品目名'; o.crcf9_hs_code__source='—';
        o.crcf9_productname__flag='要確認 · 前回 S/I にない品目'; o.crcf9_hs_code__flag='要確認 · HS CODE を入れてください'; }
      return o; });
    return {rec:{sinos, basis, details, notes:'', rejected:[], sourceIssues:[]}, tt:{prev:P.no, recent:recent.map(p=>p.no), po}};
  }

  return {ST, STEPS, CT_STEPS, OUT_ROOT, SRC, NAME, NA, REQ_SI, ACL_VERDICT, ACL_RULE, aclJudge, up, isoDay, etdOf, addDays, fmtMD, ivCode, ctCode, docStaffMap, meOf, visible, shortName,
    /* v0.3 */ useAclEngine, aclReady, aclPick, FD_TENT, fdFiles, fdBundle, honIndex, jstDay, CT_REAL, CT_PERIODS, monthsAgo, sortCtDate,
    blKind, pickBl, aclScan, fdDone, nowTab, shipLabel, TT_PO, ttEarlier, ttRecommend, judgeIv, vesselChange, judgeCt, needs, sortIv, sortCt, inRange, defaultRange, queryKind, parseCsv, mailRulesByIv, guardOut, stamp, safeKey, logPath, baseName,
    utcStamp, aclResultPath, latestAcl, runStamp, aclGroups, mailDraft, mailtoUrl,
    SI_HEAD_COLS, SI_DET_COLS, SI_LABEL, nv, siFieldState, siPlan, isGuid, guardDv, siVerify, siEdits};
})();
if(typeof module!=='undefined') module.exports=DOC;
</script>

/* ── COMPASS (読むだけ) ── */
async function dvGet(path, _r){
  _r=_r||0; const tok=await LEENAI.auth.token('dataverse');
  const res=await fetch(DV_API+'/'+path,{headers:{'Authorization':'Bearer '+tok,'OData-MaxVersion':'4.0','OData-Version':'4.0','Accept':'application/json','Prefer':'odata.maxpagesize=5000,odata.include-annotations="OData.Community.Display.V1.FormattedValue"'}});

}
async function dvAll(path){ let d=await dvGet(path), out=(d.value||[]).slice(); while(d['@odata.nextLink']){ d=await dvGet(d['@odata.nextLink'].replace(DV_API+'/','')); out=out.concat(d.value||[]); } return out; }
async function dvIn(entity, key, ids, select, extra){ const out=[]; const u=[...new Set(ids.filter(Boolean))]; for(let i=0;i<u.length;i+=40){ out.push(...await dvAll(entity+'?$filter='+u.slice(i,i+40).map(x=>key+' eq '+x).join(' or ')+(extra||'')+'&$select='+select)); } return out; }
const BK_SEL='cr49f_bookingid,cr49f_invoice_no,cr49f_booking_no,cr49f_bl_number,cr49f_etd,crcf9_bl_etd,cr49f_main_ship_name,_cr49f_sale_contract_id_value,_cr49f_region_id_value,_cr49f_region_japan_id_value,_cr49f_carrier_id_value,crcf9_insurance_premiums,modifiedon';

const spEnc = p => p.split('/').map(encodeURIComponent).join('/');

async function graphFetch(url, opts, _r){
  _r=_r||0; const tok=await LEENAI.auth.token('graph');
  const res=await fetch(url,Object.assign({},opts||{},{headers:Object.assign({'Authorization':'Bearer '+tok},(opts&&opts.headers)||{})}));

  return res;
}
async function graphJson(url){ const r=await graphFetch(url,{headers:{Accept:'application/json'}}); if(r.status===404) return null; if(!r.ok) throw new Error('Graph '+r.status); return r.json(); }

async function spText(path){ const r=await graphFetch(drv()+'/root:/'+spEnc(path)+':/content'); if(r.status===404) return null; if(!r.ok) throw new Error('SP '+r.status); return r.text(); }
async function spPut(p, content, type){   // 新規のみ (上書きしない)

  const r=await graphFetch(drv()+'/root:/'+spEnc(p)+':/content?@microsoft.graph.conflictBehavior=fail',{method:'PUT',headers:{'Content-Type':type||'application/json'},body:new Blob([content],{type:type||'application/json'})});
  if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error('SP PUT '+r.status+': '+(e.error&&e.error.message||'')); }

}

/* ── 読み込み ── */
function prog(t){ $('dtProg').textContent=t||''; }
async function loadAll(){
  const seq=++S.loadSeq, t0=Date.now(); S.doneMsg=''; S.folders={}; S.bk=[]; S.ct={}; S.ctBk={}; S.sis={}; S.lcFiles=null; render();
  /* v0.3: ACL の名前の規則 · 照合 · 結果の見せ方 = acl_bench エンジン (v0.4: v0.6) — 最初に読み始める (読めなければ ACL の欄は ?) */
  const engP=S.engine==='ok'?Promise.resolve():loadAclEngine().then(E=>{ DOC.useAclEngine(E); S.aclE=E; S.engine='ok'; S.engineErr=null; }).catch(e=>{ S.engine='error'; S.engineErr=e; });
  try{

    if(!S.staff.length){ const [st,ds]=await Promise.all([LEENAI.master.get('staff').catch(()=>[]), LEENAI.master.get('doc_staff').catch(()=>[])]);
      S.staff=st||[]; S.docStaff=DOC.docStaffMap(ds); S.me=DOC.meOf(LEENAI.user&&LEENAI.user.email, S.staff); renderMe(); renderWho(); }
    const f=S.range.from, t=S.range.to;
    const [bk, regs, pols]=await Promise.all([
      dvAll(`cr49f_bookings?$filter=(cr49f_etd ge ${f} and cr49f_etd le ${t}) or (crcf9_bl_etd ge ${f} and crcf9_bl_etd le ${t})&$select=${BK_SEL}`),
      Object.keys(S.regions).length?null:dvAll('cr49f_regions?$select=cr49f_regionid,cr49f_region,cr49f_pod'),
      Object.keys(S.pols).length?null:dvAll('crcf9_region_japans?$select=crcf9_region_japanid,crcf9_pol')]);
    if(seq!==S.loadSeq) return;
    if(regs) regs.forEach(r=>{ S.regions[r.cr49f_regionid]={country:DOC.up(r.cr49f_region), pod:r.cr49f_pod||''}; });
    if(pols) pols.forEach(r=>{ S.pols[r.crcf9_region_japanid]=r.crcf9_pol||''; });
    S.bk=bk.filter(b=>b.cr49f_invoice_no&&DOC.inRange(DOC.etdOf(b),f,t));
    const recent=await dvAll(`cr49f_sale_contracts?$filter=cr49f_sale_contract_date ge ${DOC.monthsAgo(S.today,6)}&$select=${CT_SEL}`);   // v0.3: 契約別 = 契約日 直近 6 ヶ月まで
    const cts=await dvIn('cr49f_sale_contracts','cr49f_sale_contractid',S.bk.map(b=>b._cr49f_sale_contract_id_value),CT_SEL);
    cts.concat(recent).forEach(c=>{ S.ct[c.cr49f_sale_contractid]=c; });
    const ids=Object.keys(S.ct);
    const [buyers, allBk, sis]=await Promise.all([
      dvIn('cr49f_buyers','cr49f_buyerid',Object.values(S.ct).map(c=>c._cr49f_buyer_id_value),'cr49f_buyerid,cr49f_buyer,cr49f_buyer_name,crcf9_country'),
      dvIn('cr49f_bookings','_cr49f_sale_contract_id_value',ids,'cr49f_bookingid,cr49f_invoice_no,cr49f_etd,crcf9_bl_etd,_cr49f_sale_contract_id_value'),
      dvIn('cr49f_s_is','_cr49f_sale_contract_id_value',ids,SI_SEL)]);
    if(seq!==S.loadSeq) return;
    buyers.forEach(b=>{ S.buyers[b.cr49f_buyerid]=b; });
    ids.forEach(id=>{ S.ctBk[id]=[]; S.sis[id]=[]; }); allBk.forEach(b=>{ (S.ctBk[b._cr49f_sale_contract_id_value]=S.ctBk[b._cr49f_sale_contract_id_value]||[]).push(b); });
    sis.forEach(s=>{ (S.sis[s._cr49f_sale_contract_id_value]=S.sis[s._cr49f_sale_contract_id_value]||[]).push(s); });
    render(); prog('SharePoint を読み込み中… (フォルダ · LC · ACL 照合結果)');
    await Promise.all([loadLcFiles(), loadRoots(), loadAclRun().then(loadAclLocal), loadMails(), loadHon(), engP]);
    if(seq!==S.loadSeq) return;
    buildHon(); render();
    const list=S.bk.map(b=>DOC.up(b.cr49f_invoice_no)); let k=0;
    await mapLimit(list,4,async iv=>{ if(seq!==S.loadSeq) return; await loadFolder(iv); k++; if(k%8===0||k===list.length){ prog('読み込み中 '+k+' / '+list.length+' (Invoice フォルダ)'); render(); } });
    if(seq!==S.loadSeq) return;
    S.loadedMs=Date.now()-t0; S.doneMsg='読み込み完了 — 船積 '+S.bk.length+' 件 · 契約 '+ids.length+' 件 · '+(S.loadedMs/1000).toFixed(0)+' 秒'+(S.acl?' · ACL 照合結果 '+S.acl.runId:'')+' · '+honNote()+(S.engine==='error'?' · ⚠ ACL エンジンを読めない':''); prog(S.doneMsg);
    render();
  }catch(e){ prog('読み込み失敗: '+e.message); toast('読み込み失敗: '+e.message,'danger'); }
}
async function loadLcFiles(){ try{ const k=await spChildren(DOC.SRC.lc); const m={}; (k||[]).filter(x=>x.file&&/\.json$/i.test(x.name)).forEach(x=>{ const c=DOC.up(x.name.split('_')[0]); (m[c]=m[c]||[]).push({name:x.name, webUrl:x.webUrl, lastModified:x.lastModifiedDateTime}); }); S.lcFiles=m; }catch(e){ S.lcFiles={}; S.lcErr=e.message; } }
async function loadRoots(){
  const y=+S.today.slice(0,4); S.wip={}; S.old={};
  const [w,o1,o2]=await Promise.all([spChildren(DOC.SRC.wip).catch(()=>null), spChildren(DOC.SRC.old+'/'+y).catch(()=>null), spChildren(DOC.SRC.old+'/'+(y-1)).catch(()=>null)]);
  (w||[]).filter(x=>x.folder).forEach(x=>{ S.wip[DOC.up(x.name)]={path:DOC.SRC.wip+'/'+x.name, webUrl:x.webUrl}; });
  [[o1,y],[o2,y-1]].forEach(([l,yy])=>(l||[]).filter(x=>x.folder).forEach(x=>{ const k=DOC.up(x.name); if(!S.old[k]) S.old[k]={path:DOC.SRC.old+'/'+yy+'/'+x.name, webUrl:x.webUrl}; }));
  S.rootErr=w?'':'書類作成中 を読めない';
}
async function loadFolder(iv, bk){
  const b=bk||S.bk.find(x=>DOC.up(x.cr49f_invoice_no)===iv), loc=S.wip[iv]||S.old[iv];
  if(!loc){ S.folders[iv]='missing'; return; }
  try{
    const k=await spChildren(loc.path); if(!k){ S.folders[iv]='missing'; return; }
    const files=k.filter(x=>x.file).map(x=>({name:x.name, lastModified:x.lastModifiedDateTime, webUrl:x.webUrl, id:x.id, size:x.size}));
    const subs=k.filter(x=>x.folder);
    /* 下のフォルダは必要なものだけ — 通関 (輸出許可がないとき) · RR (韓国向けで報告書がないとき) */
    const country=b?((S.regions[b._cr49f_region_id_value]||{}).country||''):'';
    const fdTop=DOC.fdFiles(files, iv).length;   // v0.3: 台湾向け — Invoice 番号のフォルダ (IV · PL · B/L まとめ) は FD がないときだけ見る
    const want=subs.filter(s=>(DOC.NAME.CUSTOMS_DIR.test(s.name)&&!files.some(f=>DOC.NAME.ED.test(f.name)))||(country==='KOREA'&&DOC.NAME.RR_DIR.test(s.name)&&!files.some(f=>DOC.NAME.RR.test(f.name)))||(!fdTop&&DOC.up(s.name)===iv));
    for(const s of want){ const c=await spChildren(loc.path+'/'+s.name); (c||[]).filter(x=>x.file).forEach(x=>files.push({name:x.name, sub:s.name, lastModified:x.lastModifiedDateTime, webUrl:x.webUrl, id:x.id})); }
    S.folders[iv]={path:loc.path, webUrl:loc.webUrl, live:!!S.wip[iv], files, subs:subs.map(s=>s.name)};

/* ACL — 最も新しい 照合結果 (ACL_bench/ACL_yyyymmdd-hhmmss/results.json · 約 7 MB) */
async function loadAclRun(){
  try{ const k=await spChildren(DOC.SRC.acl); const runs=(k||[]).filter(x=>x.folder&&/^ACL_\d{8}-\d{6}$/.test(x.name)).map(x=>x.name).sort().reverse();
    for(const r of runs){ const t=await spText(DOC.SRC.acl+'/'+r+'/results.json'); if(!t) continue; const j=JSON.parse(t), by={};
      (j.results||[]).forEach(x=>{ by[DOC.up(x.invoice)]=x; }); S.acl={runId:r, finished:j.finished||'', version:j.version||'', by}; return; }
    S.acl=null; S.aclErr='照合結果なし';
  }catch(e){ S.acl=null; S.aclErr=e.message; }
}
/* メール一覧 CSV (mail_docstaff*.csv — ACL_bench/_input を優先 · 最新) → 件名規則 本船変更 */
async function loadMails(){
  try{ let url=drv()+"/root/search(q='mail_docstaff')?$select=id,name,size,lastModifiedDateTime,parentReference,file&$top=50", out=[];
    while(url){ const j=await graphJson(url); out=out.concat((j&&j.value)||[]); url=j&&j['@odata.nextLink']||null; }
    const cs=out.filter(x=>/^mail_docstaff.*\.csv$/i.test(x.name||''));
    const inInput=x=>String((x.parentReference&&x.parentReference.path)||'').indexOf('ACL_bench/_input')>=0?1:0;
    cs.sort((a,b)=>(inInput(b)-inInput(a))||String(b.lastModifiedDateTime||'').localeCompare(String(a.lastModifiedDateTime||'')));

async function loadHon(){
  S.honRaw=[]; S.honErr='';
  try{ const since=DOC.addDays(S.range.from,-60), dom=String((LEENAI.user&&LEENAI.user.email)||'').toLowerCase().split('@')[1]||'';
    let url=GRAPH+'me/messages?$search='+encodeURIComponent('"本登録"')+'&$select=subject,from,sentDateTime,uniqueBody,bodyPreview&$top=100', n=0;
    while(url&&n<10){ const r=await graphFetch(url,{headers:{Accept:'application/json',Prefer:'outlook.body-content-type="text"'}}); if(!r.ok) throw new Error('メールを読めない ('+r.status+')'); const j=await r.json(); n++;
      (j.value||[]).forEach(m=>{ const from=String(m.from&&m.from.emailAddress&&m.from.emailAddress.address||'').toLowerCase(); if(!dom||from.split('@')[1]!==dom) return; if(String(m.sentDateTime||'').slice(0,10)<since) return;

  let msg='', nid=method==='PATCH'?id:null;
  if(res.ok&&method==='POST'){ const rep=await res.json().catch(()=>null); nid=rep&&rep[set==='cr49f_s_is'?'cr49f_s_iid':'crcf9_s_i_detailid']||null;
    if(!nid){ const loc=(res.headers&&res.headers.get('OData-EntityId'))||''; nid=(loc.match(/\(([0-9a-f-]{36})\)\s*$/i)||[])[1]||null; } }
  else if(!res.ok){ const e=await res.json().catch(()=>({})); msg=(e.error&&e.error.message)||res.statusText||''; }
  return {ok:res.ok&&DOC.isGuid(nid), status:res.status, message:msg, id:DOC.isGuid(nid)?nid:null};
}
async function siMeta(){   // エンティティセット · 連結の名前は実行時にメタデータから (推測しない — compass_write_test と同じ)
  if(S.siMeta) return S.siMeta;
  const L={si:'cr49f_s_i', detail:'crcf9_s_i_detail', contract:'cr49f_sale_contract', saleDetail:'cr49f_sale_detail', item:'cr49f_item'}, sets={}, nav={}, problems=[];
  for(const k of Object.keys(L)) sets[k]=(await dvGet("EntityDefinitions(LogicalName='"+L[k]+"')?$select=EntitySetName")).EntitySetName;
  const m2o={}; for(const ent of ['cr49f_s_i','crcf9_s_i_detail']) m2o[ent]=(await dvGet("EntityDefinitions(LogicalName='"+ent+"')/ManyToOneRelationships?$select=ReferencingAttribute,ReferencedEntity,ReferencingEntityNavigationPropertyName")).value||[];
  [['contract','cr49f_s_i','cr49f_sale_contract_id','cr49f_sale_contract'],['si','crcf9_s_i_detail','crcf9_s_i_id','cr49f_s_i'],['saleDetail','crcf9_s_i_detail','crcf9_sale_detail_id','cr49f_sale_detail'],['item','crcf9_s_i_detail','crcf9_item_id','cr49f_item']].forEach(([k,ent,att,ref])=>{
    const r=(m2o[ent]||[]).filter(x=>x.ReferencingAttribute===att&&x.ReferencedEntity===ref); if(r.length===1&&r[0].ReferencingEntityNavigationPropertyName) nav[k]=r[0].ReferencingEntityNavigationPropertyName; else problems.push(ent+'.'+att+' の連結 '+r.length+' 個'); });
  if(sets.si!=='cr49f_s_is'||sets.detail!=='crcf9_s_i_details') problems.push('S/I のセット名が違う');
  if(problems.length) throw new Error('メタデータ — 書かない: '+problems.join(' / '));
  S.siMeta={sets, nav}; return S.siMeta;
}
async function siReadNow(id, head){
  const sel=head.concat(['cr49f_s_iid','crcf9_sino','modifiedon']).join(',');
  const sis=await dvAll(`cr49f_s_is?$filter=_cr49f_sale_contract_id_value eq ${id}&$select=${sel}&$orderby=crcf9_sino asc`), details=[];
  for(const h of sis){ h._details=await dvAll(`crcf9_s_i_details?$filter=_crcf9_s_i_id_value eq ${h.cr49f_s_iid}&$select=crcf9_s_i_detailid,crcf9_productname,crcf9_hs_code,crcf9_weight,crcf9_price,_crcf9_sale_detail_id_value,_crcf9_item_id_value,_crcf9_s_i_id_value`); details.push(...h._details); }
  return {sis, details};
}
const opLine = op => (op.method==='POST'?'新規 ':'変更 ')+(op.set==='cr49f_s_is'?'S/I sino '+op.sino:'明細 '+op.line+' (sino '+op.sino+')');
async function siWrite(id){
  const res=S.siRec[id]; if(!res) return; const no=res.no, st=$('dtSiSt');
  try{
    if(st) st.textContent='COMPASS の今の S/I を読み直しています…';
    const fin=siFinal(id), cur=await siReadNow(id,res.fieldHead), ops=DOC.siPlan(cur,fin,res.sale);
    if(!ops.length){ if(st) st.textContent='COMPASS と同じです — 書き込むものはありません'; return; }
    const meta=await siMeta(), n=ops.reduce((a,o)=>a+o.changes.length,0);
    if(st) st.textContent='';
    modal('<div class="dt-h">COMPASS に書き込む — '+esc(no)+'</div><div class="dt-note">書く前に今の S/I を SharePoint に控えます。消す操作はありません。</div>'+
      ops.map(op=>'<div style="font-weight:500;font-size:14px;margin-top:6px">'+esc(opLine(op))+'</div><div class="dt-kv">'+op.changes.map(cg=>'<div>'+esc(DOC.SI_LABEL[cg.col]||cg.col)+'</div><div><span style="color:var(--st-diff-fg);text-decoration:line-through">'+esc(cg.before||'(空欄)')+'</span> → '+(cg.after===''&&cg.before!==''?'<b style="color:var(--st-diff-fg)">(空欄にします — 今の値が消えます)</b>':'<b>'+esc(cg.after||'(空欄)')+'</b>')+'</div>').join('')+'</div>').join('')+
      '<label class="dt-row" style="font-size:13px"><input type="checkbox" id="dtSiOk"> '+ops.length+' 件 · '+n+' 欄の内容を確認しました</label><div class="dt-actions"><button class="dt-btn ghost" data-close="1">やめる</button><button class="dt-btn" id="dtSiGo" disabled>書き込む</button></div>');
    $('dtSiOk').onchange=()=>{ $('dtSiGo').disabled=!$('dtSiOk').checked; };
    $('dtSiGo').onclick=()=>{ closeModal(); siExecute(id, ops, cur, fin, meta); };
  }catch(e){ if(st) st.innerHTML='<span style="color:var(--st-diff-fg)">書き込めません: '+esc(e.message)+'</span>'; }
}
async function siExecute(id, ops, cur, fin, meta){
  const res=S.siRec[id], no=res.no, here=()=>!!(S.cur&&S.cur.type==='ct'&&S.cur.id===id), rc=()=>{ if(here()) renderCt(); }, st=()=>here()?$('dtSiSt'):null, say=m=>{ const e=st(); if(e) e.textContent=m; }, d=new Date(), at=d.toISOString();
  S.siBusy[id]='書き込み中…'; rc();
  const log={kind:'S/I 書き込み', contract:no, contract_id:id, at, user:(LEENAI.user&&LEENAI.user.email)||'', engine:res.engine, rec_at:res.at, cost:res.cost, edits:DOC.siEdits(res.rec,fin), ops:[], verify:null, backup:''};
  try{
    say('COMPASS が確認画面のあとに変わっていないか確かめています…');   // 確認画面を開いている間に COMPASS で直された → 書かない
    const again=await siReadNow(id,res.fieldHead), stamp=x=>JSON.stringify(x.sis.map(h=>[h.cr49f_s_iid,h.modifiedon]).concat(x.details.map(q=>[q.crcf9_s_i_detailid,q._crcf9_sale_detail_id_value])));
    if(stamp(again)!==stamp(cur)) throw new Error('確認画面のあとに COMPASS の S/I が変わりました — もう一度「COMPASS に書き込む」から');
    say('控えを保存しています…');
    const bp=DOC.OUT_ROOT+'si_backup/'+DOC.safeKey(no)+'_'+DOC.utcStamp(d)+'.json';
    await spPut(bp, JSON.stringify({contract:no, contract_id:id, at, user:log.user, current:cur, plan:ops}));   // 控えに失敗したら書かない
    log.backup=bp;
    const ctx={contractId:id, siIds:new Set(cur.sis.map(h=>h.cr49f_s_iid)), detailIds:new Set(cur.details.map(x=>x.crcf9_s_i_detailid)), created:new Set(),
      saleDetailIds:new Set(res.sale.map(s=>s.cr49f_sale_detailid)), itemIds:new Set(res.sale.map(s=>s._cr49f_item_id_value).filter(Boolean)), sets:meta.sets, nav:meta.nav};
    const newSi={}, bind=(set,x)=>'/'+set+'('+x+')'; let k=0, failed=null;
    for(const op of ops){
      say('書き込み '+(++k)+' / '+ops.length+' — '+opLine(op));
      const body=Object.assign({},op.body);
      if(op.method==='POST'&&op.set==='cr49f_s_is') body[meta.nav.contract+'@odata.bind']=bind(meta.sets.contract,id);
      if(op.method==='POST'&&op.set==='crcf9_s_i_details'){ const sid=/^new:/.test(op.siRef)?newSi[op.siRef]:op.siRef; if(!sid){ failed={op, message:'S/I が作れていない'}; break; }
        body[meta.nav.si+'@odata.bind']=bind(meta.sets.si,sid); body[meta.nav.saleDetail+'@odata.bind']=bind(meta.sets.saleDetail,op.saleDetail); if(op.item) body[meta.nav.item+'@odata.bind']=bind(meta.sets.item,op.item); }
      const r=await dvWrite(op.method, op.set, op.method==='PATCH'?op.id:null, body, ctx);
      log.ops.push({what:opLine(op), method:op.method, set:op.set, id:r.id||op.id||null, status:r.status, ok:r.ok, message:r.message, changes:op.changes});
      if(!r.ok){ failed={op, message:r.status+' '+r.message}; break; }
      if(op.method==='POST'){ op.id=r.id; if(op.set==='cr49f_s_is'){ newSi[op.ref]=r.id; ctx.created.add(r.id); } else ctx.detailIds.add(r.id); }
    }
    say('読み直して確かめています…');
    const now=await siReadNow(id,res.fieldHead), ver=DOC.siVerify(ops.filter(o=>o.id), now); log.verify=ver; log.failed=failed?{what:opLine(failed.op), message:failed.message}:null;
    S.sis[id]=now.sis; res.current=now.sis; S.siEdit[id]={sinos:{},details:[]}; S.siCur[id]=undefined;   // 今の S/I 表は次に開いたとき読み直す
    try{ await spPut(DOC.logPath(no,'si',d), JSON.stringify(log)); }catch(e){ toast('履歴の保存に失敗: '+e.message,'warn'); }
    S.siBusy[id]=''; rc();
    const e=st(); if(e) e.innerHTML=failed?'<span style="color:var(--st-diff-fg)">途中で止めました ('+esc(log.failed.what)+': '+esc(failed.message)+') — 書いた分は確認表どおり · 控え '+esc(log.backup)+'</span>'
      :(ver.ok?'<span style="color:var(--st-done-fg)">書き込みました ('+ops.length+' 件) · 読み直して一致 ✓ · 控え '+esc(log.backup)+'</span>':'<span style="color:var(--st-diff-fg)">書き込みましたが読み直すと '+ver.rows.filter(x=>!x.ok).length+' 欄が違います — COMPASS 画面で確認してください · 控え '+esc(log.backup)+'</span>');
    toast(failed?'途中で止めました':ver.ok?'COMPASS に書き込みました':'書き込み後の確認で違いあり', failed||!ver.ok?'warn':'ok');
  }catch(e){ S.siBusy[id]=''; rc(); const el=st(); if(el) el.innerHTML='<span style="color:var(--st-diff-fg)">書き込めません: '+esc(e.message)+(log.backup?' · 控え '+esc(log.backup):' (何も書いていません)')+'</span>';
    try{ log.error=e.message; if(log.backup) await spPut(DOC.logPath(no,'si',d), JSON.stringify(log)); }catch(x){} }
}


function startPage(){
  $('dtMain').style.display='';
  const d=new Date(), p=n=>String(n).padStart(2,'0'); S.today=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
  let rg={before:30,after:45}; try{ rg=Object.assign(rg,JSON.parse(lsGet(LS.range,'{}'))); }catch(e){}
  S.range=DOC.defaultRange(S.today,+rg.before,+rg.after); $('dtFrom').value=S.range.from; $('dtTo').value=S.range.to;
  S.who=lsGet(LS.who,'me'); S.board=lsGet(LS.board,'iv')==='ct'?'ct':'iv';
  S.hideFd=lsGet(LS.hidefd,'1')!=='0';   // 既定 ON (형님 D2)
  S.ctMonths=+lsGet(LS.ctmonths,'1'); if(!DOC.CT_PERIODS.some(p=>p[0]===S.ctMonths)) S.ctMonths=1;   // v0.3 既定 直近1ヶ月
  $('dtHideFd').onchange=()=>{ S.hideFd=$('dtHideFd').checked; lsSet(LS.hidefd,S.hideFd?'1':'0'); render(); };
  $('dtBIv').onclick=()=>{ S.board='iv'; lsSet(LS.board,'iv'); render(); }; $('dtBCt').onclick=()=>{ S.board='ct'; lsSet(LS.board,'ct'); render(); };
  $('dtTodo').onclick=()=>{ S.todoOnly=true; render(); }; $('dtAll').onclick=()=>{ S.todoOnly=false; render(); };
  $('dtReload').onclick=()=>{ const f=$('dtFrom').value, t=$('dtTo').value; if(!f||!t||f>t){ prog('ETD の範囲が正しくありません'); return; } S.range={from:f,to:t}; loadAll(); };
  $('dtGo').onclick=runSearch; $('dtQ').addEventListener('keydown',e=>{ if(e.key==='Enter') runSearch(); });
  document.querySelectorAll('[data-back]').forEach(b=>{ b.onclick=()=>{ S.board=b.dataset.back==='ct'?'ct':'iv'; show('list'); }; });
  $('dtModal').addEventListener('click',e=>{ if(e.target===$('dtModal')) closeModal(); });
  renderMe(); renderWho(); loadAll();
}

   キーは書かない (同じアドレスのほかの TOOL の既定を変えないため) — 共通ファイルが読むときだけ 'leenai' と答え、テーマボタンで選べば共通ファイルが記憶する。
   localStorage に関数を置くと 「項目の保存」 になる (Storage の決まり) ので、このページの Storage.prototype.getItem をこのキーのときだけ包む (ほかのページ · TOOL には届かない) */
(function(){ try{ const P=window.Storage&&window.Storage.prototype, orig=P&&P.getItem; if(!orig||orig.call(window.localStorage,'leenai_theme')!=null) return;
  P.getItem=function(k){ const v=orig.call(this,k); return this===window.localStorage&&k==='leenai_theme'&&v==null?'leenai':v; }; }catch(e){} })();
