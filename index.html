<style>
/* 色 = 白地 + 濃い緑 1 色 + 状態 5 色 (画面案 v0.1 どおり · 형님 D7 「シンプル」) — 共通テーマ切替でも変えない */
html[data-theme]{--bg:#F6F7F5;--surface:#FFFFFF;--surface2:#F6F7F5;--surface3:#EEF0EC;--border:#E3E6E1;--text:#1E2420;--text2:#4A544D;--text3:#5E6A62;

  --font:'Noto Sans JP',system-ui,'Segoe UI',sans-serif}
[data-ln="themeBtn"],.ln-hdr-right button[title="マスター設定"]{display:none!important}
body{background:#F6F7F5;color:#1E2420}
.dt-main{max-width:1240px;margin:0 auto;padding:20px 24px 48px;display:flex;flex-direction:column;gap:16px}

.dt-btn{height:44px;padding:0 22px;border:none;border-radius:8px;background:#2F6B4F;color:#FFFFFF;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.dt-btn:disabled{opacity:.45;cursor:not-allowed}
.dt-btn.ghost{background:#FFFFFF;color:#1E2420;border:1px solid #C9CFC7;font-weight:400;padding:0 18px}
.dt-btn.sm{height:34px;padding:0 14px;font-size:13px}
.dt-note{font-size:12px;color:#5E6A62}
.dt-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dt-between{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

.dt-seg{display:flex;gap:4px;border:1px solid #C9CFC7;border-radius:10px;padding:3px;background:#FFFFFF;width:max-content}

.dt-pillbtn{height:36px;padding:0 14px;border-radius:999px;font-family:inherit;font-size:13px;cursor:pointer;border:1px solid #C9CFC7;background:#FFFFFF;color:#1E2420}
.dt-pillbtn.on{border-color:#2F6B4F;background:#2F6B4F;color:#FFFFFF}
.dt-range{display:flex;gap:6px;align-items:center;font-size:12px;color:#4A544D}
.dt-range input{height:34px;border:1px solid #C9CFC7;border-radius:8px;padding:0 8px;font-family:inherit;font-size:13px}

.dt-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-size:14px}

.dt-empty{padding:24px;text-align:center;color:#5E6A62;font-size:13px}
.dt-badge{font-size:12px;padding:2px 10px;border-radius:999px;background:#FBEFD9;color:#6B4508;font-weight:500}
.dt-me{font-size:13px;color:#4A544D}
.dt-modal{position:fixed;inset:0;background:rgba(30,36,32,.35);display:flex;align-items:center;justify-content:center;z-index:400;padding:16px}

.dt-modal input[type=password],.dt-modal input[type=number]{height:36px;border:1px solid #C9CFC7;border-radius:8px;padding:0 10px;font-family:inherit;font-size:14px}
.dt-kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;font-size:13px}
.dt-kv div:nth-child(odd){color:#5E6A62}
.dt-kv div:nth-child(even){white-space:pre-wrap;word-break:break-word}
.ln-footer{text-align:center;font-size:12px;color:#5E6A62;padding:0 0 24px}
@media (max-width:720px){.dt-sum{grid-template-columns:repeat(2,minmax(0,1fr))}.dt-grid3{grid-template-columns:1fr}.dt-main{padding:16px}}
</style>

<script id="doc-core">
/* ============================================================
   書類ツール — 純粋ロジック (DOM · 通信なし · node 試験対象)
   指示書: (2026-11-20)THOR_指示書_D00_書類ツール_v0.1_시험판_v1_1 (P1 · P2 · P3)
   状態 = 済 · 確認 · 相違 · 待ち · —(対象外) · ?(根拠なし)。推測で 済 を作らない。
   規則は下の表 (NAME · NA · REQ_SI) にまとめる — 直すときは表だけ。
============================================================ */
const DOC = (()=>{
  const ST = {done:'済', todo:'確認', diff:'相違', wait:'待ち', na:'—', unk:'?', load:'…'};
  /* 船積の流れ (형님 D4 · D5): 通関 → ACL → DEPO → B/L draft → 保険 → RR → FD */
  const STEPS = [['customs','通関'],['acl','ACL'],['depo','DEPO'],['bl','B/L Draft'],['ins','保険'],['rr','RR'],['fd','FD']];
  const CT_STEPS = [['lc','LC'],['si','S/I']];
  const OUT_ROOT = '古紙/-. AI 活用/D-00/doc_tool/';   // この TOOL が SharePoint に書く場所はここだけ
  const SRC = {wip:'古紙/-. 古紙書類/▲ 書類作成中', old:'古紙/_OLD_DOC', lc:'古紙/-. AI 活用/D-01-LC_FD_CHECKER', acl:'古紙/-. AI 活用/D-00/ACL_bench'};

  /* ── ファイル名の規則 (実際の Invoice フォルダ 166 件の名前から · 2026-11-20) ── */
  const NAME = {
    ED:       /_ED(?:[ _\-]*(?:REV\s*\d*|修正版))?\.pdf$/i,                       // 輸出許可 (Export Declaration) — {IV}_ED.pdf · _ED REV2 · _ED修正版
    ED_NOT:   /再輸入|取止/,
    CUSTOMS:  /_(?:IV_PL_SI|IV_PL|IV,PL|SI|IV|PL)(?:\s*REV\s*\d*)?\.pdf$/i,         // 乙仲へ送る通関書類 ({IV}_IV_PL_SI.pdf など)
    CUSTOMS_DIR: /^(?:通関|つうかん)$/,
    ACL:      /^(.+?)_ACL(?:[ _\-]*\(?\s*REV\s*(\d*)\s*\)?)?\.pdf$/i,              // acl_bench v0.4 ACL_NAME と同じ
    ACL_TEMP: /仮ACL|ACL仮登録/i,
    BL_FINAL: /_(?:SWB|OBL|SURRENDER|BL)(?:[ _\-]*REV\s*\d*)?\.pdf$/i,             // 発行済み B/L (Sea Waybill · 原本 · Surrender)
    LG:       /(?:^|_)LG\s*\(.*\.xlsx?$/i,                                          // LG (B/L 訂正の保証状) — LG({B/L番号}).xlsx · {船社}_LG(…).xls
    RR:       /_RR(?:[ _\-]*REV)?\s*\d*\.pdf$/i,                                    // 放射線測定報告書
    RR_DIR:   /^_?RR/i,
    FD:       /_FD(?:\s*\d*|[ _\-]*REV\s*\d*)\.pdf$/i,                              // FINAL DOCUMENT
    VCHG:     /船名変更|本船変更/,
    IV:       /[A-Z]{2,4}\d{4}-\d{2}/gi
  };
  /* 対象外 (—) — 戻り値が文字ならその理由で 対象外 */
  const NA = {
    depo: x=>x.country==='VIETNAM'?null:'ベトナム向けのみ',
    rr:   x=>x.country==='KOREA'?null:'韓国向けのみ',
    ins:  x=>x.term==='CIF'?null:'CIF のみ (この船積は '+(x.term||'条件不明')+')',
    lc:   x=>x.pay==='LC'?null:'LC 取引のみ (決済 '+(x.pay||'不明')+')'
  };
  /* S/I が揃っているか (sino 1) — 船積で決まる XX (重量 · Deposit) は未完成にしない */
  const REQ_SI = [['crcf9_consignee','Consignee'],['crcf9_notify_party','Notify'],['crcf9_po_vo','PO/VO'],['crcf9_place_of_delivery_1','仕向地 (IV/PL)']];
  const XX_NUM = [['crcf9_po_vo','PO/VO'],['crcf9_vo_no','VO No'],['cr49f_lc_no','LC No']];

  const up = s => String(s==null?'':s).trim().toUpperCase();
  const isoDay = s => String(s||'').slice(0,10);
  /* ETD = B/L ETD 優先、なければ計画 ETD (DOC-Z-06 §4 書類・保険の読み方) */
  const etdOf = b => isoDay((b&&(b.crcf9_bl_etd||b.cr49f_etd))||'');
  const addDays = (iso, n) => { const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
  const fmtMD = iso => iso?(+iso.slice(5,7))+'/'+iso.slice(8,10):'—';

  /* ── 担当 (形님 D6 · F3) — Invoice N{code}{yymm}-nn · 契約 LRS-{yymm}{code}{n} の同じバイヤー記号 ── */
  function ivCode(iv){ const m=up(iv).match(/^[A-Z]([A-Z]+)\d{4}-\d+/); return m?m[1]:''; }
  function ctCode(ct){ const m=up(ct).match(/^[A-Z]+-\d{4,5}([A-Z]+)\d+$/); return m?m[1]:''; }
  function docStaffMap(items){ const m={}; (items||[]).forEach(r=>{ const c=up(r.iv_code); if(c) m[c]=String(r.staff||'').trim(); }); return m; }
  function meOf(email, staffItems){ const e=String(email||'').trim().toLowerCase(); const s=(staffItems||[]).find(r=>String(r.email||'').trim().toLowerCase()===e&&e);
    return s?{code:s.code, name:s.name_ja||s.code, admin:!!s.portal_admin}:{code:'', name:'', admin:false}; }
  /* who: 'me' · 'all' · 担当コード · '_none' (担当未登録) — 管理者の「自分の担当」= 全員 */
  function visible(staff, who, me){
    if(who==='all') return true;
    if(who==='me') return !!(me&&(me.admin||(me.code&&staff===me.code)));
    if(who==='_none') return !staff;
    return staff===who;
  }
  function shortName(n){ return String(n||'').trim().split(/[\s　]+/)[0]||''; }

  /* ── B/L ファイル選び (B/L 調査補充 F6 · select.js nameKind) — 最新 DRAFT REV → DRAFT → FRT MEMO ── */
  function blKind(name, iv){
    if(!/\.pdf$/i.test(name)) return {k:'X', why:'PDF でない'};
    const n=String(name).replace(/\.pdf$/i,''), IV=up(iv), others=(n.match(NAME.IV)||[]).filter(x=>up(x)!==IV);
    if(others.length&&up(n).indexOf(IV)<0) return {k:'X', why:'他の Invoice 番号'};
    const r=n.replace(NAME.IV,' ').toUpperCase().replace(/[_.\s]+/g,' ').trim();
    if(/\(旧\)|旧/.test(r)) return {k:'X', why:'(旧) 古い版'};
    if(/DRAF?R?T\s*D[O0]C|DOC\s*DRAF?T/.test(r)) return {k:'X', why:'DRAFT DOC (当社の書類)'};
    const isMemo=/F[RE]?[ET]\.?\s*MEMO|FREIGHT\s*MEMO|FRTMEMO|フレートメモ/.test(r), isDraft=/D\s*R?A?F?R?T|DARFT|DRAF|ドラフト/.test(r)&&/DR/.test(r);
    const rv=r.match(/REV(?:ISED)?\s*\(?\s*(\d*)\s*\)?|\(\s*REV\s*\)/i), tail=r.match(/(?:\(|\s|-|DRAFT|MEMO)\s*(\d)\s*\)?$/), lg=/\bLG\b|L\/G/.test(r);
    const rev=rv?(rv[1]?+rv[1]:1):tail?+tail[1]:lg?1:0;
    if(isMemo) return {k:'M', rev, lg};
    if(isDraft) return {k:'D', rev, lg};
    return {k:'X', why:'名前の形が違う'};
  }
  function edition(k){ return k.k==='D'?(k.lg&&k.rev===1?'DRAFT LG':k.rev?'REV'+(k.rev>1?k.rev:''):'初版'):'FRT MEMO'+(k.rev?' REV'+(k.rev>1?k.rev:''):''); }
  function pickBl(files, iv){
    const c=(files||[]).filter(f=>!f.sub).map(f=>({f, k:blKind(f.name, iv)}));
    const D=c.filter(x=>x.k.k==='D').sort((a,b)=>(b.k.rev-a.k.rev)||String(b.f.name).localeCompare(a.f.name));
    const M=c.filter(x=>x.k.k==='M').sort((a,b)=>(b.k.rev-a.k.rev)||String(b.f.name).localeCompare(a.f.name));
    const p=D[0]||M[0]||null;
    return p?{file:p.f, name:p.f.name, kind:p.k.k, rev:p.k.rev, lg:p.k.lg, edition:edition(p.k), excluded:c.filter(x=>x.k.k==='X'&&/DRAFT|MEMO|旧/i.test(x.f.name)).map(x=>x.f.name+' ('+x.k.why+')')}:
      {file:null, excluded:c.filter(x=>x.k.k==='X'&&/DRAFT|MEMO|旧/i.test(x.f.name)).map(x=>x.f.name+' ('+x.k.why+')')};
  }
  /* ACL — {IV}_ACL.pdf · {IV}_ACL REV2.pdf … 同じ Invoice の最大 REV */
  function aclFiles(files, iv){
    const IV=up(iv);
    return (files||[]).filter(f=>!f.sub).map(f=>{ const m=String(f.name).trim().match(NAME.ACL); if(!m||up(m[1])!==IV) return null; const rev=m[0].match(/REV/i)?(m[2]?+m[2]:1):0; return {f, rev, version:rev?'REV'+(rev>1?rev:''):'初版'}; })
      .filter(Boolean).sort((a,b)=>(b.rev-a.rev)||String(b.f.lastModified||'').localeCompare(String(a.f.lastModified||'')));
  }
  const ACL_VERDICT = {'相違あり':'diff', '表記差のみ':'done', '完全一致':'done', '読取対象外':'todo', '読取確認要':'todo', 'COMPASS照会不可':'todo'};
  const baseName = p => String(p||'').split('/').pop();

  /* ── Invoice 行の判定 ──
     x = {iv, country, term, premium, etdPast, folder: undefined(読込中)|'missing'|{files:[{name,sub,lastModified}], error}, acl:{result, runId}|null, mailRules:[] } */
  function judgeIv(x){
    const out={}, F=x.folder&&typeof x.folder==='object'&&!x.folder.error?x.folder.files:null;

    const keys=Object.keys(body||{}), binds=keys.filter(k=>/@odata\.bind$/.test(k)), cols=keys.filter(k=>!/@odata\.bind$/.test(k));

    cols.forEach(c=>{ if(allowCols.indexOf(c)<0) no(set+'.'+c); });
    const bindId=(k,setName)=>{ const v=String(body[k]||''), m=v.match(/^\/([a-z0-9_]+)\(([0-9a-f\-]{36})\)$/i); if(!m||m[1]!==setName) no('連結 '+k+' = '+v); return m[2]; };
    const siOk=x=>ctx.siIds.has(x)||(ctx.created&&ctx.created.has(x));
    if(method==='PATCH'){
      if(binds.length) no('PATCH に連結');
      if(set==='cr49f_s_is'&&!siOk(id)) no('この契約の S/I でない '+id);
      if(set==='crcf9_s_i_details'&&!ctx.detailIds.has(id)) no('この契約の S/I 明細でない '+id);
      if(!cols.length) no('欄なし');
    } else {
      if(id) no('POST に ID');
      if(set==='cr49f_s_is'){ if(!(+body.crcf9_sino>=1&&+body.crcf9_sino<=4)) no('sino '+body.crcf9_sino);
        if(binds.length!==1||!body[ctx.nav.contract+'@odata.bind']) no('契約への連結がない'); if(bindId(ctx.nav.contract+'@odata.bind',ctx.sets.contract)!==ctx.contractId) no('別の契約'); }
      else { const need=[ctx.nav.si,ctx.nav.saleDetail,ctx.nav.item].map(n=>n+'@odata.bind'); binds.forEach(k=>{ if(need.indexOf(k)<0) no('連結 '+k); });
        if(!siOk(bindId(ctx.nav.si+'@odata.bind',ctx.sets.si))) no('この契約の S/I でない');
        if(!ctx.saleDetailIds.has(bindId(ctx.nav.saleDetail+'@odata.bind',ctx.sets.saleDetail))) no('この契約の販売明細でない');
        if(body[ctx.nav.item+'@odata.bind']&&!ctx.itemIds.has(bindId(ctx.nav.item+'@odata.bind',ctx.sets.item))) no('販売明細の品目でない'); }
    }
    return true;
  }
  /* 書いた後の確認 — 計画の値と読み直した値 */
  function siVerify(ops, now){
    const rows=[];
    ops.forEach(op=>{ const row=op.set==='cr49f_s_is'?(now.sis||[]).find(h=>h.cr49f_s_iid===op.id):(now.details||[]).find(d=>d.crcf9_s_i_detailid===op.id);
      (op.changes||[]).forEach(c=>{ const got=row?sv(row[c.col]):'(行なし)'; const want=c.col==='crcf9_weight'||c.col==='crcf9_price'?String(+c.after):c.after;
        rows.push({sino:op.sino, line:op.line||'', col:c.col, want, got, ok:row&&(c.col==='crcf9_weight'||c.col==='crcf9_price'?+got===+want:got===want)}); }); });
    return {ok:rows.every(r=>r.ok), rows};
  }
  /* 推薦 ↔ 最終 (担当者が直した欄 — 精度を上げる資料, 형님 2026-11-15) */
  function siEdits(rec, fin){ const out=[];
    Object.keys((fin&&fin.sinos)||{}).forEach(sn=>Object.keys(fin.sinos[sn]).forEach(c=>{ const r=sv(((rec&&rec.sinos)||{})[sn]&&rec.sinos[sn][c]); if(nv(r)!==nv(fin.sinos[sn][c])) out.push({sino:+sn, col:c, rec:r, final:sv(fin.sinos[sn][c])}); }));
    ((fin&&fin.details)||[]).forEach((d,i)=>Object.keys(d).forEach(c=>{ const r=sv(((rec&&rec.details)||[])[i]&&rec.details[i][c]); if(nv(r)!==nv(d[c])) out.push({sino:'明細'+(i+1), col:c, rec:r, final:sv(d[c])}); }));
    return out; }

  return {ST, STEPS, CT_STEPS, OUT_ROOT, SRC, NAME, NA, REQ_SI, ACL_VERDICT, up, isoDay, etdOf, addDays, fmtMD, ivCode, ctCode, docStaffMap, meOf, visible, shortName,
    blKind, pickBl, aclFiles, judgeIv, vesselChange, judgeCt, needs, sortIv, sortCt, inRange, defaultRange, queryKind, parseCsv, mailRulesByIv, guardOut, stamp, safeKey, logPath, baseName,
    utcStamp, aclResultPath, latestAcl, runStamp, aclGroups, mailDraft, mailtoUrl,
    SI_HEAD_COLS, SI_DET_COLS, SI_LABEL, nv, siFieldState, siPlan, isGuid, guardDv, siVerify, siEdits};
})();
if(typeof module!=='undefined') module.exports=DOC;
</script>

async function mapLimit(arr, n, fn){ let i=0; await Promise.all(Array.from({length:Math.min(n,arr.length)},async()=>{ while(i<arr.length){ const k=i++; await fn(arr[k],k); } })); }

/* ── COMPASS (読むだけ) ── */
async function dvGet(path, _r){
  _r=_r||0; const tok=await LEENAI.auth.token('dataverse');
  const res=await fetch(DV_API+'/'+path,{headers:{'Authorization':'Bearer '+tok,'OData-MaxVersion':'4.0','OData-Version':'4.0','Accept':'application/json','Prefer':'odata.maxpagesize=5000,odata.include-annotations="OData.Community.Display.V1.FormattedValue"'}});
  if(!res.ok){ if((res.status===429||res.status>=500)&&_r<2){ await sleep(1500*(_r+1)); return dvGet(path,_r+1); } const e=await res.json().catch(()=>({})); throw new Error('COMPASS '+res.status+': '+(e.error&&e.error.message||res.statusText)); }
  return res.json();
}
async function dvAll(path){ let d=await dvGet(path), out=(d.value||[]).slice(); while(d['@odata.nextLink']){ d=await dvGet(d['@odata.nextLink'].replace(DV_API+'/','')); out=out.concat(d.value||[]); } return out; }
async function dvIn(entity, key, ids, select, extra){ const out=[]; const u=[...new Set(ids.filter(Boolean))]; for(let i=0;i<u.length;i+=40){ out.push(...await dvAll(entity+'?$filter='+u.slice(i,i+40).map(x=>key+' eq '+x).join(' or ')+(extra||'')+'&$select='+select)); } return out; }
const BK_SEL='cr49f_bookingid,cr49f_invoice_no,cr49f_booking_no,cr49f_bl_number,cr49f_etd,crcf9_bl_etd,cr49f_main_ship_name,_cr49f_sale_contract_id_value,_cr49f_region_id_value,_cr49f_region_japan_id_value,_cr49f_carrier_id_value,crcf9_insurance_premiums,modifiedon';
const CT_SEL='cr49f_sale_contractid,cr49f_sale_contract_no,cr49f_pay_cls,cr49f_terms_conditions,_cr49f_buyer_id_value,cr49f_sale_contract_date,cr49f_latest_shipment';
const SI_SEL='cr49f_s_iid,_cr49f_sale_contract_id_value,crcf9_sino,cr49f_lc_no,crcf9_consignee,crcf9_notify_party,crcf9_po_vo,crcf9_vo_no,crcf9_place_of_delivery_1,crcf9_pod_bl1,modifiedon';

/* ── SharePoint (Graph · 読むだけ — 書き込みは spPut だけ) ── */
const spEnc = p => p.split('/').map(encodeURIComponent).join('/');
const drv = () => GRAPH+'drives/'+LEENAI.SP.DRIVE_ID;
async function graphFetch(url, opts, _r){
  _r=_r||0; const tok=await LEENAI.auth.token('graph');
  const res=await fetch(url,Object.assign({},opts||{},{headers:Object.assign({'Authorization':'Bearer '+tok},(opts&&opts.headers)||{})}));
  if(res.status===401&&_r===0) return graphFetch(url,opts,1);
  if((res.status===429||res.status>=500)&&_r<3){ const ra=parseInt((res.headers&&res.headers.get('Retry-After'))||'',10); await sleep(Number.isFinite(ra)?Math.min(ra*1000,30000):1000*Math.pow(2,_r)); return graphFetch(url,opts,_r+1); }
  return res;
}
async function graphJson(url){ const r=await graphFetch(url,{headers:{Accept:'application/json'}}); if(r.status===404) return null; if(!r.ok) throw new Error('Graph '+r.status); return r.json(); }
async function spChildren(path){ let url=drv()+'/root:/'+spEnc(path)+':/children?$select=id,name,folder,file,size,lastModifiedDateTime,webUrl&$top=999', out=[];
  while(url){ const j=await graphJson(url); if(!j) return null; out=out.concat(j.value||[]); url=j['@odata.nextLink']||null; } return out; }
async function spText(path){ const r=await graphFetch(drv()+'/root:/'+spEnc(path)+':/content'); if(r.status===404) return null; if(!r.ok) throw new Error('SP '+r.status); return r.text(); }
async function spPut(p, content, type){   // 新規のみ (上書きしない)
  DOC.guardOut(p);
  const r=await graphFetch(drv()+'/root:/'+spEnc(p)+':/content?@microsoft.graph.conflictBehavior=fail',{method:'PUT',headers:{'Content-Type':type||'application/json'},body:new Blob([content],{type:type||'application/json'})});
  if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error('SP PUT '+r.status+': '+(e.error&&e.error.message||'')); }
  return r.json();
}

/* ── 読み込み ── */
function prog(t){ $('dtProg').textContent=t||''; }
async function loadAll(){
  const seq=++S.loadSeq, t0=Date.now(); S.folders={}; S.bk=[]; S.ct={}; S.ctBk={}; S.sis={}; S.lcFiles=null; render();
  try{
    prog('マスター · COMPASS を読み込み中…');
    if(!S.staff.length){ const [st,ds]=await Promise.all([LEENAI.master.get('staff').catch(()=>[]), LEENAI.master.get('doc_staff').catch(()=>[])]);
      S.staff=st||[]; S.docStaff=DOC.docStaffMap(ds); S.me=DOC.meOf(LEENAI.user&&LEENAI.user.email, S.staff); renderMe(); renderWho(); }
    const f=S.range.from, t=S.range.to;
    const [bk, regs, pols]=await Promise.all([
      dvAll(`cr49f_bookings?$filter=(cr49f_etd ge ${f} and cr49f_etd le ${t}) or (crcf9_bl_etd ge ${f} and crcf9_bl_etd le ${t})&$select=${BK_SEL}`),
      Object.keys(S.regions).length?null:dvAll('cr49f_regions?$select=cr49f_regionid,cr49f_region,cr49f_pod'),
      Object.keys(S.pols).length?null:dvAll('crcf9_region_japans?$select=crcf9_region_japanid,crcf9_pol')]);
    if(seq!==S.loadSeq) return;
    if(regs) regs.forEach(r=>{ S.regions[r.cr49f_regionid]={country:DOC.up(r.cr49f_region), pod:r.cr49f_pod||''}; });
    if(pols) pols.forEach(r=>{ S.pols[r.crcf9_region_japanid]=r.crcf9_pol||''; });
    S.bk=bk.filter(b=>b.cr49f_invoice_no&&DOC.inRange(DOC.etdOf(b),f,t));
    const recent=await dvAll(`cr49f_sale_contracts?$filter=cr49f_sale_contract_date ge ${DOC.addDays(S.today,-60)}&$select=${CT_SEL}`);
    const cts=await dvIn('cr49f_sale_contracts','cr49f_sale_contractid',S.bk.map(b=>b._cr49f_sale_contract_id_value),CT_SEL);
    cts.concat(recent).forEach(c=>{ S.ct[c.cr49f_sale_contractid]=c; });
    const ids=Object.keys(S.ct);
    const [buyers, allBk, sis]=await Promise.all([
      dvIn('cr49f_buyers','cr49f_buyerid',Object.values(S.ct).map(c=>c._cr49f_buyer_id_value),'cr49f_buyerid,cr49f_buyer,cr49f_buyer_name,crcf9_country'),
      dvIn('cr49f_bookings','_cr49f_sale_contract_id_value',ids,'cr49f_bookingid,cr49f_invoice_no,cr49f_etd,crcf9_bl_etd,_cr49f_sale_contract_id_value'),
      dvIn('cr49f_s_is','_cr49f_sale_contract_id_value',ids,SI_SEL)]);
    if(seq!==S.loadSeq) return;
    buyers.forEach(b=>{ S.buyers[b.cr49f_buyerid]=b; });
    ids.forEach(id=>{ S.ctBk[id]=[]; S.sis[id]=[]; }); allBk.forEach(b=>{ (S.ctBk[b._cr49f_sale_contract_id_value]=S.ctBk[b._cr49f_sale_contract_id_value]||[]).push(b); });
    sis.forEach(s=>{ (S.sis[s._cr49f_sale_contract_id_value]=S.sis[s._cr49f_sale_contract_id_value]||[]).push(s); });
    render(); prog('SharePoint を読み込み中… (フォルダ · LC · ACL 照合結果)');
    await Promise.all([loadLcFiles(), loadRoots(), loadAclRun().then(loadAclLocal), loadMails()]);
    if(seq!==S.loadSeq) return;
    render();
    const list=S.bk.map(b=>DOC.up(b.cr49f_invoice_no)); let k=0;
    await mapLimit(list,4,async iv=>{ if(seq!==S.loadSeq) return; await loadFolder(iv); k++; if(k%8===0||k===list.length){ prog('読み込み中 '+k+' / '+list.length+' (Invoice フォルダ)'); render(); } });
    if(seq!==S.loadSeq) return;
    S.loadedMs=Date.now()-t0; prog('読み込み完了 — 船積 '+S.bk.length+' 件 · 契約 '+ids.length+' 件 · '+(S.loadedMs/1000).toFixed(0)+' 秒'+(S.acl?' · ACL 照合結果 '+S.acl.runId:''));
    render();
  }catch(e){ prog('読み込み失敗: '+e.message); toast('読み込み失敗: '+e.message,'danger'); }
}
async function loadLcFiles(){ try{ const k=await spChildren(DOC.SRC.lc); const m={}; (k||[]).filter(x=>x.file&&/\.json$/i.test(x.name)).forEach(x=>{ const c=DOC.up(x.name.split('_')[0]); (m[c]=m[c]||[]).push({name:x.name, webUrl:x.webUrl, lastModified:x.lastModifiedDateTime}); }); S.lcFiles=m; }catch(e){ S.lcFiles={}; S.lcErr=e.message; } }
async function loadRoots(){
  const y=+S.today.slice(0,4); S.wip={}; S.old={};
  const [w,o1,o2]=await Promise.all([spChildren(DOC.SRC.wip).catch(()=>null), spChildren(DOC.SRC.old+'/'+y).catch(()=>null), spChildren(DOC.SRC.old+'/'+(y-1)).catch(()=>null)]);
  (w||[]).filter(x=>x.folder).forEach(x=>{ S.wip[DOC.up(x.name)]={path:DOC.SRC.wip+'/'+x.name, webUrl:x.webUrl}; });
  [[o1,y],[o2,y-1]].forEach(([l,yy])=>(l||[]).filter(x=>x.folder).forEach(x=>{ const k=DOC.up(x.name); if(!S.old[k]) S.old[k]={path:DOC.SRC.old+'/'+yy+'/'+x.name, webUrl:x.webUrl}; }));
  S.rootErr=w?'':'書類作成中 を読めない';
}
async function loadFolder(iv, bk){
  const b=bk||S.bk.find(x=>DOC.up(x.cr49f_invoice_no)===iv), loc=S.wip[iv]||S.old[iv];
  if(!loc){ S.folders[iv]='missing'; return; }
  try{
    const k=await spChildren(loc.path); if(!k){ S.folders[iv]='missing'; return; }
    const files=k.filter(x=>x.file).map(x=>({name:x.name, lastModified:x.lastModifiedDateTime, webUrl:x.webUrl, id:x.id, size:x.size}));
    const subs=k.filter(x=>x.folder);
    /* 下のフォルダは必要なものだけ — 通関 (輸出許可がないとき) · RR (韓国向けで報告書がないとき) */
    const country=b?((S.regions[b._cr49f_region_id_value]||{}).country||''):'';
    const want=subs.filter(s=>(DOC.NAME.CUSTOMS_DIR.test(s.name)&&!files.some(f=>DOC.NAME.ED.test(f.name)))||(country==='KOREA'&&DOC.NAME.RR_DIR.test(s.name)&&!files.some(f=>DOC.NAME.RR.test(f.name))));
    for(const s of want){ const c=await spChildren(loc.path+'/'+s.name); (c||[]).filter(x=>x.file).forEach(x=>files.push({name:x.name, sub:s.name, lastModified:x.lastModifiedDateTime, webUrl:x.webUrl, id:x.id})); }
    S.folders[iv]={path:loc.path, webUrl:loc.webUrl, live:!!S.wip[iv], files, subs:subs.map(s=>s.name)};
  }catch(e){ S.folders[iv]={error:e.message}; }
}
/* ACL — 最も新しい 照合結果 (ACL_bench/ACL_yyyymmdd-hhmmss/results.json · 約 7 MB) */
async function loadAclRun(){
  try{ const k=await spChildren(DOC.SRC.acl); const runs=(k||[]).filter(x=>x.folder&&/^ACL_\d{8}-\d{6}$/.test(x.name)).map(x=>x.name).sort().reverse();
    for(const r of runs){ const t=await spText(DOC.SRC.acl+'/'+r+'/results.json'); if(!t) continue; const j=JSON.parse(t), by={};
      (j.results||[]).forEach(x=>{ by[DOC.up(x.invoice)]=x; }); S.acl={runId:r, finished:j.finished||'', version:j.version||'', by}; return; }
    S.acl=null; S.aclErr='照合結果なし';
  }catch(e){ S.acl=null; S.aclErr=e.message; }
}
/* メール一覧 CSV (mail_docstaff*.csv — ACL_bench/_input を優先 · 最新) → 件名規則 本船変更 */
async function loadMails(){
  try{ let url=drv()+"/root/search(q='mail_docstaff')?$select=id,name,size,lastModifiedDateTime,parentReference,file&$top=50", out=[];
    while(url){ const j=await graphJson(url); out=out.concat((j&&j.value)||[]); url=j&&j['@odata.nextLink']||null; }
    const cs=out.filter(x=>/^mail_docstaff.*\.csv$/i.test(x.name||''));
    const inInput=x=>String((x.parentReference&&x.parentReference.path)||'').indexOf('ACL_bench/_input')>=0?1:0;
    cs.sort((a,b)=>(inInput(b)-inInput(a))||String(b.lastModifiedDateTime||'').localeCompare(String(a.lastModifiedDateTime||'')));
    if(!cs[0]){ S.mails={}; S.mailFile=''; return; }
    const r=await graphFetch(drv()+'/items/'+cs[0].id+'/content'); if(!r.ok) throw new Error('CSV '+r.status);
    S.mails=DOC.mailRulesByIv(await r.text()); S.mailFile=cs[0].name;
  }catch(e){ S.mails={}; S.mailErr=e.message; }
}

/* ── 行データ ── */
function ivRow(b){
  const iv=DOC.up(b.cr49f_invoice_no), c=S.ct[b._cr49f_sale_contract_id_value]||{}, reg=S.regions[b._cr49f_region_id_value]||{}, etd=DOC.etdOf(b), code=DOC.ivCode(iv), staff=S.docStaff[code]||'';
  const x={iv, country:reg.country||'', term:DOC.up(c.cr49f_terms_conditions), premium:b.crcf9_insurance_premiums, etdPast:etd<S.today, folder:S.folders[iv], acl:(S.aclLocal&&S.aclLocal[iv])||(S.acl&&S.acl.by[iv]?{result:S.acl.by[iv], runId:S.acl.runId}:null), mailRules:S.mails[iv]||[]};
  const cells=DOC.judgeIv(x);
  return {b, iv, ct:c.cr49f_sale_contract_no||'', ctId:b._cr49f_sale_contract_id_value, etd, country:x.country, pod:reg.pod, term:x.term, code, staff, cells, vchg:DOC.vesselChange(x), x};
}
function ctRow(id){
  const c=S.ct[id]||{}, by=S.buyers[c._cr49f_buyer_id_value]||{}, no=c.cr49f_sale_contract_no||'', code=DOC.ctCode(no), staff=S.docStaff[code]||'', pay=DOC.up(FV(c,'cr49f_pay_cls')||c.cr49f_pay_cls);
  const bks=(S.ctBk[id]||[]).map(b=>({iv:b.cr49f_invoice_no, etd:DOC.etdOf(b)})).sort((a,b)=>a.etd.localeCompare(b.etd));
  const shipped=bks.filter(b=>b.etd&&b.etd<S.today).length, next=(bks.find(b=>b.etd>=S.today)||{}).etd||'';
  const cells=DOC.judgeCt({pay, lcFiles:S.lcFiles?(S.lcFiles[DOC.up(no)]||[]).map(f=>f.name):undefined, sis:S.sis[id]});
  return {id, ct:no, buyer:by.cr49f_buyer||FV(c,'_cr49f_buyer_id_value')||'', buyerName:by.cr49f_buyer_name||'', country:DOC.up(FV(by,'crcf9_country')||by.crcf9_country), pay, term:DOC.up(c.cr49f_terms_conditions), code, staff, cells, bks, shipped, next};

const ST_JA = {MATCH:'一致', NOTATION:'表記差', PRACTICE:'表記(実績)', DIFF:'相違', DROP:'脱落', ADD:'追加', READ_CHECK:'読取確認', INFO:'参考'};

/* ══════════ P2 — ACL タブ (acl_bench v0.4 のエンジンを共有) ══════════
   エンジン = CONTRACT_SEND/acl_bench.html の <script id="acl-core"> をコミット固定で読み込み、sha256 で確かめてから使う (コピーしない · acl_bench は変えない)。
   下の通信部分 (COMPASS 読み · 乙仲 · 規則 · PDF) は acl_bench の acl-app から写したもの — source: CONTRACT_SEND/acl_bench.html @243897d */
const ACL_ENGINE = {commit:'243897d18878ca38329001e029a60b0101f79d59', sha256:'d4226dfc3581d261301a1dd290df9f10cef8b8720f4d1d115e89bea4fbb91ff6', ver:'0.4'};
ACL_ENGINE.url='https://raw.githubusercontent.com/MHLEE205/CONTRACT_SEND/'+ACL_ENGINE.commit+'/acl_bench.html';
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';   // acl_bench · D-01 と同じ版
let ACLX = null;
async function sha256hex(buf){ const h=await crypto.subtle.digest('SHA-256',buf); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function loadAclEngine(){
  if(ACLX) return ACLX;
  const r=await fetch(ACL_ENGINE.url); if(!r.ok) throw new Error('エンジンを読めません ('+r.status+')');
  const buf=await r.arrayBuffer(), h=await sha256hex(buf);
  if(h!==ACL_ENGINE.sha256) throw new Error('エンジンのファイルが一致しません (sha256) — 使いません');
  const m=new TextDecoder('utf-8').decode(buf).match(/<script id="acl-core">([\s\S]*?)<\/script>/); if(!m) throw new Error('エンジンの部分が見つかりません');
  ACLX=new Function('module', m[1]+';return ACL;')(undefined); return ACLX;
}
/* COMPASS: Invoice → ブッキング → 港 · コンテナ · S/I · S/I 明細 (acl_bench fetchCompass と同じ質問) */

  if(!bk.length) return {ok:false, reason:'COMPASS に Invoice '+inv+' のブッキングなし'};
  const b=bk[0]; let pol='', pod='';
  if(b._cr49f_region_japan_id_value){ try{ pol=(await dvGet(`crcf9_region_japans(${b._cr49f_region_japan_id_value})?$select=crcf9_pol`)).crcf9_pol||''; }catch(e){} }
  if(b._cr49f_region_id_value){ try{ pod=(await dvGet(`cr49f_regions(${b._cr49f_region_id_value})?$select=cr49f_pod`)).cr49f_pod||''; }catch(e){} }
  const containers=await dvAll(`crcf9_container_informations?$filter=_crcf9_booking_id_value eq ${b.cr49f_bookingid}&$select=crcf9_container_informationid,crcf9_container_no,crcf9_seal_no,crcf9_type,crcf9_quantity,crcf9_n_w,crcf9_g_w,crcf9_t_w,_crcf9_sale_detail_id_value`);
  let sis=[]; const details={}; const cid=b._cr49f_sale_contract_id_value;
  if(cid){
    sis=await dvAll(`cr49f_s_is?$filter=_cr49f_sale_contract_id_value eq ${cid}&$select=cr49f_s_iid,crcf9_sino,cr49f_lc_no,crcf9_consignee,crcf9_notify_party,crcf9_address,crcf9_tel,crcf9_fax,crcf9_place_of_delivery_1,crcf9_place_of_delivery_2,crcf9_place_of_delivery_3,crcf9_pod_bl1,crcf9_pod_bl2,crcf9_pod_bl3,crcf9_bl_text1,crcf9_bl_text2,crcf9_shipper,crcf9_shipper_address,crcf9_shipper_tel,crcf9_shipper_fax,crcf9_shipping_mark,crcf9_local_agent_note,crcf9_payment_classification&$orderby=crcf9_sino asc`);
    for(const s of sis) details[s.cr49f_s_iid]=await dvAll(`crcf9_s_i_details?$filter=_crcf9_s_i_id_value eq ${s.cr49f_s_iid}&$select=crcf9_productname,_crcf9_sale_detail_id_value,crcf9_hs_code,modifiedon`);
  }
  const meta={carrier:FV(b,'_cr49f_carrier_id_value'), forwarder:FV(b,'_cr49f_fowarder_id_value'), contract:'', buyer:'', buyerCode:'', country:'', pay:''};
  if(cid){ try{ const sc=await dvGet(`cr49f_sale_contracts(${cid})?$select=cr49f_sale_contract_no,cr49f_pay_cls,_cr49f_buyer_id_value`); meta.contract=sc.cr49f_sale_contract_no||''; meta.pay=FV(sc,'cr49f_pay_cls')||sc.cr49f_pay_cls||'';
      if(sc._cr49f_buyer_id_value){ const by=await dvGet(`cr49f_buyers(${sc._cr49f_buyer_id_value})?$select=cr49f_buyer,cr49f_buyer_code,crcf9_country`); meta.buyer=by.cr49f_buyer||FV(sc,'_cr49f_buyer_id_value'); meta.buyerCode=by.cr49f_buyer_code||''; meta.country=FV(by,'crcf9_country')||by.crcf9_country||''; } }catch(e){ meta.error=String(e.message||e); } }
  const s1=ACLX.pickBlSi(sis); if(!meta.pay&&s1) meta.pay=FV(s1,'crcf9_payment_classification')||s1.crcf9_payment_classification||'';
  const fid=b._cr49f_fowarder_id_value; if(fid){ try{ const f=await aclForwarder(fid); meta.forwarderCompany=f.company; meta.forwarderPort=f.port; meta.forwarderTo=f.to; meta.forwarderCc=f.cc; }catch(e){ meta.forwarderError=String(e.message||e); } }

async function readPdf(file){
  const r=await graphFetch(drv()+'/items/'+file.id+'/content'); if(!r.ok) throw new Error('PDF 取得 '+r.status);

    for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i), vp=pg.getViewport({scale:1}), tc=await pg.getTextContent();
      pages.push({page:i, w:vp.width, items:tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({s:it.str, x:Math.round(it.transform[4]*10)/10, y:Math.round(it.transform[5]*10)/10, w:Math.round((it.width||0)*10)/10}))}); }

/* この Invoice 1 件だけ照合 — acl_bench runCompare の 1 件分と同じ手順 · 結果の形も同じ */
async function aclCompareOne(iv){
  const E=await loadAclEngine(), f=S.folders[iv];
  if(!f||!f.files) throw new Error('Invoice フォルダを読めていません');
  const items=f.files.filter(x=>!x.sub&&/\.pdf$/i.test(x.name)).map(x=>({id:x.id, name:x.name, size:x.size, lastModifiedDateTime:x.lastModified, path:'/drives/'+LEENAI.SP.DRIVE_ID+'/root:/'+f.path}));
  const t=E.groupTargets(items).targets.find(x=>DOC.up(x.invoice)===iv);
  if(!t) throw new Error('{Invoice}_ACL.pdf がありません');
  const r={invoice:t.invoice, file:t.file.path+'/'+t.file.name, fileModified:t.file.lastModifiedDateTime||'', aclVersion:t.aclVersion||'', others:(t.others||[]).map(o=>o.path+'/'+o.name), format:'', verdict:'', items:[], kinds:{}, xx:[]};
  const pages=await readPdf(t.file), fm=E.classifyFormat(pages); r.format=fm.format;

  const cp=await aclFetchCompass(t.invoice);
  if(!cp.ok){ r.verdict='COMPASS照会不可'; r.why=cp.reason; r.kinds={'COMPASS照会不可':1}; return r; }
  const rules=await aclRules(), acl=E.readNaccs(pages), c=E.compareOne(acl,cp,{rules:rules.rules, meta:cp.meta, podExclude:rules.podExclude||[], fileModified:r.fileModified});
  r.cp={booking_no:cp.booking.cr49f_booking_no||'', bl_number:cp.booking.cr49f_bl_number||''}; r.meta=cp.meta;
  Object.assign(r,c,{sino:c.expected.sino, bookings:cp.bookings}); delete r.expected; r.read={fields:acl.fields, rows:acl.rows, totals:acl.totals};
  if(cp.bookings>1) r.items.push({group:'ブッキング',key:'multi',label:'同じ Invoice のブッキング',status:'INFO',expected:'',actual:cp.bookings+' 件',detail:'最初の 1 件で照合',kind:''});
  r.rules={loaded:rules.loaded, acl_rules:rules.rules.length, warnings:rules.warnings};

  document.querySelectorAll('#dtCtBody [data-col]').forEach(el=>{ el.addEventListener('input',()=>{ const E=S.siEdit[id]=S.siEdit[id]||{sinos:{},details:[]}, sn=el.dataset.sn, cn=el.dataset.col;
    if(/^明細/.test(sn)){ const i=+sn.replace('明細','')-1; (E.details[i]=E.details[i]||{})[cn]=el.value; } else (E.sinos[sn]=E.sinos[sn]||{})[cn]=el.value; siPills(id); }); });
}
async function siRun(id){
  if(S.siBusy[id]) return; if(!lsGet(LS.apikey,'')){ toast('API キーを ⚙ 設定で保存してください','warn'); return; }
  const say=m=>{ S.siBusy[id]=m; const st=$('dtSiSt'); if(st&&S.cur&&S.cur.id===id) st.textContent=m; };
  say('準備中…'); const b=$('dtSiRun'); if(b) b.disabled=true;
  try{ const res=await siRecommend(id,say); S.siRec[id]=res; S.siEdit[id]={sinos:{},details:[]}; S.siBusy[id]='';
    try{ await spPut(DOC.OUT_ROOT+'si_rec/'+DOC.safeKey(res.no)+'_'+DOC.utcStamp()+'.json', JSON.stringify(res)); }catch(e){ toast('推薦の保存に失敗 (画面にはあります): '+e.message,'warn'); }
    if(S.cur&&S.cur.id===id) renderCt(); toast('S/I 推薦ができました (US$ '+(+res.cost||0).toFixed(2)+')','ok');
  }catch(e){ S.siBusy[id]=''; if(S.cur&&S.cur.id===id){ renderCt(); const st=$('dtSiSt'); if(st) st.innerHTML='<span style="color:#7A2416">推薦できません: '+esc(e.message)+'</span> — a1_bench で確認してください'; } }
}
/* ── COMPASS 書き込み ── */
async function dvWrite(method, set, id, body, ctx){   // COMPASS に書くのはここだけ (門番 → fetch)
  DOC.guardDv(method, set, id, body, ctx);
  const tok=await LEENAI.auth.token('dataverse'), hd={'Authorization':'Bearer '+tok,'OData-MaxVersion':'4.0','OData-Version':'4.0','Accept':'application/json','Content-Type':'application/json; charset=utf-8'};
  if(method==='PATCH') hd['If-Match']='*'; else hd.Prefer='return=representation';   // PATCH は行が無ければ作らずに失敗
  const res=await fetch(DV_API+'/'+set+(method==='PATCH'?'('+id+')':''),{method, headers:hd, body:JSON.stringify(body)});
  let msg='', nid=method==='PATCH'?id:null;
  if(res.ok&&method==='POST'){ const rep=await res.json().catch(()=>null); nid=rep&&rep[set==='cr49f_s_is'?'cr49f_s_iid':'crcf9_s_i_detailid']||null;
    if(!nid){ const loc=(res.headers&&res.headers.get('OData-EntityId'))||''; nid=(loc.match(/\(([0-9a-f-]{36})\)\s*$/i)||[])[1]||null; } }
  else if(!res.ok){ const e=await res.json().catch(()=>({})); msg=(e.error&&e.error.message)||res.statusText||''; }
  return {ok:res.ok&&DOC.isGuid(nid), status:res.status, message:msg, id:DOC.isGuid(nid)?nid:null};
}
async function siMeta(){   // エンティティセット · 連結の名前は実行時にメタデータから (推測しない — compass_write_test と同じ)
  if(S.siMeta) return S.siMeta;
  const L={si:'cr49f_s_i', detail:'crcf9_s_i_detail', contract:'cr49f_sale_contract', saleDetail:'cr49f_sale_detail', item:'cr49f_item'}, sets={}, nav={}, problems=[];
  for(const k of Object.keys(L)) sets[k]=(await dvGet("EntityDefinitions(LogicalName='"+L[k]+"')?$select=EntitySetName")).EntitySetName;
  const m2o={}; for(const ent of ['cr49f_s_i','crcf9_s_i_detail']) m2o[ent]=(await dvGet("EntityDefinitions(LogicalName='"+ent+"')/ManyToOneRelationships?$select=ReferencingAttribute,ReferencedEntity,ReferencingEntityNavigationPropertyName")).value||[];
  [['contract','cr49f_s_i','cr49f_sale_contract_id','cr49f_sale_contract'],['si','crcf9_s_i_detail','crcf9_s_i_id','cr49f_s_i'],['saleDetail','crcf9_s_i_detail','crcf9_sale_detail_id','cr49f_sale_detail'],['item','crcf9_s_i_detail','crcf9_item_id','cr49f_item']].forEach(([k,ent,att,ref])=>{
    const r=(m2o[ent]||[]).filter(x=>x.ReferencingAttribute===att&&x.ReferencedEntity===ref); if(r.length===1&&r[0].ReferencingEntityNavigationPropertyName) nav[k]=r[0].ReferencingEntityNavigationPropertyName; else problems.push(ent+'.'+att+' の連結 '+r.length+' 個'); });
  if(sets.si!=='cr49f_s_is'||sets.detail!=='crcf9_s_i_details') problems.push('S/I のセット名が違う');
  if(problems.length) throw new Error('メタデータ — 書かない: '+problems.join(' / '));
  S.siMeta={sets, nav}; return S.siMeta;
}
async function siReadNow(id, head){
  const sel=head.concat(['cr49f_s_iid','crcf9_sino','modifiedon']).join(',');
  const sis=await dvAll(`cr49f_s_is?$filter=_cr49f_sale_contract_id_value eq ${id}&$select=${sel}&$orderby=crcf9_sino asc`), details=[];
  for(const h of sis){ h._details=await dvAll(`crcf9_s_i_details?$filter=_crcf9_s_i_id_value eq ${h.cr49f_s_iid}&$select=crcf9_s_i_detailid,crcf9_productname,crcf9_hs_code,crcf9_weight,crcf9_price,_crcf9_sale_detail_id_value,_crcf9_item_id_value,_crcf9_s_i_id_value`); details.push(...h._details); }
  return {sis, details};
}
const opLine = op => (op.method==='POST'?'新規 ':'変更 ')+(op.set==='cr49f_s_is'?'S/I sino '+op.sino:'明細 '+op.line+' (sino '+op.sino+')');
async function siWrite(id){
  const res=S.siRec[id]; if(!res) return; const no=res.no, st=$('dtSiSt');
  try{
    if(st) st.textContent='COMPASS の今の S/I を読み直しています…';
    const fin=siFinal(id), cur=await siReadNow(id,res.fieldHead), ops=DOC.siPlan(cur,fin,res.sale);
    if(!ops.length){ if(st) st.textContent='COMPASS と同じです — 書き込むものはありません'; return; }
    const meta=await siMeta(), n=ops.reduce((a,o)=>a+o.changes.length,0);
    if(st) st.textContent='';
    modal('<div class="dt-h">COMPASS に書き込む — '+esc(no)+'</div><div class="dt-note">書く前に今の S/I を SharePoint に控えます。消す操作はありません。</div>'+
      ops.map(op=>'<div style="font-weight:500;font-size:14px;margin-top:6px">'+esc(opLine(op))+'</div><div class="dt-kv">'+op.changes.map(cg=>'<div>'+esc(DOC.SI_LABEL[cg.col]||cg.col)+'</div><div><span style="color:#7A2416;text-decoration:line-through">'+esc(cg.before||'(空欄)')+'</span> → '+(cg.after===''&&cg.before!==''?'<b style="color:#7A2416">(空欄にします — 今の値が消えます)</b>':'<b>'+esc(cg.after||'(空欄)')+'</b>')+'</div>').join('')+'</div>').join('')+
      '<label class="dt-row" style="font-size:13px"><input type="checkbox" id="dtSiOk"> '+ops.length+' 件 · '+n+' 欄の内容を確認しました</label><div class="dt-actions"><button class="dt-btn ghost" data-close="1">やめる</button><button class="dt-btn" id="dtSiGo" disabled>書き込む</button></div>');
    $('dtSiOk').onchange=()=>{ $('dtSiGo').disabled=!$('dtSiOk').checked; };
    $('dtSiGo').onclick=()=>{ closeModal(); siExecute(id, ops, cur, fin, meta); };
  }catch(e){ if(st) st.innerHTML='<span style="color:#7A2416">書き込めません: '+esc(e.message)+'</span>'; }
}
async function siExecute(id, ops, cur, fin, meta){
  const res=S.siRec[id], no=res.no, here=()=>!!(S.cur&&S.cur.type==='ct'&&S.cur.id===id), rc=()=>{ if(here()) renderCt(); }, st=()=>here()?$('dtSiSt'):null, say=m=>{ const e=st(); if(e) e.textContent=m; }, d=new Date(), at=d.toISOString();
  S.siBusy[id]='書き込み中…'; rc();
  const log={kind:'S/I 書き込み', contract:no, contract_id:id, at, user:(LEENAI.user&&LEENAI.user.email)||'', engine:res.engine, rec_at:res.at, cost:res.cost, edits:DOC.siEdits(res.rec,fin), ops:[], verify:null, backup:''};
  try{
    say('COMPASS が確認画面のあとに変わっていないか確かめています…');   // 確認画面を開いている間に COMPASS で直された → 書かない
    const again=await siReadNow(id,res.fieldHead), stamp=x=>JSON.stringify(x.sis.map(h=>[h.cr49f_s_iid,h.modifiedon]).concat(x.details.map(q=>[q.crcf9_s_i_detailid,q._crcf9_sale_detail_id_value])));
    if(stamp(again)!==stamp(cur)) throw new Error('確認画面のあとに COMPASS の S/I が変わりました — もう一度「COMPASS に書き込む」から');
    say('控えを保存しています…');
    const bp=DOC.OUT_ROOT+'si_backup/'+DOC.safeKey(no)+'_'+DOC.utcStamp(d)+'.json';
    await spPut(bp, JSON.stringify({contract:no, contract_id:id, at, user:log.user, current:cur, plan:ops}));   // 控えに失敗したら書かない
    log.backup=bp;
    const ctx={contractId:id, siIds:new Set(cur.sis.map(h=>h.cr49f_s_iid)), detailIds:new Set(cur.details.map(x=>x.crcf9_s_i_detailid)), created:new Set(),
      saleDetailIds:new Set(res.sale.map(s=>s.cr49f_sale_detailid)), itemIds:new Set(res.sale.map(s=>s._cr49f_item_id_value).filter(Boolean)), sets:meta.sets, nav:meta.nav};
    const newSi={}, bind=(set,x)=>'/'+set+'('+x+')'; let k=0, failed=null;
    for(const op of ops){
      say('書き込み '+(++k)+' / '+ops.length+' — '+opLine(op));
      const body=Object.assign({},op.body);
      if(op.method==='POST'&&op.set==='cr49f_s_is') body[meta.nav.contract+'@odata.bind']=bind(meta.sets.contract,id);
      if(op.method==='POST'&&op.set==='crcf9_s_i_details'){ const sid=/^new:/.test(op.siRef)?newSi[op.siRef]:op.siRef; if(!sid){ failed={op, message:'S/I が作れていない'}; break; }
        body[meta.nav.si+'@odata.bind']=bind(meta.sets.si,sid); body[meta.nav.saleDetail+'@odata.bind']=bind(meta.sets.saleDetail,op.saleDetail); if(op.item) body[meta.nav.item+'@odata.bind']=bind(meta.sets.item,op.item); }
      const r=await dvWrite(op.method, op.set, op.method==='PATCH'?op.id:null, body, ctx);
      log.ops.push({what:opLine(op), method:op.method, set:op.set, id:r.id||op.id||null, status:r.status, ok:r.ok, message:r.message, changes:op.changes});
      if(!r.ok){ failed={op, message:r.status+' '+r.message}; break; }
      if(op.method==='POST'){ op.id=r.id; if(op.set==='cr49f_s_is'){ newSi[op.ref]=r.id; ctx.created.add(r.id); } else ctx.detailIds.add(r.id); }
    }
    say('読み直して確かめています…');
    const now=await siReadNow(id,res.fieldHead), ver=DOC.siVerify(ops.filter(o=>o.id), now); log.verify=ver; log.failed=failed?{what:opLine(failed.op), message:failed.message}:null;
    S.sis[id]=now.sis; res.current=now.sis; S.siEdit[id]={sinos:{},details:[]};
    try{ await spPut(DOC.logPath(no,'si',d), JSON.stringify(log)); }catch(e){ toast('履歴の保存に失敗: '+e.message,'warn'); }
    S.siBusy[id]=''; rc();
    const e=st(); if(e) e.innerHTML=failed?'<span style="color:#7A2416">途中で止めました ('+esc(log.failed.what)+': '+esc(failed.message)+') — 書いた分は確認表どおり · 控え '+esc(log.backup)+'</span>'
      :(ver.ok?'<span style="color:#1F4A36">書き込みました ('+ops.length+' 件) · 読み直して一致 ✓ · 控え '+esc(log.backup)+'</span>':'<span style="color:#7A2416">書き込みましたが読み直すと '+ver.rows.filter(x=>!x.ok).length+' 欄が違います — COMPASS 画面で確認してください · 控え '+esc(log.backup)+'</span>');
    toast(failed?'途中で止めました':ver.ok?'COMPASS に書き込みました':'書き込み後の確認で違いあり', failed||!ver.ok?'warn':'ok');
  }catch(e){ S.siBusy[id]=''; rc(); const el=st(); if(el) el.innerHTML='<span style="color:#7A2416">書き込めません: '+esc(e.message)+(log.backup?' · 控え '+esc(log.backup):' (何も書いていません)')+'</span>';
    try{ log.error=e.message; if(log.backup) await spPut(DOC.logPath(no,'si',d), JSON.stringify(log)); }catch(x){} }
}

  $('dtMain').style.display='';
  const d=new Date(), p=n=>String(n).padStart(2,'0'); S.today=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
  let rg={before:30,after:45}; try{ rg=Object.assign(rg,JSON.parse(lsGet(LS.range,'{}'))); }catch(e){}
  S.range=DOC.defaultRange(S.today,+rg.before,+rg.after); $('dtFrom').value=S.range.from; $('dtTo').value=S.range.to;
  S.who=lsGet(LS.who,'me'); S.board=lsGet(LS.board,'iv')==='ct'?'ct':'iv';
  $('dtBIv').onclick=()=>{ S.board='iv'; lsSet(LS.board,'iv'); render(); }; $('dtBCt').onclick=()=>{ S.board='ct'; lsSet(LS.board,'ct'); render(); };

  $('dtReload').onclick=()=>{ const f=$('dtFrom').value, t=$('dtTo').value; if(!f||!t||f>t){ prog('ETD の範囲が正しくありません'); return; } S.range={from:f,to:t}; loadAll(); };
  $('dtGo').onclick=runSearch; $('dtQ').addEventListener('keydown',e=>{ if(e.key==='Enter') runSearch(); });

  $('dtModal').addEventListener('click',e=>{ if(e.target===$('dtModal')) closeModal(); });
  renderMe(); renderWho(); loadAll();
}
