<style>
/* 色 = LEENAI 共通テーマ (4 モード: ダーク · ライト · LEENAI · FOCUS) の変数 + この TOOL の状態 5 色 (モードごと) — v0.2 형님 D4 「모드 4개」
   背景 --bg · 面 --surface · 文字 --text/--text2/--text3 · 線 --border · ボタン --accent-btn · リンク --accent (共通ファイル)。
   この TOOL の色は下の 2 つの表 (明るい 3 モード · ダーク) だけ — 直すときは表だけ (tests/theme.js が 4 モードの読みやすさを計算)
   v0.6 (형님 D1): 待ち = 赤い太字 (背景はごく薄く) — 目立つ順 相違 (赤い背景) > 待ち (赤い字) > 確認 (黄) */
html{--dt-on-accent:#FFFFFF;
  --st-done-bg:#E6F2EA;--st-done-fg:#1F4A36;--st-todo-bg:#FBEFD9;--st-todo-fg:#6B4508;--st-diff-bg:#FBE3DE;--st-diff-fg:#7A2416;
  --st-wait-bg:#FFF7F5;--st-wait-fg:#B3261E;--st-unk-bg:#E4E5E2;--st-unk-fg:#454D48;--st-na-fg:#4F5751;--dt-dot-wait:#C62828;--dt-dot-unk:#6F7871;--td-late-bg:#7A2416;--td-late-fg:#FFFFFF;--td-chase-bg:#E6EEF8;--td-chase-fg:#24405E;--dt-hl:#FFF6E0;--dt-now:#E3F0E8;
  --rs-ok:#1E6B3A;--rs-note:#6E5A00;--rs-ng:#A3200F;--rs-read:#9A4300;--rs-na:#5F6763;--rs-note-bar:#C9A800;--rs-read-bar:#E07A1F;--dv-hl:rgba(255,214,0,.30);--dv-hl-line:#E0A800}   /* v0.22 (V5): 一致 緑 · 表記差 黄 · 相違 赤 (太字) · 読めず 橙 · 対象外 灰 */
html:not([data-theme]),html[data-theme="dark"]{--dt-on-accent:#FFFFFF;
  --st-done-bg:#143A27;--st-done-fg:#8EE8AE;--st-todo-bg:#3D2C0C;--st-todo-fg:#F7CF6B;--st-diff-bg:#441A1A;--st-diff-fg:#FDA4A4;
  --st-wait-bg:#1E1A24;--st-wait-fg:#FF8A80;--st-unk-bg:#2C3148;--st-unk-fg:#C2CAD8;--st-na-fg:#9AA3B5;--dt-dot-wait:#FF6F61;--dt-dot-unk:#8F98AB;--td-late-bg:#C8402F;--td-late-fg:#FFFFFF;--td-chase-bg:#1E2A3B;--td-chase-fg:#A9C7EE;--dt-hl:#2B2512;--dt-now:#1D3328;
  --rs-ok:#8EE8AE;--rs-note:#F5DC5A;--rs-ng:#FF9C8F;--rs-read:#FFB26B;--rs-na:#A3ACBD;--rs-note-bar:#E8C930;--rs-read-bar:#FF9A3D;--dv-hl:rgba(255,214,0,.28);--dv-hl-line:#FFD600}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',system-ui,'Segoe UI',sans-serif}
.ln-hdr-right button[title="マスター設定"]{display:none!important}
.dt-main{max-width:1240px;margin:0 auto;padding:20px 24px 48px;display:flex;flex-direction:column;gap:16px}

.dt-search{padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.dt-btn{height:44px;padding:0 22px;border:none;border-radius:8px;background:var(--accent-btn);color:var(--dt-on-accent);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}

.dt-note{font-size:12px;color:var(--text3)}
.dt-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dt-between{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

.dt-tablewrap{overflow-x:auto}
/* v0.16.1 Invoice 別 (PORTAL と同じ表) — 窓の幅いっぱい · 1 行 · 横スクロールなし · 列名の行は固定 */
.dt-main.pt-full{max-width:none;padding-left:16px;padding-right:16px}

.dt-t.pt-t thead th{position:sticky;top:var(--pt-top,46px);z-index:3;background:var(--surface2)}

.pt-wide.f-eta .c-eta,.pt-wide.f-cntr .c-cntr,.pt-wide.f-bkg .c-bkg{display:none}

.dt-t thead tr{background:var(--surface2);color:var(--text2);font-size:12px;text-align:left}
.dt-t th{padding:10px 14px;font-weight:500;white-space:nowrap}
.dt-t th.c{padding:10px 8px;text-align:center}
.dt-t td{padding:10px 14px;color:var(--text2);white-space:nowrap}
.dt-t td.c{padding:8px;text-align:center}
.dt-t td.e{font-weight:500;color:var(--text)}
.dt-t tbody tr{border-top:1px solid var(--surface3)}
.dt-t tr.hl{background:var(--dt-hl)}
.dt-t tr.g2{background:var(--surface2)}.dt-t tr.cont td{border-top:0}.dt-t td.n{text-align:right;font-variant-numeric:tabular-nums}
.dt-link{border:none;background:transparent;padding:6px 4px;font-family:inherit;font-size:14px;color:var(--accent);text-decoration:underline;cursor:pointer}
.dt-tag{margin-left:6px;font-size:11px;padding:1px 6px;border-radius:999px;background:var(--st-diff-bg);color:var(--st-diff-fg)}
.st{display:inline-block;min-width:40px;padding:2px 8px;border-radius:999px;font-size:12px;cursor:default;border:1px solid transparent}
button.st{font-family:inherit;cursor:pointer;line-height:inherit}
button.st:hover{border-color:currentColor}
.st-done{background:var(--st-done-bg);color:var(--st-done-fg)}.st-todo{background:var(--st-todo-bg);color:var(--st-todo-fg)}.st-diff{background:var(--st-diff-bg);color:var(--st-diff-fg)}
.st-wait{background:var(--st-wait-bg);color:var(--st-wait-fg);font-weight:700}.st-na{background:transparent;color:var(--st-na-fg)}.st-unk{background:var(--st-unk-bg);color:var(--st-unk-fg);border-color:var(--st-unk-fg)}.st-load{background:transparent;color:var(--st-na-fg)}
.dt-c-diff{color:var(--st-diff-fg)}.dt-c-todo{color:var(--st-todo-fg)}.dt-c-done{color:var(--st-done-fg)}.dt-c-na{color:var(--st-na-fg)}
.dt-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2)}
.dt-back{border:none;background:transparent;padding:6px 0;font-family:inherit;font-size:14px;color:var(--accent);cursor:pointer}
.dt-sum{padding:14px 18px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 16px}
.dt-sum .k{font-size:12px;color:var(--text3)}.dt-sum .v{font-weight:500;word-break:break-word}
.dt-sum a,.dt-a{font-size:13px;color:var(--accent);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-family:inherit}
.dt-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.dt-tabs button{height:44px;padding:0 16px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:14px;margin-bottom:-1px;color:var(--text3);border-bottom:2px solid transparent;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:6px}
.dt-tabs button.on{color:var(--text);font-weight:500;border-bottom:2px solid var(--accent-btn)}
.dt-tabs button.now{background:var(--dt-now);color:var(--text)}
.dt-tabs .now-tag{font-size:10px;font-weight:500;color:var(--st-done-fg);letter-spacing:.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid transparent}
.dot.st-done{background:var(--st-done-fg)}.dot.st-todo{background:var(--st-todo-fg)}.dot.st-diff{background:var(--st-diff-fg)}.dot.st-wait{background:var(--dt-dot-wait)}.dot.st-unk{background:transparent;border-color:var(--dt-dot-unk)}.dot.st-load,.dot.st-na{display:none}
/* v0.17 (F1): 未 = まだ時期でない自分の段階 (灰) · 待ち = 相手の番だけ */
.st-not{background:transparent;color:var(--st-na-fg);border-color:var(--st-na-fg)}.dot.st-not{background:transparent;border-color:var(--st-na-fg)}
/* v0.17 (H2): 保存の印 (欄の横 · 1.5 秒) */
.pt-t .pt-ok{color:var(--st-done-fg);font-size:11px;font-weight:700;margin-left:4px;white-space:nowrap}.pt-t .pt-ng{color:var(--st-diff-fg);font-size:11px;font-weight:700;margin-left:4px;white-space:nowrap}

.dt-panel{padding:24px;display:flex;flex-direction:column;gap:10px}
.dt-h{font-size:18px;font-weight:500}
.dt-p{font-size:14px;color:var(--text2)}
.dt-pills{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;align-items:center}
.dt-pills span.p{padding:4px 12px;border-radius:999px}
.dt-files{font-size:13px;color:var(--text2);font-family:'Consolas','Menlo',monospace;word-break:break-all}
.dt-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-size:14px}
.dt-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dt-prog{font-size:13px;color:var(--text3);min-height:18px}
.dt-empty{padding:24px;text-align:center;color:var(--text3);font-size:13px}
.dt-badge{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--st-todo-bg);color:var(--st-todo-fg);font-weight:500}
.dt-me{font-size:13px;color:var(--text2)}
.dt-hr{border:0;border-top:1px solid var(--surface3);margin:4px 0}
.dt-in{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;font-family:inherit;padding:0 10px}
.dt-in.warn{border-color:var(--st-todo-fg)}.dt-in.dash{border-style:dashed}
.dt-empty-v{color:var(--st-na-fg)}
.dt-xx{background:var(--st-todo-bg);color:var(--st-todo-fg);padding:0 4px;border-radius:4px}
.dt-modal{position:fixed;inset:0;background:rgba(15,17,23,.45);display:flex;align-items:center;justify-content:center;z-index:400;padding:16px}
.dt-modal[hidden]{display:none}
.cp-list{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto}
.cp-row{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:13.5px;cursor:pointer}
.cp-row:hover{background:var(--surface2)}
.cp-id{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--text2);white-space:nowrap}
.cp-t{flex:1;min-width:0}.cp-k{font-size:12px;color:var(--text2);white-space:nowrap}
.cp-st{font-size:11.5px;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--st-todo-bg);color:var(--st-todo-fg)}
.cp-st-on{background:var(--st-done-bg,var(--surface2));color:var(--st-done-fg,var(--ok))}.cp-st-off{background:var(--surface2);color:var(--text3)}
.cp-kv{border-collapse:collapse;width:100%;font-size:13.5px}.cp-kv th{width:7.5em;text-align:left;vertical-align:top;color:var(--text2);font-weight:500;padding:6px 8px 6px 0}.cp-kv td{padding:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cp-new{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-left:4px solid var(--accent-btn)}
.cp-rep{border:none;cursor:pointer;font-family:inherit;background:var(--st-diff-bg,var(--st-todo-bg));color:var(--st-diff-fg,var(--st-todo-fg))}
.cp-rep-row{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid var(--border);border-radius:8px}
.av-cp{font:inherit;font-size:10.5px;font-weight:600;line-height:1.4;padding:0 5px;margin-left:6px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text2);cursor:pointer;vertical-align:1px}
.dt-modal .box{background:var(--surface);color:var(--text);border-radius:12px;border:1px solid var(--border);max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.dt-modal input[type=password],.dt-modal input[type=number]{height:36px;border:1px solid var(--border);border-radius:8px;padding:0 10px;font-family:inherit;font-size:14px}
.dt-kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;font-size:13px}
.dt-kv div:nth-child(odd){color:var(--text3)}
.dt-kv div:nth-child(even){white-space:pre-wrap;word-break:break-word}
/* v0.10 LC 読み取り (保管所の MD) */
.dt-md{max-height:70vh;overflow:auto;font-size:13px;line-height:1.5}
.dt-md-h1{font-size:15px;font-weight:600;margin:4px 0 6px}
.dt-md-h2{font-size:14px;font-weight:600;margin:12px 0 4px}

.av{display:flex;flex-direction:column;gap:10px}
.av-concl{font-size:16px;font-weight:500;padding:10px 14px;border-radius:10px;background:var(--surface2)}
.av-ok{color:var(--rs-ok)}.av-ng{color:var(--rs-ng);font-weight:700}.av-note{color:var(--rs-note)}.av-read{color:var(--rs-read)}.av-na{color:var(--rs-na)}   /* v0.22 (V5) */
.av-list td.av-m{border-left:4px solid transparent}.av-list td.av-m.av-ok{border-left-color:var(--rs-ok)}.av-list td.av-m.av-note{border-left-color:var(--rs-note-bar)}.av-list td.av-m.av-ng{border-left-color:var(--rs-ng)}.av-list td.av-m.av-read{border-left-color:var(--rs-read-bar)}.av-list td.av-m.av-na{border-left-color:var(--rs-na)}

.dv-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}.dv-left,.dv-right{min-width:0}.dv-right .dt-panel{min-width:0;overflow-wrap:anywhere}

    const keys=Object.keys(body||{}), binds=keys.filter(k=>/@odata\.bind$/.test(k)), cols=keys.filter(k=>!/@odata\.bind$/.test(k));
    const allowCols=set==='cr49f_s_is'?SI_HEAD_COLS.concat(method==='POST'?['crcf9_sino']:[]):SI_DET_COLS;
    cols.forEach(c=>{ if(allowCols.indexOf(c)<0) no(set+'.'+c); });

    const siOk=x=>ctx.siIds.has(x)||(ctx.created&&ctx.created.has(x));
    if(method==='PATCH'){
      if(binds.length) no('PATCH に連結');

      if(set==='cr49f_s_is'){ if(!(+body.crcf9_sino>=1&&+body.crcf9_sino<=4)) no('sino '+body.crcf9_sino);
        if(binds.length!==1||!body[ctx.nav.contract+'@odata.bind']) no('契約への連結がない'); if(bindId(ctx.nav.contract+'@odata.bind',ctx.sets.contract)!==ctx.contractId) no('別の契約'); }
      else { const need=[ctx.nav.si,ctx.nav.saleDetail,ctx.nav.item].map(n=>n+'@odata.bind'); binds.forEach(k=>{ if(need.indexOf(k)<0) no('連結 '+k); });
        if(!siOk(bindId(ctx.nav.si+'@odata.bind',ctx.sets.si))) no('この契約の S/I でない');
        if(!ctx.saleDetailIds.has(bindId(ctx.nav.saleDetail+'@odata.bind',ctx.sets.saleDetail))) no('この契約の販売明細でない');
        if(body[ctx.nav.item+'@odata.bind']&&!ctx.itemIds.has(bindId(ctx.nav.item+'@odata.bind',ctx.sets.item))) no('販売明細の品目でない'); }

      (op.changes||[]).forEach(c=>{ const got=row?sv(row[c.col]):'(行なし)'; const want=c.col==='crcf9_weight'||c.col==='crcf9_price'?String(+c.after):c.after;

  function siEdits(rec, fin){ const out=[];
    Object.keys((fin&&fin.sinos)||{}).forEach(sn=>Object.keys(fin.sinos[sn]).forEach(c=>{ const r=sv(((rec&&rec.sinos)||{})[sn]&&rec.sinos[sn][c]); if(nv(r)!==nv(fin.sinos[sn][c])) out.push({sino:+sn, col:c, rec:r, final:sv(fin.sinos[sn][c])}); }));

  /* ── v0.2 T/T 契約の S/I 推薦 (AI なし · 형님 D3) — 同じバイヤーの前の契約の S/I をそのまま · 今回変わるのは 明細 と PO ──
     prev = 同じバイヤーで この契約より前 · S/I がある契約 (新しい順) [{no, date, sis:[S/I 行], details:[前回 S/I 明細]}] · sale = この契約の販売明細 · term · pod (今回のブッキング · 参考) */
  const TT_PO = ['crcf9_po_vo','crcf9_vo_no'], TT_LC = ['cr49f_lc_no'];
  function ttEarlier(c, t){   // 契約日 → 契約番号 の順で前か (a1_bench isEarlier と同じ考え — 同じ番号は前でない)
    const cn=up(c&&c.no), tn=up(t&&t.no); if(!cn||!tn||cn===tn) return false;
    const cd=isoDay(c.date), td=isoDay(t.date);

  const ttCmp = (a,b) => (isoDay(b.date)||'').localeCompare(isoDay(a.date)||'')||up(b.no).localeCompare(up(a.no));   // 新しい順
  const head1 = (p, sn) => ((p&&p.sis)||[]).find(h=>+h.crcf9_sino===sn);

    const prev=(x.prev||[]).slice().sort(ttCmp); if(!prev.length) throw new Error('同じバイヤーの前の契約に S/I がありません — 前回の S/I から作れません');

      /* PO · VO — 同じバイヤーの最近の S/I 3 件 (同じ sino) */

        const rs=recent.filter(p=>head1(p,sn)), own=me&&rs.length>1&&rs.every((p,i)=>vals[i]&&up(vals[i]).indexOf(up(p.no))>=0);   // PO = その契約の番号 (実データ T/T 15 バイヤー中 5 — 2026-11-20)
        let kind; if(vals.length<=1) kind='one'; else if(vals.every(v=>v==='')) kind='blank'; else if(vals.every(v=>v===vals[0])) kind='same'; else kind=own?'ctno':'changes';
        if(kind==='ctno'){ sinos[sn][c]=sv(head1(P,sn)[c]).replace(new RegExp(up(P.no).replace(/[-]/g,'\-'),'gi'),me); b.flag='要確認 · PO = 契約番号 (前回 '+short(vals[0],20)+' → 今回の番号)'; }
        else if(kind==='changes'){ sinos[sn][c]=''; b.flag='要確認 · 毎回変わる (前回: '+(short(vals[0])||'空欄')+')'; }
        else if(kind==='one') b.flag='要確認 · 前回 1 件のみ';

      /* L/C の欄 — T/T なので空欄 · v0.15 (B3): 仮 S/I は XXX (社内の決まり) · L/C でしか決まらない文は 消さずに 「仮 — L/C 着で確認」 */
      if(tent){ const prevLc=h.cr49f_lc_no;

        TT_LC.forEach(c=>{ sinos[sn][c]=V15.LC_TENT_VAL; basis[sn][c]={source:'仮 S/I (L/C 未着)', tent:true, flag:V15.LC_TENT_MARK+' (前回: '+(short(h[c])||'空欄')+')'}; basis[sn][c].basis=basis[sn][c].flag; }); }
      else TT_LC.forEach(c=>{ const was=nv(h[c]); sinos[sn][c]=''; const b=basis[sn][c]={source:'T/T (L/C なし)'}; if(was){ b.flag='要確認 · T/T なので空欄 (前回: '+short(was)+')'; b.basis=b.flag; } else b.ok='一致'; });

  /* ══════════ v0.9 保存の入口 (指示書 書類ツール v0.9 · 형님 D1 · D2 · D3) — 規則 · 表 · 名前はこの 1 か所 ══════════

  /* どの Invoice — ships = [{iv, bkg, bl, cntrs:[…]}] · pdf = {booking, cntrs:[…], text} · hint = {name, subject, prefer}

  /* ══════════ v0.11 チェックポイント (master_checkpoint) · 見落とし報告 — 指示書 (2026-11-23) D00 체크포인트 마스터 v1 Step 3 ══════════

  /* ══════════ v0.15 (指示書 MAC-THOR_5 D00 書類ツール v0.15 · 修正まとめ v0.2) — 規則 · 表 · 語はこの 1 か所 ══════════

}

const spEnc = p => p.split('/').map(encodeURIComponent).join('/');
const drv = () => GRAPH+'drives/'+LEENAI.SP.DRIVE_ID;
async function graphFetch(url, opts, _r){
  _r=_r||0; const tok=await LEENAI.auth.token('graph');
  const res=await fetch(url,Object.assign({},opts||{},{headers:Object.assign({'Authorization':'Bearer '+tok},(opts&&opts.headers)||{})}));
  if(res.status===401&&_r===0) return graphFetch(url,opts,1);
  if((res.status===429||res.status>=500)&&_r<3){ const ra=parseInt((res.headers&&res.headers.get('Retry-After'))||'',10); await sleep(Number.isFinite(ra)?Math.min(ra*1000,30000):1000*Math.pow(2,_r)); return graphFetch(url,opts,_r+1); }
  return res;
}
async function graphJson(url){ const r=await graphFetch(url,{headers:{Accept:'application/json'}}); if(r.status===404) return null; if(!r.ok) throw new Error('Graph '+r.status); return r.json(); }
async function spChildren(path){ let url=drv()+'/root:/'+spEnc(path)+':/children?$select=id,name,folder,file,size,lastModifiedDateTime,webUrl&$top=999', out=[];
  while(url){ const j=await graphJson(url); if(!j) return null; out=out.concat(j.value||[]); url=j['@odata.nextLink']||null; } return out; }
async function spText(path){ const r=await graphFetch(drv()+'/root:/'+spEnc(path)+':/content'); if(r.status===404) return null; if(!r.ok) throw new Error('SP '+r.status); return r.text(); }
async function spPut(p, content, type, save){   // 新規のみ (上書きしない) · v0.9: save = ACL の保存 (保存の入口 · DOC.guardSave)
  DOC.guardOut(p, save);
  const pt=!!(save&&save.portal);   // v0.16: PORTAL のファイルだけ 上書き (If-Match = 読んだ時の eTag · 違えば 412)
  const r=await graphFetch(drv()+'/root:/'+spEnc(p)+':/content'+(pt?'':'?@microsoft.graph.conflictBehavior=fail'),{method:'PUT',headers:Object.assign({'Content-Type':type||'application/json'},pt?{'If-Match':save.ifMatch}:{}),body:new Blob([content],{type:type||'application/json'})});
  if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error('SP PUT '+r.status+': '+(e.error&&e.error.message||'')); }
  return r.json();
}

function folderFromChildren(iv, loc, k, bk){
  const b=bk||S.bk.find(x=>DOC.up(x.cr49f_invoice_no)===iv);
  const files=k.filter(x=>x.file).map(x=>({name:x.name, lastModified:x.lastModifiedDateTime, webUrl:x.webUrl, id:x.id, size:x.size}));
  const subs=k.filter(x=>x.folder);

  const fdTop=DOC.fdFiles(files, iv).length;   // v0.3: 台湾向け — Invoice 番号のフォルダ (IV · PL · B/L まとめ) は FD がないときだけ見る

  return {st:{path:loc.path, webUrl:loc.webUrl, live:!!S.wip[iv], files, subs:subs.map(s=>s.name)}, want};

async function loadFolder(iv, bk){

    for(const sn of F.want){ const c=await spChildren(loc.path+'/'+sn); (c||[]).filter(x=>x.file).forEach(x=>F.st.files.push({name:x.name, sub:sn, lastModified:x.lastModifiedDateTime, webUrl:x.webUrl, id:x.id})); }

/* v0.14 (Step 4-2): Graph $batch — 中は GET だけ (読むだけ · 20 件ずつ) · 429 / 5xx はその分だけ待ってもう一度 · 失敗は呼んだ側が 1 件ずつに戻す */
async function graphBatch(reqs){
  const out={};
  for(let i=0;i<reqs.length;i+=20){ let todo=reqs.slice(i,i+20), tries=0;
    while(todo.length){
      const body=JSON.stringify({requests:todo.map(x=>({id:x.id, method:'GET', url:x.url}))});
      const r=await graphFetch(GRAPH+'$batch',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body});
      if(!r.ok) throw new Error('Graph batch '+r.status);
      const j=await r.json(), again=[]; let wait=1;
      (j.responses||[]).forEach(x=>{ const q=todo.find(t=>t.id===String(x.id)); if(!q) return; if((x.status===429||x.status>=500)&&tries<3){ again.push(q); wait=Math.max(wait,+((x.headers||{})['Retry-After']||1)||1); } else out[q.id]=x; });
      todo=again; if(todo.length){ tries++; await sleep(Math.min(wait*1000,10000)); } } }
  return out;
}
async function loadFoldersBatch(list, seq, onProg){
  const url=p=>'/drives/'+LEENAI.SP.DRIVE_ID+'/root:/'+spEnc(p)+':/children?$select=id,name,folder,file,size,lastModifiedDateTime,webUrl&$top=999';
  const go=[]; list.forEach(iv=>{ const loc=S.wip[iv]||S.old[iv]; if(!loc) S.folders[iv]='missing'; else go.push({iv, loc}); });
  let k=0; const parts=[]; for(let i=0;i<go.length;i+=20) parts.push(go.slice(i,i+20));
  /* 20 件の束を 4 つずつ並べて (1 件ずつ 4 本 と同じ同時数) */
  await mapLimit(parts,4,async part=>{ if(seq!==S.loadSeq) return; const one=[], pend={}, subs=[];
    let res=null; try{ res=await graphBatch(part.map((x,j)=>({id:'f'+j, url:url(x.loc.path)}))); }catch(e){ res=null; }
    part.forEach((x,j)=>{ const r=res&&res['f'+j];
      if(r&&r.status===404){ S.folders[x.iv]='missing'; return; }
      if(!r||r.status!==200||!r.body||r.body['@odata.nextLink']){ one.push(x); return; }   // 今までどおり 1 件ずつ
      const F=folderFromChildren(x.iv, x.loc, r.body.value||[]); pend[x.iv]=F.st; F.want.forEach(sn=>subs.push({x, sn})); });
    if(subs.length){ let r2=null; try{ r2=await graphBatch(subs.map((q,j)=>({id:'s'+j, url:url(q.x.loc.path+'/'+q.sn)}))); }catch(e){ r2=null; }
      subs.forEach((q,j)=>{ const r=r2&&r2['s'+j]; if(!pend[q.x.iv]) return;
        if(r&&r.status===200&&r.body&&!r.body['@odata.nextLink']) (r.body.value||[]).filter(y=>y.file).forEach(y=>pend[q.x.iv].files.push({name:y.name, sub:q.sn, lastModified:y.lastModifiedDateTime, webUrl:y.webUrl, id:y.id}));
        else if(!(r&&r.status===404)){ delete pend[q.x.iv]; if(one.indexOf(q.x)<0) one.push(q.x); } }); }
    Object.keys(pend).forEach(iv=>{ S.folders[iv]=pend[iv]; });
    await mapLimit(one,4,x=>loadFolder(x.iv));
    k+=part.length; if(onProg) onProg(k);
  });
}

const FOLDER_CACHE = {key:'doc_tool_folders_v14', maxH:24};
function folderCacheApply(list){
  const hit=new Set(); let c=null; try{ c=JSON.parse(lsGet(FOLDER_CACHE.key,'null')); }catch(e){ c=null; }
  if(!c||!c.f||!(Date.now()-(c.at||0)<FOLDER_CACHE.maxH*3600e3)) return hit;
  list.forEach(iv=>{ const loc=S.wip[iv]||S.old[iv], e=c.f[iv]; if(!loc||!e||!loc.sig||e.sig!==loc.sig||e.path!==loc.path) return;

/* 保存 — 直前に読み直し → その Invoice のその欄だけ → eTag 条件 PUT (412 → 読み直して 1 回だけやり直し · それでも → 「他の人が更新しました」) */
const PTSAVE = {busy:{}, n:0};
async function ptSave(ivRaw, field, value){
  const P=DOC.PT, test=saveTest(), path=test?P.TEST_PATH:P.PATH, key=ivRaw+'|'+field;
  if(PTSAVE.busy[key]) return {ok:false, msg:'保存中です'}; PTSAVE.busy[key]=1;
  try{
    for(let n=0;n<2;n++){
      const meta=await graphJson(drv()+'/root:/'+spEnc(path)+'?$select=id,eTag');
      if(!meta||!meta.eTag) return {ok:false, msg:(test?'試験用の写し':'PORTAL のファイル')+' がありません: '+path};
      const t=await spText(path); if(t==null) return {ok:false, msg:'ファイルを読めません: '+path};
      const M=DOC.ptMerge(t, ivRaw, field, value, (LEENAI.user&&(LEENAI.user.name||LEENAI.user.email))||'', new Date().toISOString());
      if(!M.changed){ ptApply(M, ivRaw, test); return {ok:true, same:true}; }
      try{ await spPut(path, M.text, 'application/json', {portal:true, ifMatch:meta.eTag}); PTSAVE.n++; ptApply(M, ivRaw, test); return {ok:true, retry:n}; }
      catch(e){ if(!/SP PUT 412/.test(e.message)) throw e; if(n===1) return {ok:false, conflict:true, msg:P.CONFLICT}; }
    }
    return {ok:false, conflict:true, msg:P.CONFLICT};
  }finally{ delete PTSAVE.busy[key]; }
}
/* 保存した内容を画面に — 本番 = 読み直したファイル全部 (ほかの人の変更も) · 試験 = その Invoice だけ */
function ptApply(M, ivRaw, test){
  if(!test&&M.obj) TODO.portal={shipping:M.obj.shipping||{}, records:M.obj.records||{}};
  else { TODO.portal=TODO.portal||{shipping:{},records:{}}; TODO.portal.shipping[ivRaw]=JSON.parse(JSON.stringify(M.entry)); }
}
async function ptSaveUi(el, ivRaw, field, value){

const ACL_ENGINE = {commit:'b4c4b882afc52ae176404dcc957acc59cdf39964', sha256:'741935181889d595e05d856f8e370c807ad6dfa201306d12fb9e6bf323b98cf7', ver:'0.20'};   // v0.22: エンジン v0.19 (電話 · 郵便番号 = 表記差 · 読めず欄の 3 回目 · 結果の並び v22)   // v0.21: エンジン v0.18 (新しい試験の行のコード判定 CP_CODE · S/I 段階 siCheck)   // v0.19: エンジン v0.17 (40HCR = 45R)   // v0.18 (T-1): エンジン v0.16 (形態 HC 表記 · 複合輸送の空欄 = 参考 · RECIEVED BY CARRIER = 対象外 · 乙仲の過去の誤記 · NACCS の判定は v0.15 と同じ)   // v0.17 (G10): エンジン v0.14 (スキャン ACL の AI 判読 2 回 · NACCS の判定は v0.13 と同じ) — 토르_10 が終わったら その版へ   // v0.13: エンジン v0.13 (画面の韓国語なし · 判定は v0.12 と同じ)   // v0.12: エンジン v0.12 (CP-A01 の 末尾の , ; : · B/L Draft と共通の部品)   // v0.11: エンジン v0.11 (チェックポイント · 港の別名)   // v0.10: エンジン v0.10 (L/C 保管所 lc_read/1 · Consignee 銀行 · 船積期限 ↔ ETD) · v0.8: エンジン v0.9 (表記 · 読み · 担当者メール判断 · Shipper's Mail 空欄 参考 · L/C JSON 照合 · ACL が多く書いた = 参考 · * の続き)   // v0.6: エンジン v0.8 (コンテナ別記載の指示 ✓ → コンテナの行 ある · （仮） = siTentative) · v0.5: エンジン v0.7 (ハイフン = 表記差 · 乙仲への指示 · コンテナ別記載の指示) · v0.4: v0.6 (最終確認)

let ACLX = null;
async function sha256hex(buf){ const h=await crypto.subtle.digest('SHA-256',buf); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join(''); }

async function loadAclEngine0(){

  const bk=await dvAll(`cr49f_bookings?$filter=cr49f_invoice_no eq '${inv}'&$select=cr49f_bookingid,cr49f_booking_no,cr49f_bl_number,cr49f_main_ship_name,cr49f_invoice_no,crcf9_delivery_location,_cr49f_sale_contract_id_value,_cr49f_region_japan_id_value,_cr49f_region_id_value,_cr49f_carrier_id_value,_cr49f_fowarder_id_value,modifiedon,cr49f_etd,crcf9_bl_etd`);
  if(!bk.length) return {ok:false, reason:'COMPASS に Invoice '+inv+' のブッキングなし'};

  if(b._cr49f_region_id_value){ try{ pod=(await dvGet(`cr49f_regions(${b._cr49f_region_id_value})?$select=cr49f_pod`)).cr49f_pod||''; }catch(e){} }
  const containers=await dvAll(`crcf9_container_informations?$filter=_crcf9_booking_id_value eq ${b.cr49f_bookingid}&$select=crcf9_container_informationid,crcf9_container_no,crcf9_seal_no,crcf9_type,crcf9_quantity,crcf9_n_w,crcf9_g_w,crcf9_t_w,_crcf9_sale_detail_id_value`);
  let sis=[]; const details={}; const cid=b._cr49f_sale_contract_id_value;
  if(cid){
    sis=await dvAll(`cr49f_s_is?$filter=_cr49f_sale_contract_id_value eq ${cid}&$select=cr49f_s_iid,crcf9_sino,cr49f_lc_no,crcf9_consignee,crcf9_notify_party,crcf9_address,crcf9_tel,crcf9_fax,crcf9_place_of_delivery_1,crcf9_place_of_delivery_2,crcf9_place_of_delivery_3,crcf9_pod_bl1,crcf9_pod_bl2,crcf9_pod_bl3,crcf9_bl_text1,crcf9_bl_text2,crcf9_shipper,crcf9_shipper_address,crcf9_shipper_tel,crcf9_shipper_fax,crcf9_shipping_mark,crcf9_local_agent_note,crcf9_payment_classification&$orderby=crcf9_sino asc`);
    for(const s of sis) details[s.cr49f_s_iid]=await dvAll(`crcf9_s_i_details?$filter=_crcf9_s_i_id_value eq ${s.cr49f_s_iid}&$select=crcf9_productname,_crcf9_sale_detail_id_value,crcf9_hs_code,modifiedon`);
  }
  const meta={carrier:FV(b,'_cr49f_carrier_id_value'), forwarder:FV(b,'_cr49f_fowarder_id_value'), contract:'', buyer:'', buyerCode:'', country:'', pay:''};
  if(cid){ try{ const sc=await dvGet(`cr49f_sale_contracts(${cid})?$select=cr49f_sale_contract_no,cr49f_pay_cls,_cr49f_buyer_id_value`); meta.contract=sc.cr49f_sale_contract_no||''; meta.pay=FV(sc,'cr49f_pay_cls')||sc.cr49f_pay_cls||'';
      if(sc._cr49f_buyer_id_value){ const by=await dvGet(`cr49f_buyers(${sc._cr49f_buyer_id_value})?$select=cr49f_buyer,cr49f_buyer_code,crcf9_country`); meta.buyer=by.cr49f_buyer||FV(sc,'_cr49f_buyer_id_value'); meta.buyerCode=by.cr49f_buyer_code||''; meta.country=FV(by,'crcf9_country')||by.crcf9_country||''; } }catch(e){ meta.error=String(e.message||e); } }
  const s1=ACLX.pickBlSi(sis); if(!meta.pay&&s1) meta.pay=FV(s1,'crcf9_payment_classification')||s1.crcf9_payment_classification||'';
  const fid=b._cr49f_fowarder_id_value; if(fid){ try{ const f=await aclForwarder(fid); meta.forwarderCompany=f.company; meta.forwarderPort=f.port; meta.forwarderTo=f.to; meta.forwarderCc=f.cc; }catch(e){ meta.forwarderError=String(e.message||e); } }
  /* v0.10: ETD = crcf9_bl_etd (B/L date) 優先 · なければ cr49f_etd (前 10 桁) — エンジン v0.10 の 船積期限 照合 (acl_bench fetchCompass と同じ) */
  meta.etd=String(b.crcf9_bl_etd||b.cr49f_etd||'').slice(0,10); meta.etdSrc=b.crcf9_bl_etd?'B/L date':b.cr49f_etd?'ETD':'';
  /* v0.10: L/C 取引 → 保管所の L/C 判読 (古紙/LC/_READ/{契約}.json 1 つ · lc_read/1) — エンジン v0.10 の L/C 照合に渡す (読むだけ · なければ 「保管所に未登録」) */
  let lc=null; if(String(meta.pay||'').toUpperCase()==='LC'&&meta.contract){ if(!S.lcFiles) await loadLcFiles(); const f=((S.lcFiles&&S.lcFiles[DOC.up(meta.contract)])||[])[0]; if(f){ try{ const t=await spText(DOC.SRC.lc+'/'+f.name); const j=t?JSON.parse(t):null; if(j&&j.schema==='lc_read/1') lc=j; else meta.lcError='保管所の形が違う'; }catch(e){ meta.lcError=String(e.message||e); } } }

}

async function ensurePdfJs(){
  if(window.pdfjsLib) return;
  await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=PDFJS+'pdf.min.js'; s.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; res(); }; s.onerror=rej; document.head.appendChild(s); });
}
async function readPdf(file){
  const r=await graphFetch(drv()+'/items/'+file.id+'/content'); if(!r.ok) throw new Error('PDF 取得 '+r.status);
  const buf=await r.arrayBuffer(), raw=buf.slice(0); await ensurePdfJs();   // v0.17 (G10): raw = 元の PDF の写し (pdf.js に渡すと元のバッファは空になる — acl_bench v0.14 と同じ)
  let task=null, pdf=null;
  try{
    task=window.pdfjsLib.getDocument({data:new Uint8Array(buf), cMapUrl:CMAPS, cMapPacked:true}); pdf=await task.promise; const pages=[];
    for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i), vp=pg.getViewport({scale:1}), tc=await pg.getTextContent();
      pages.push({page:i, w:vp.width, items:tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({s:it.str, x:Math.round(it.transform[4]*10)/10, y:Math.round(it.transform[5]*10)/10, w:Math.round((it.width||0)*10)/10}))}); }
    pages.raw=raw;   // v0.17 (G10): スキャン ACL の sha256 (AI 判読の保存の名前)
    return pages;
  }finally{ const h=pdf||task; if(h) try{ await h.destroy(); }catch(e){} }   // 読み終えたら必ず閉じる (acl_bench v0.3.1)
}
/* この Invoice 1 件だけ照合 — acl_bench runCompare の 1 件分と同じ手順 · 結果の形も同じ */
/* v0.17 (G10): スキャン ACL の AI 判読 (acl_bench v0.14 が保存 · 読むだけ) → {m (readNaccs と同じ形 + ai)} | {why, ai} */
const SCAN_AI_DIR = DOC.SRC.acl+'/_scan_ai';
async function scanAiFor(E, raw, fmt){
  /* v0.18 (T-1): スキャン = {sha256}.json (NACCS) → NACCS でなければ {sha256}.other.json (乙仲様式) · 文字のある 乙仲様式 (OTHER) = {sha256}.other.json だけ — どれも acl_bench が保存 · この TOOL は AI を呼ばない */
  if(!raw) return {why:'AI 判読なし'};
  const sha=await sha256hex(raw), rd=async ext=>{ const t=await spText(SCAN_AI_DIR+'/'+sha+ext); const j=t?JSON.parse(t):null; return j&&j.schema==='acl_scan_ai/1'&&(j.reads||[]).length===2?j:null; };
  /* v0.22 (V3): 「読めず」 欄の 3 回目 (acl_bench v0.19 が保存 · 読むだけ) — あれば scanMerge に渡す · 3 回目の枠を その欄に (書類の表示で 枠) */
  const rd3=async ext=>{ try{ const t=await spText(SCAN_AI_DIR+'/'+sha+ext); const j=t?JSON.parse(t):null; return j&&j.schema==='acl_scan_r3/1'?j:null; }catch(e){ return null; } };
  const mg=async(j,o)=>{ const r3=E.scanApplyR3?await rd3(o?'.other.r3.json':'.r3.json'):null, m=E.scanMerge(j.reads[0], j.reads[1], Object.assign({model:j.model, sha256:sha, cost_usd:j.cost_usd, at:j.at}, o?{other:true}:{}, r3?{r3}:{}));
    if(r3) Object.keys(r3.fields||{}).forEach(k=>{ if(m.fields[k]&&r3.fields[k]&&r3.fields[k].box) m.fields[k].box=r3.fields[k].box; }); return m; };
  let ai=null;
  try{ if(fmt!=='OTHER'){ const j=await rd('.json'); if(j){ const m0=E.scanMerge(j.reads[0], j.reads[1], {model:j.model, sha256:sha}); if(E.scanLayoutOk(m0)) return {m:await mg(j,false)}; ai=m0.ai; } }
    const o=await rd('.other.json'); if(o) return {m:await mg(o,true)}; }catch(e){ return {why:'AI 判読を読めない'}; }
  return ai?{why:E.SCAN_NOT_NACCS, ai}:{why:'AI 判読なし（acl_bench で読むと照合できます）'};
}
async function aclCompareOne(iv){
  const E=await loadAclEngine(), f=S.folders[iv];
  if(!f||!f.files) throw new Error('Invoice フォルダを読めていません');
  /* v0.3: ファイルは エンジン (v0.4: v0.6) の aclPick (DR · ACL-番号 · 本登録 … · 正式がなければ 仮 — 형님 D3) で選ぶ — 現況板と同じ規則 */
  const b=S.bk.concat(S.extraBk||[]).find(x=>DOC.up(x.cr49f_invoice_no)===iv)||{}, P=DOC.aclPick(f.files, iv, {booking:b.cr49f_booking_no||'', others:bkNos().filter(n=>n!==b.cr49f_booking_no)});
  if(!P.pick) throw new Error('ACL (DR) のファイルがありません');
  const A=[P.pick].concat(P.scan.formal.concat(P.scan.temp).filter(a=>a!==P.pick));
  const rel=E.relPath('/drives/'+LEENAI.SP.DRIVE_ID+'/root:/'+f.path), fo=a=>({id:a.f.id, name:a.f.name, size:a.f.size, lastModifiedDateTime:a.f.lastModified, path:rel});
  const t={invoice:iv, file:fo(A[0]), aclVersion:P.label, others:A.slice(1).map(fo)};
  const r={invoice:t.invoice, file:t.file.path+'/'+t.file.name, fileModified:t.file.lastModifiedDateTime||'', aclVersion:t.aclVersion||'', others:(t.others||[]).map(o=>o.path+'/'+o.name), format:'', verdict:'', items:[], kinds:{}, xx:[]};
  const pages=await readPdf(t.file), fm=E.classifyFormat(pages); r.format=fm.format;
  /* v0.17 (G10): スキャン ACL — acl_bench が保存した AI 判読 (ACL_bench/_scan_ai/{sha256}.json · 2 回) を読む (この TOOL は AI を呼ばない) · NACCS 様式と 2 回とも答えたものだけ 照合 */
  let sc=null; if(fm.format==='SCAN'||fm.format==='OTHER'){ const x=await scanAiFor(E, pages.raw, fm.format); if(x.m) sc=x.m; else { r.verdict='読取対象外'; r.why=(fm.why||'')+' — '+x.why; r.kinds={['読取対象外:'+fm.format]:1}; if(x.ai) r.ai=x.ai; return r; } }
  if(fm.format!=='NACCS'&&!sc){ r.verdict='読取対象外'; r.why=fm.why; r.kinds={['読取対象外:'+fm.format]:1}; return r; }
  const cp=await aclFetchCompass(t.invoice);
  if(!cp.ok){ r.verdict='COMPASS照会不可'; r.why=cp.reason; r.kinds={'COMPASS照会不可':1}; if(sc) r.ai=sc.ai; return r; }
  const rules=await aclRules(), cpx=await cpLoad(), acl=sc||E.readNaccs(pages), c=E.compareOne(acl,cp,{rules:rules.rules, meta:cp.meta, podExclude:rules.podExclude||[], fileModified:r.fileModified, checkpoints:cpx||undefined, lcText:await lcTextOf(cp.lc)});   // v0.11: チェックポイント (読めなければ v0.10 と同じ)
  r.cp={booking_no:cp.booking.cr49f_booking_no||'', bl_number:cp.booking.cr49f_bl_number||''}; r.meta=cp.meta;
  Object.assign(r,c,{sino:c.expected.sino, bookings:cp.bookings}); delete r.expected; r.read={fields:acl.fields, rows:acl.rows, totals:acl.totals};
  if(cp.bookings>1) r.items.push({group:'ブッキング',key:'multi',label:'同じ Invoice のブッキング',status:'INFO',expected:'',actual:cp.bookings+' 件',detail:'最初の 1 件で照合',kind:''});
  r.rules={loaded:rules.loaded, acl_rules:rules.rules.length, warnings:rules.warnings};
  return r;
}

/* TO BANK の頁を 灰色 150 dpi の PNG に (pdf.js) */
async function fdPagePng(pdf, n){ const pg=await pdf.getPage(n), vp=pg.getViewport({scale:150/72}), cv=document.createElement('canvas'); cv.width=Math.ceil(vp.width); cv.height=Math.ceil(vp.height);
  const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); await pg.render({canvasContext:ctx, viewport:vp}).promise;
  const g=document.createElement('canvas'); g.width=cv.width; g.height=cv.height; const gx=g.getContext('2d'); gx.filter='grayscale(1)'; gx.drawImage(cv,0,0);
  return g.toDataURL('image/png').split(',')[1]; }

/* v0.22: AI を呼ぶ所は ここ 1 か所 (TO BANK の頁の判別 · 保険証券) — 429 / 5xx は 待って やり直し · 戻り値 = 返事の JSON */
async function aiPost(key, body){
  for(let i=0;i<4;i++){ const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
    if(r.status===429||r.status>=500){ await sleep(3000*(i+1)); continue; } const j=await r.json(); if(!r.ok) throw new Error('AI '+r.status+' '+String(j&&j.error&&j.error.type||'')); return j; }
  throw new Error('AI が混んでいます (429)'); }
const aiText = j => (j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');
async function fdAsk(F, key, b64){ const j=await aiPost(key, {model:F.AI.model, max_tokens:2000, output_config:{effort:F.AI.effort}, messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/png',data:b64}},{type:'text',text:F.AI.prompt}]}]});
  return {res:F.AI.parse(aiText(j)), cost:F.AI.cost(j.usage)}; }
/* TO BANK の AI 判別 — 保存本があれば それ (AI 0) · なければ キーがあれば 実行 → 保存本 + 費用の記録 */
async function fdTbAi(F, iv, tb, onProg){
  const r=await graphFetch(drv()+'/items/'+tb.id+'/content'); if(!r.ok) throw new Error('TO BANK を読めない ('+r.status+')'); const buf=await r.arrayBuffer(), sha=await sha256hex(buf.slice(0));
  const cachePath=F.AI.cachePath(sha); let cache=null; try{ const t=await spText(cachePath); cache=t?JSON.parse(t):null; }catch(e){ cache=null; }
  await ensurePdfJs(); const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise, nP=pdf.numPages;
  try{
    if(F.AI.usable(cache,sha)&&!F.AI.pending(cache,nP).length) return {ai:cache, sha, from:'saved'};
    const key=lsGet(LS.apikey,''); if(!key) return {ai:null, sha, from:'nokey'};
    const C={schema:F.AI.schema, sha256:sha, file:tb.name, iv, model:F.AI.model, effort:F.AI.effort, dpi:F.AI.dpi, gray:true, pages:[], cost:0, by:S.me.code||'', at:''};
    const todo=Array.from({length:nP},(_,i)=>i+1); let done=0;
    await mapLimit(todo,3,async n=>{ const b64=await FD_PNG.fn(pdf,n); const [a,b]=await Promise.all([fdAsk(F,key,b64),fdAsk(F,key,b64)]); C.pages.push({page:n, r1:a.res, r2:b.res}); C.cost+=a.cost+b.cost; done++; if(onProg) onProg(done,nP); });
    C.pages.sort((x,y)=>x.page-y.page); C.at=new Date().toISOString();
    try{ await spPut(cachePath, JSON.stringify(C), 'application/json'); }catch(e){ /* 他の人が先に保存 (409) — その保存本を使ってよい */ }
    try{ const d=C.at.slice(0,10).replace(/-/g,''); await spPut(DOC.V21.COST_DIR+d+'/'+DOC.safeKey(iv)+'_'+DOC.utcStamp()+'.json', JSON.stringify({iv, sha256:sha, file:tb.name, pages:nP, reads:nP*2, usd:Math.round(C.cost*10000)/10000, model:C.model, by:C.by, at:C.at}), 'application/json'); }catch(e){}
    return {ai:C, sha, from:'run', cost:C.cost};
  }finally{ try{ await pdf.destroy(); }catch(e){} }
}

    let cache=null; try{ const t=await spText(cp); cache=t?JSON.parse(t):null; }catch(e){ cache=null; }
    if(F.INS_AI.usable(cache,sha)){ const mg=F.insMerge(cache); if(mg&&mg.blank&&!noPol) continue; return {ins:cache, from:'saved'}; }
    const key=lsGet(LS.apikey,''); if(!key) return {ins:null, from:'nokey'};
    await ensurePdfJs(); const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(buf), cMapUrl:CMAPS, cMapPacked:true}).promise, n=pdf.numPages;
    try{ const C={schema:F.INS_AI.schema, sha256:sha, file:p.file, iv, by:p.by, model:F.INS_AI.model, effort:F.INS_AI.effort, dpi:F.INS_AI.dpi, gray:true, cost:0, who:S.me.code||'', at:''}; let pages=p.pages;
      if(!pages){ if(say) say('保険証券の頁を探しています (AI)…'); const ct=[]; for(let i=1;i<=n;i++){ ct.push({type:'text', text:'Page '+i+':'}); ct.push({type:'image', source:{type:'base64', media_type:'image/png', data:await INS_PNG.fn(pdf,i,F.INS_AI.thumbDpi)}}); }

      pages=(pages||[]).filter(x=>x<=n).slice(0,F.INS_AI.maxPages); C.pages=pages;
      if(!pages.length) C.reads=[{is_insurance:false},{is_insurance:false}];
      else { if(say) say('保険証券を読んでいます (AI 2 回)…'); const im=[]; for(const g of pages) im.push({type:'image', source:{type:'base64', media_type:'image/png', data:await INS_PNG.fn(pdf,g,F.INS_AI.dpi)}});
        const [a,b]=await Promise.all([1,2].map(()=>insAsk(F, key, im.concat([{type:'text', text:F.INS_AI.readPrompt}])))); C.cost+=a.cost+b.cost; C.reads=[a.j,b.j]; }
      C.cost=Math.round(C.cost*10000)/10000; C.at=new Date().toISOString();
      try{ await spPut(cp, JSON.stringify(C), 'application/json'); }catch(e){ /* 他の人が先に保存 (409) */ }
      try{ const d=C.at.slice(0,10).replace(/-/g,''); await spPut(DOC.V21.COST_DIR+d+'/'+DOC.safeKey(iv)+'_ins_'+DOC.utcStamp()+'.json', JSON.stringify({iv, kind:'insurance', sha256:sha, file:p.file, pages:pages.length, usd:C.cost, model:C.model, by:C.who, at:C.at}), 'application/json'); }catch(e){}
      const mg=F.insMerge(C); if(mg&&mg.blank&&!noPol) continue; return {ins:C, from:'run', cost:C.cost};
    }finally{ try{ await pdf.destroy(); }catch(e){} } }
  return {ins:null, from:'none'}; }

      let alias=[]; try{ alias=await LEENAI.master.get('port_alias',force?{fresh:true}:undefined)||[]; }catch(e){ alias=[]; }

    '<div class="dt-actions">'+(S.me.admin?'<button class="dt-btn ghost" id="dtCpTrial">試験チェックポイント実績</button>':'')+'<button class="dt-btn ghost" data-close>閉じる</button></div>');
  bindClose(); const ct=$('dtCpTrial'); if(ct) ct.onclick=()=>cpTrialStatsModal();   // v0.21
  $('dtModalBox').querySelectorAll('.cp-f').forEach(el=>{ const go=()=>{ CPF[el.dataset.f]=el.value; cpListRender(); const n=$('dtModalBox').querySelector('.cp-f[data-f="'+el.dataset.f+'"]'); if(n&&el.dataset.f==='q'){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } };
    if(el.tagName==='SELECT') el.onchange=go; else el.oninput=go; });
  $('dtModalBox').querySelectorAll('[data-cpd]').forEach(b=>{ b.onclick=()=>cpDetailModal(b.dataset.cpd, true); });
}
/* ── 1 行の説明 (一覧から · ACL 結果の CP 番号から) ── */
async function cpDetailModal(id, fromList){
  await cpLoad(); const E=S.aclE||ACLX, r=CPS.prep&&CPS.prep.rows.find(x=>x.id===id);
  if(!r||(!S.me.admin&&DOC.cpVisible([r],false).length===0)){ modal('<div class="dt-h">'+esc(id)+'</div><div class="dt-note">'+esc(CPS.prep?'この番号は一覧にありません':CPS.err||'読めません')+'</div><div class="dt-actions"><button class="dt-btn ghost" data-close>閉じる</button></div>'); bindClose(); return; }
  const row=r.row||{}, O=E.cpOp(r.op), cat=E.cpCatalog(), nm=n=>{ const c=cat.find(x=>x.name===n)||(/^text:/.test(n)?{label:'「'+n.slice(5)+'」'}:/^si\./.test(n)?{label:'S/I の欄 '+n.slice(3)}:/^booking\./.test(n)?{label:'ブッキングの欄 '+n.slice(8)}:null); return c?c.label:n; };
  const how=r.kind==='追加'&&r.engine_key&&!r.op?'エンジンのコードで判定 ('+r.engine_key+')':r.kind==='追加'||r.op?(O?'「'+nm(r.left)+'」と「'+nm(r.right)+'」を — '+E.CP_OPS[O.name].ja+(O.p?' ('+O.p+')':''):r.op?'(比べ方 '+r.op+' はない)':''):'';
  const kv=(k,v)=>v?'<tr><th>'+esc(k)+'</th><td>'+v+'</td></tr>':'';
  modal('<div class="dt-h"><span class="cp-id">'+esc(r.id)+'</span> '+esc(r.title)+'</div>'+
    '<table class="cp-kv">'+kv('なぜ必要か',esc(row.why_ja||''))+kv('実例',(()=>{ const x=DOC.cpExample(row.example); return x.text||x.ivs.length?(x.ivs.length?'<b>根拠 Invoice</b> '+esc(x.ivs.join(' · '))+'<br>':'')+esc(x.text):'<span class="dt-note">—（まだありません）</span>'; })())+kv('比べ方',esc(how))+kv('結果',esc(r.result+(r.kind==='追加'?' (違ったとき)':'')))+
      kv('段階',esc((r.stages||[]).map(s=>DOC.CP_STAGE_JA[s]||s).join(' · ')))+kv('範囲',esc((r.pay==='ALL'?'全取引':r.pay==='LC'?'L/C 取引':r.pay)+(r.scope_type!=='all'?' · '+(DOC.CP_SCOPE_JA[r.scope_type]||r.scope_type)+' '+r.scope:'')))+
      kv('状態',esc(r.state+(r.why&&S.me.admin?' — '+r.why:'')))+kv('承認',esc([row.approved_by?staffName(row.approved_by):'',row.approved_at||''].filter(Boolean).join(' · ')))+
      (S.me.admin?kv('試験結果',esc(row.trial||''))+kv('報告者',esc(row.reported_by||''))+kv('エンジン項目',esc(r.engine_key||''))+kv('メモ',esc(row.note||'')):'')+'</table>'+
    '<div class="dt-actions">'+(fromList?'<button class="dt-btn ghost" id="dtCpBack">一覧へ</button>':'<button class="dt-btn ghost" id="dtCpAll">チェックポイント一覧</button>')+'<button class="dt-btn ghost" data-close>閉じる</button></div>');
  bindClose(); const b=$('dtCpBack')||$('dtCpAll'); if(b) b.onclick=()=>cpListModal();
}
function bindClose(){ $('dtModalBox').querySelectorAll('[data-close]').forEach(b=>{ b.onclick=closeModal; }); }
/* ── 見落とし報告 (入力 → SharePoint D-00/checkpoint_reports/ に新規 1 つ) ── */
function cpReportModal(iv){
  const cur=iv||(S.cur&&S.cur.iv)||'';
  modal('<div class="dt-h">見落とし報告</div><div class="dt-note">チェックで見つけられなかった違いを教えてください。管理者がチェックポイント（確認項目）を 1 行足すかを決めます。</div>'+
    '<label class="dt-note">Invoice</label><input class="dt-in" id="cpRIv" style="height:36px" value="'+esc(cur)+'" placeholder="例 NXX2611-01">'+
    '<label class="dt-note">段階</label><select class="dt-in" id="cpRStage" style="height:36px"><option value="">（選ぶ）</option>'+DOC.CP_REPORT_STAGES.map(s=>'<option>'+esc(s)+'</option>').join('')+'</select>'+
    '<label class="dt-note">何が違っていたか（必須）</label><textarea class="dt-in" id="cpRWhat" rows="4" style="padding:8px 10px" placeholder="例 ACL の Consignee の銀行名が L/C と違っていた (CO., LTD. → COMPANY LIMITED)"></textarea>'+
    '<label class="dt-note">どこで気づいたか</label><input class="dt-in" id="cpRWhere" style="height:36px" placeholder="例：銀行からの Discrepancy 通知 · B/L Draft を見て">'+
    '<div id="cpRSt" class="dt-note"></div><div class="dt-actions"><button class="dt-btn" id="cpRSend">送る（保存）</button><button class="dt-btn ghost" data-close>やめる</button></div>');
  bindClose();
  $('cpRSend').onclick=async()=>{ const st=$('cpRSt'), btn=$('cpRSend'); let body;
    try{ const d=new Date(); body=DOC.cpReportBody({invoice:$('cpRIv').value, stage:$('cpRStage').value, what:$('cpRWhat').value, where:$('cpRWhere').value},
      {code:S.me.code, name:S.me.name, email:(LEENAI.user&&LEENAI.user.email)||'', at:d.toISOString(), tool:'書類ツール v'+CFG.version});
      btn.disabled=true; st.textContent='保存中…'; await spPut(DOC.cpReportPath(d, S.me.code||'UNKNOWN'), JSON.stringify(body,null,1));
      closeModal(); toast('見落とし報告を保存しました — ありがとうございます','ok'); CPS.reports=null; cpReportsLoad(); }
    catch(e){ btn.disabled=false; st.innerHTML='<span class="dt-c-diff">'+esc(e.message||e)+'</span>'; } };
}
/* ── 管理者: 見落とし報告 n 件 (未確認) ── */
async function cpReportsLoad(){
  if(!S.me.admin) return;
  try{ const k=await spChildren(DOC.CP_REPORT_DIR.replace(/\/$/,'')); CPS.names=(k||[]).filter(x=>x.file).map(x=>x.name); CPS.reports=DOC.cpReportsState(CPS.names); CPS.repErr=''; }
  catch(e){ CPS.reports=DOC.cpReportsState([]); CPS.repErr=e.message; }
  renderCpBadge();
}
function renderCpBadge(){
  const r=document.getElementById('ln-hdr-right'); if(!r) return; let b=$('dtCpRep');
  if(!b){ b=document.createElement('button'); b.id='dtCpRep'; b.className='dt-badge cp-rep'; b.onclick=()=>cpReportsModal(); const t=$('dtTrial'); if(t) t.appendChild(b); else r.insertBefore(b, r.firstChild); }
  const n=S.me.admin&&CPS.reports?CPS.reports.unread:0; b.hidden=!n; b.textContent='見落とし報告 '+n+' 件 (未確認)';
}
async function cpReportsModal(){
  modal('<div class="dt-h">見落とし報告</div><div class="dt-note">読み込み中…</div>');
  await cpReportsLoad(); const R=CPS.reports||{reports:[]};
  const list=await Promise.all(R.reports.slice(0,60).map(async x=>{ let j=null; try{ const t=await spText(DOC.CP_REPORT_DIR+x.name); j=t?JSON.parse(t):null; }catch(e){} return Object.assign({},x,{j}); }));
  modal('<div class="dt-h">見落とし報告 <span class="dt-note">'+R.reports.length+' 件 · 未確認 '+R.unread+'</span></div>'+(CPS.repErr?'<div class="dt-c-diff">'+esc(CPS.repErr)+'</div>':'')+
    '<div class="cp-list">'+(list.map(x=>{ const j=x.j||{}; return '<div class="cp-rep-row"><div><b>'+esc(j.invoice||'—')+'</b> <span class="dt-note">'+esc([j.stage,staffName(j.by||x.code),jstHM(j.at)].filter(Boolean).join(' · '))+'</span></div>'+
      '<div>'+esc(j.what||'(読めない)')+'</div>'+(j.where?'<div class="dt-note">気づいた所: '+esc(j.where)+'</div>':'')+
      '<div>'+(x.acked?'<span class="cp-st cp-st-on">確認済み</span>':'<button class="dt-btn ghost sm" data-ack="'+esc(x.name)+'">確認済みにする</button>')+'</div></div>'; }).join('')||'<div class="dt-note">報告はありません</div>')+'</div>'+
    '<div class="dt-note">チェックポイントに足すときはリナイが 1 行を作り、過去の書類で試してから社長が承認します（DOC-D-00 §2-13）。メール · Teams の自動送信はしていません。</div>'+
    '<div class="dt-actions"><button class="dt-btn ghost" data-close>閉じる</button></div>');
  bindClose();
  $('dtModalBox').querySelectorAll('[data-ack]').forEach(b=>{ b.onclick=async()=>{ b.disabled=true; try{ await spPut(DOC.cpAckPath(b.dataset.ack), JSON.stringify({schema:'checkpoint_report_ack/1', report:b.dataset.ack, by:S.me.code, at:new Date().toISOString()})); toast('確認済みにしました','ok'); cpReportsModal(); }catch(e){ b.disabled=false; toast('保存できません: '+e.message,'warn'); } }; });
}
/* ── 今日やること の帯 — 新しいチェック (有効になって 7 日 · 自分の担当の範囲) ── */
function cpSeen(){ try{ return JSON.parse(lsGet(LS_CP_SEEN,'[]'))||[]; }catch(e){ return []; } }
function cpBannerHtml(){
  if(!CPS.prep) return ''; const buyerIv={}; Object.keys(S.ct||{}).forEach(id=>{ const c=S.ct[id]||{}, b=S.buyers[c._cr49f_buyer_id_value]||{}, code=DOC.ctCode(c.cr49f_sale_contract_no||''); if(b.cr49f_buyer&&code) buyerIv[String(b.cr49f_buyer).toUpperCase()]=code; });   // バイヤー名 → IV コード (契約番号から)
  const rows=DOC.cpNewFor(CPS.prep.rows, S.me, S.docStaff, buyerIv, S.today, cpSeen()); if(!rows.length) return '';
  return rows.map(r=>'<div class="dt-card cp-new"><span class="cp-id">新しいチェック</span><span>'+esc(r.title)+'</span><button class="dt-a" data-cpd="'+esc(r.id)+'">詳しく</button><button class="dt-btn ghost sm" data-cpseen="'+esc(r.id)+'">確認しました</button></div>').join('');
}
function cpBannerBind(box){
  box.querySelectorAll('[data-cpd]').forEach(b=>{ b.onclick=()=>cpDetailModal(b.dataset.cpd); });
  box.querySelectorAll('[data-cpseen]').forEach(b=>{ b.onclick=()=>{ const s=cpSeen(); if(s.indexOf(b.dataset.cpseen)<0) s.push(b.dataset.cpseen); lsSet(LS_CP_SEEN, JSON.stringify(s)); renderTodo(); }; });
}

const CFG = {
  sys:'D-00', name:'書類ツール', version:'0.22.1', date:'2026-11-25',
  desc:'書類担当の今日の仕事と、ACL・B/L Draft・S/I の確認をまとめたツールです（試験運用中）',   // v0.17 (D1)
  graphScopes:['Sites.ReadWrite.All'],   // 書き込みは D-00/doc_tool/ の下 (履歴 · S/I 控え) · v0.11 D-00/checkpoint_reports/ (見落とし報告 · 確認済み — 新規だけ) — DOC.guardOut
  redirectUri:'https://mhlee205.github.io/DOC_TOOL/',
  onReady:startPage
};
LEENAI.init(CFG);
